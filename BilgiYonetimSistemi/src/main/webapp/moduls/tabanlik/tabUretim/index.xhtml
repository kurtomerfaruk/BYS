<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces">

    <h:form id="TabUretimForm">

        <p:panel header="#{messages.uretimTakip}" styleClass="w-100 mb-3">
            <p:panelGrid columns="2" layout="tabular" styleClass="w-100">

                <p:outputLabel value="#{messages.talepLabel}" for="seciliTalepNo"/>
                <h:panelGroup layout="block">
                    <p:inputText id="seciliTalepNo" value="#{tabUretimController.seciliTalep.talepNo}"
                                 readonly="true" size="25"/>
                    <p:commandButton icon="pi pi-search" process="@this" update="@form"
                                     actionListener="#{bysController.openCommonDialog('tabTalepSec')}">
                        <p:ajax event="dialogReturn" listener="#{tabUretimController.onTalepSelected}" update="@form"/>
                    </p:commandButton>
                </h:panelGroup>

                <p:outputLabel value="#{messages.durumLabel}" for="talepDurumu"/>
                <h:outputText id="talepDurumu" value="#{tabUretimController.seciliTalep.durum.displayValue}"/>

                <p:outputLabel value="#{messages.sorumluPersonelLabel}" for="sorumlu"/>
                <p:selectOneMenu id="sorumlu" value="#{tabUretimController.sorumluSyKullanici}" filter="true"
                                 converter="omnifaces.SelectItemsConverter">
                    <f:selectItem itemLabel="#{messages.seciniz}" itemValue="#{null}"/>
                    <f:selectItems value="#{syKullaniciController.items}" var="k"
                                   itemLabel="#{k.kullaniciAdi}" itemValue="#{k}"/>
                </p:selectOneMenu>

                <p:outputLabel value="#{messages.stokKartiLabel}" for="stStok"/>
                <p:selectOneMenu id="stStok" value="#{tabUretimController.stStok}" filter="true"
                                 converter="omnifaces.SelectItemsConverter">
                    <f:selectItem itemLabel="#{messages.seciniz}" itemValue="#{null}"/>
                    <f:selectItems value="#{stStokController.items}" var="s"
                                   itemLabel="#{s.malzemeKodu}" itemValue="#{s}"/>
                </p:selectOneMenu>

                <p:outputLabel value="#{messages.depoLabel}" for="stDepo"/>
                <p:selectOneMenu id="stDepo" value="#{tabUretimController.stDepo}" filter="true"
                                 converter="omnifaces.SelectItemsConverter">
                    <f:selectItem itemLabel="#{messages.seciniz}" itemValue="#{null}"/>
                    <f:selectItems value="#{stDepoController.items}" var="d"
                                   itemLabel="#{d.ad}" itemValue="#{d}"/>
                </p:selectOneMenu>

                <p:outputLabel value="#{messages.miktarLabel}" for="miktar"/>
                <p:inputText id="miktar" value="#{tabUretimController.miktar}"><p:keyFilter mask="num"/></p:inputText>

                <p:outputLabel value="#{messages.aciklamaLabel}" for="aciklama"/>
                <p:inputTextarea id="aciklama" value="#{tabUretimController.aciklama}" rows="2" cols="50"/>

                <f:facet name="footer">
                    <p:commandButton value="#{messages.uretimBaslat}" icon="pi pi-cog"
                                     styleClass="ui-button-primary"
                                     actionListener="#{tabUretimController.startProduction}"
                                     process="@form" update="@form,:growl"
                                     rendered="#{syKullaniciController.hasPermission('tabtalep:guncelle')}"/>
                    <p:commandButton value="#{messages.uretimTamamla}" icon="pi pi-check-square"
                                     styleClass="ui-button-success"
                                     actionListener="#{tabUretimController.completeProduction}"
                                     process="@this" update="@form,:growl"
                                     rendered="#{syKullaniciController.hasPermission('tabtalep:guncelle')}"/>
                </f:facet>
            </p:panelGrid>
        </p:panel>

        <p:panel header="#{messages.uretimTakip}" styleClass="w-100">
            <p:dataTable value="#{tabUretimController.uretimler}" var="u" rows="10" paginator="true"
                         emptyMessage="#{messages.kayitBulunamadi}" styleClass="w-100">
                <p:column headerText="#{messages.uretimAsamasiLabel}">
                    <h:outputText value="#{u.asama.displayValue}"/>
                </p:column>
                <p:column headerText="#{messages.baslangicTarihiLabel}">
                    <h:outputText value="#{u.baslangicTarihi}">
                        <f:convertDateTime pattern="#{messages.tarihSaatKisaFormat}" type="localDateTime"/>
                    </h:outputText>
                </p:column>
                <p:column headerText="#{messages.tamamlanmaTarihiLabel}">
                    <h:outputText value="#{u.tamamlanmaTarihi}">
                        <f:convertDateTime pattern="#{messages.tarihSaatKisaFormat}" type="localDateTime"/>
                    </h:outputText>
                </p:column>
                <p:column headerText="#{messages.sorumluPersonelLabel}">
                    <h:outputText value="#{u.sorumluSyKullanici.kullaniciAdi}"/>
                </p:column>
                <p:column headerText="#{messages.uretimGirisHareketi}">
                    <h:outputText value="#{u.uretimGirisHareket.hareketNo}"/>
                </p:column>
            </p:dataTable>
        </p:panel>

    </h:form>

</ui:composition>
