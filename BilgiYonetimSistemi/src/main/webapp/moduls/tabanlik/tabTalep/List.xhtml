<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces"
                xmlns:pt="jakarta.faces.passthrough"
                xmlns:coco="jakarta.faces.composite/ui">

    <h:form id="TabTalepListForm" styleClass="form-height">

        <p:contextMenu id="TabTalepDataTableContextMenu" for="datalist:datalist">
            <p:menuitem value="#{messages.buttonEkle}" onclick="document.getElementById('TabTalepListForm:datalist:datalist:createButton').click();"
                        icon="pi pi-plus" rendered="#{syKullaniciController.hasPermission('tabtalep:ekle')}"/>
            <p:menuitem value="#{messages.buttonGuncelle}" onclick="document.getElementById('TabTalepListForm:datalist:datalist:editButton').click();"
                        icon="pi pi-pencil" rendered="#{syKullaniciController.hasPermission('tabtalep:guncelle')}"/>
            <p:menuitem value="#{messages.buttonDetay}" onclick="document.getElementById('TabTalepListForm:datalist:datalist:viewButton').click();"
                        icon="pi pi-search"/>
            <p:menuitem value="#{messages.buttonSil}" onclick="document.getElementById('TabTalepListForm:datalist:datalist:deleteButton').click();"
                        icon="pi pi-trash" rendered="#{syKullaniciController.hasPermission('tabtalep:sil')}"/>
        </p:contextMenu>
        <coco:datatable id="datalist"
                        value="#{tabTalepController.lazyItems}"
                        rowKey="#{item.id}"
                        selection="#{tabTalepController.selected}"
                        filtered="#{tabTalepController.filtered}"
                        rowselect=":TabTalepListForm:datalist:datalist:createButton,:TabTalepListForm:datalist:datalist:viewButton,:TabTalepListForm:datalist:datalist:editButton,:TabTalepListForm:datalist:datalist:deleteButton"
                        rowDblselect="document.getElementById('TabTalepListForm:datalist:datalist:viewButton').click()"
                        contextMenu=":TabTalepListForm:datalist:datalist:createButton :TabTalepListForm:datalist:datalist:viewButton :TabTalepListForm:datalist:datalist:editButton :TabTalepListForm:datalist:datalist:deleteButton"
                        selectListener="#{tabTalepController.resetParents}"
                        controller="#{tabTalepController}"
                        header="#{messages.talepListesi}">

            <p:ajax event="colResize" listener="#{tabTalepController.onResize}"/>

            <f:facet name="paginatorBottomLeft">

                <p:commandButton id="createButton" styleClass="ui-button-primary" icon="pi pi-plus" pt:data-tooltip="#{messages.buttonEkle}"
                                 actionListener="#{tabTalepController.prepareCreate}" update=":TabTalepCreateForm:TabTalepCreateForm"
                                 oncomplete="PF('TabTalepCreateDialog').show()" onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('tabtalep:ekle')}"/>
                <p:commandButton id="editButton" styleClass="ui-button-success" icon="pi pi-pencil" pt:data-tooltip="#{messages.buttonGuncelle}"
                                 update=":TabTalepEditForm:TabTalepEditForm" oncomplete="PF('TabTalepEditDialog').show()"
                                 disabled="#{empty tabTalepController.selected}" onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('tabtalep:guncelle')}"/>
                <p:commandButton id="viewButton" styleClass="ui-button-info" icon="pi pi-search" pt:data-tooltip="#{messages.buttonDetay}"
                                 actionListener="#{tabTalepController.readInfo}"
                                 update=":TabTalepViewForm,:growl" oncomplete="PF('TabTalepViewDialog').show()"
                                 disabled="#{empty tabTalepController.selected}" onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"/>
                <p:commandButton id="deleteButton" styleClass="ui-button-danger" icon="pi pi-trash" pt:data-tooltip="#{messages.buttonSil}"
                                 actionListener="#{tabTalepController.delete}" update=":growl,datalist"
                                 disabled="#{empty tabTalepController.selected}"
                                 rendered="#{syKullaniciController.hasPermission('tabtalep:sil')}">
                    <p:confirm header="#{messages.ConfirmationHeader}" message="#{messages.ConfirmDeleteMessage}" icon="pi pi-exclamation-circle"/>
                </p:commandButton>

            </f:facet>

        </coco:datatable>


        <ui:include src="/confirmation.xhtml"/>

    </h:form>

</ui:composition>
