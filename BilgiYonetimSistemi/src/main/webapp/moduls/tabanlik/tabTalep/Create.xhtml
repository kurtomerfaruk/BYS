<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces"
      xmlns:coco="jakarta.faces.composite/ui">

<ui:composition>

    <coco:createpage id="TabTalepCreateForm"
                     renderedListener="#{tabTalepController.selected != null}"
                     widgetVar="TabTalepCreateDialog"
                     actionListener="#{tabTalepController.saveNew}"
                     listForm="TabTalepListForm">

        <p:outputLabel value="#{messages.kisiLabel}" for="@next"/>
        <coco:inputWithButton id="inputWithButtonTabKisi"
                              inputId="tabKisiId"
                              inputTitle="#{messages.tcKimlikNoText}"
                              buttonTitle="#{messages.buttonSec}"
                              inputValue="#{tabTalepController.selected.tabKisi.gnlKisi.tcKimlikNo}"
                              actionListener="#{bysController.openCommonDialog('tabKisiSec')}"
                              ajaxListener="#{tabTalepController.secilenTabKisi}"
                              dialogId="TabTalepCreateDialogId"/>

        <p:outputLabel value="#{messages.talepTarihiLabel}" for="talepTarihi"/>
        <p:inputText id="talepTarihi" value="#{tabTalepController.selected.talepTarihi}" readonly="true">
            <f:convertDateTime type="localDateTime" pattern="#{messages.tarihSaatFormat}"/>
        </p:inputText>

        <p:outputLabel value="#{messages.durumLabel}" for="durum"/>
        <h:outputText id="durum" value="#{tabTalepController.selected.durum.displayValue}"/>

        <p:outputLabel value="#{messages.aciklamaLabel}" for="aciklama"/>
        <p:inputTextarea id="aciklama" value="#{tabTalepController.selected.aciklama}" rows="4" styleClass="w-100" autoResize="false"/>

    </coco:createpage>

</ui:composition>

</html>
