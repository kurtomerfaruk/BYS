<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces">

<ui:composition>

    <p:dialog id="TabTalepViewDlg" widgetVar="TabTalepViewDialog"
              header="#{messages.buttonDetay}" modal="true" resizable="false"
              closeOnEscape="true" responsive="true" appendTo="@(body)"
              fitViewport="true" position="top" style="min-width:1000px;max-width:1100px;">

        <h:form id="TabTalepViewForm">

            <p:panel styleClass="mb-3">
                <h:outputText value="#{tabTalepController.selected.talepNo}" styleClass="fs-18 fw-bold"/>
                <h:outputText value="  |  "/>
                <h:outputText value="#{tabTalepController.selected.tabKisi.gnlKisi.adSoyad}"/>
                <h:outputText value="  |  "/>
                <p:tag value="#{tabTalepController.selected.durum.displayValue}" severity="info"/>
            </p:panel>

            <!-- Aşama göstergesi -->
            <div class="mb-3">
                <ui:repeat value="#{tabTalepController.processStages}" var="stage">
                    <span class="otd-step #{stage.cssClass}"
                          style="display:inline-block;padding:6px 12px;margin-right:6px;border-radius:12px;
                                 background:#{stage.cssClass eq 'done' ? '#d4edda' : (stage.cssClass eq 'current' ? '#cce5ff' : (stage.cssClass eq 'rejected' ? '#f8d7da' : '#f1f1f1'))};">
                        <h:outputText value="#{stage.sira}. "/>
                        <h:outputText value="#{stage.ad}"/>
                    </span>
                </ui:repeat>
            </div>

            <!-- Sıradaki işlemler -->
            <p:panel header="#{messages.islem}" styleClass="mb-3">
                <p:inputTextarea value="#{tabTalepController.transitionDescription}" rows="2" cols="80"
                                 placeholder="#{messages.aciklamaText}" styleClass="w-100 mb-2"/>
                <ui:repeat value="#{tabTalepController.availableActions}" var="action">
                    <p:commandButton value="#{action.displayValue}" icon="#{action.icon}"
                                     styleClass="ui-button-primary mr-2 mb-2"
                                     actionListener="#{tabTalepController.applyTransition(action)}"
                                     process="@form" update="@form,:growl"
                                     rendered="#{syKullaniciController.hasPermission(action.permission)}"/>
                </ui:repeat>
                <ui:repeat value="#{tabTalepController.backOptions}" var="onceki">
                    <p:commandButton value="#{messages.geriDonText} #{onceki.displayValue}" icon="pi pi-undo"
                                     styleClass="ui-button-secondary mr-2 mb-2"
                                     actionListener="#{tabTalepController.goBack(onceki)}"
                                     process="@form" update="@form,:growl"/>
                </ui:repeat>
            </p:panel>

            <p:tabView>

                <p:tab title="#{messages.randevuListesi}">
                    <p:dataTable value="#{tabTalepController.randevular}" var="r" rows="5"
                                 emptyMessage="#{messages.kayitBulunamadi}" styleClass="w-100">
                        <p:column headerText="#{messages.randevuTuruLabel}"><h:outputText value="#{r.randevuTuru.displayValue}"/></p:column>
                        <p:column headerText="#{messages.randevuTarihiLabel}">
                            <h:outputText value="#{r.randevuTarihi}"><f:convertDateTime pattern="#{messages.tarihSaatKisaFormat}"
                                                                                        type="localDateTime"/></h:outputText>
                        </p:column>
                        <p:column headerText="#{messages.durumLabel}"><h:outputText value="#{r.durum.displayValue}"/></p:column>
                        <p:column headerText="#{messages.iptalNedeniLabel}"><h:outputText value="#{r.iptalNedeni}"/></p:column>
                    </p:dataTable>
                </p:tab>

                <p:tab title="#{messages.olcumLabel}">
                    <p:dataTable value="#{tabTalepController.olcumler}" var="o" rows="5"
                                 emptyMessage="#{messages.kayitBulunamadi}" styleClass="w-100">
                        <p:column headerText="#{messages.olcumTarihiText}">
                            <h:outputText value="#{o.olcumTarihi}"><f:convertDateTime pattern="#{messages.tarihSaatKisaFormat}" type="localDateTime"/></h:outputText>
                        </p:column>
                        <p:column headerText="#{messages.sagAyak}"><h:outputText value="#{o.detayList[0].ayakNumarasi}"/></p:column>
                        <p:column headerText="#{messages.solAyak}"><h:outputText value="#{o.detayList[1].ayakNumarasi}"/></p:column>
                        <p:column headerText="#{messages.aciklamaLabel}"><h:outputText value="#{o.aciklama}"/></p:column>
                    </p:dataTable>
                </p:tab>

                <p:tab title="#{messages.uretimKarariLabel}">
                    <p:dataTable value="#{tabTalepController.kararlar}" var="k" rows="5"
                                 emptyMessage="#{messages.kayitBulunamadi}" styleClass="w-100">
                        <p:column headerText="#{messages.uretimKarariLabel}"><h:outputText value="#{k.karar.displayValue}"/></p:column>
                        <p:column headerText="#{messages.tarih}">
                            <h:outputText value="#{k.kararTarihi}"><f:convertDateTime pattern="#{messages.tarihSaatKisaFormat}" type="localDateTime"/></h:outputText>
                        </p:column>
                        <p:column headerText="#{messages.kararGerekcesiLabel}"><h:outputText value="#{k.kararGerekcesi}"/></p:column>
                    </p:dataTable>
                </p:tab>

                <p:tab title="#{messages.odemeBilgileri}">
                    <p:dataTable value="#{tabTalepController.odemeler}" var="o" rows="5"
                                 emptyMessage="#{messages.kayitBulunamadi}" styleClass="w-100">
                        <p:column headerText="#{messages.ucretTuruLabel}"><h:outputText value="#{o.ucretTuru.displayValue}"/></p:column>
                        <p:column headerText="#{messages.odemeTutarLabel}"><h:outputText value="#{o.tutar}"><f:convertNumber
                                type="currency"/></h:outputText></p:column>
                        <p:column headerText="#{messages.durumLabel}"><h:outputText value="#{o.onayDurumu.displayValue}"/></p:column>
                        <p:column headerText="#{messages.aciklamaLabel}"><h:outputText value="#{o.ucretsizGerekce}"/></p:column>
                    </p:dataTable>
                </p:tab>

                <p:tab title="#{messages.uretimTakip}">
                    <p:dataTable value="#{tabTalepController.uretimler}" var="u" rows="5"
                                 emptyMessage="#{messages.kayitBulunamadi}" styleClass="w-100">
                        <p:column headerText="#{messages.uretimAsamasiLabel}"><h:outputText value="#{u.asama.displayValue}"/></p:column>
                        <p:column headerText="#{messages.baslangicTarihiLabel}">
                            <h:outputText value="#{u.baslangicTarihi}"><f:convertDateTime pattern="#{messages.tarihSaatKisaFormat}"
                                                                                          type="localDateTime"/></h:outputText>
                        </p:column>
                        <p:column headerText="#{messages.tamamlanmaTarihiLabel}">
                            <h:outputText value="#{u.tamamlanmaTarihi}"><f:convertDateTime pattern="#{messages.tarihSaatKisaFormat}"
                                                                                           type="localDateTime"/></h:outputText>
                        </p:column>
                        <p:column headerText="#{messages.uretimGirisHareketi}"><h:outputText value="#{u.uretimGirisHareket.hareketNo}"/></p:column>
                    </p:dataTable>
                </p:tab>

                <p:tab title="#{messages.teslimatTakip}">
                    <p:dataTable value="#{tabTalepController.teslimatlar}" var="t" rows="5"
                                 emptyMessage="#{messages.kayitBulunamadi}" styleClass="w-100">
                        <p:column headerText="#{messages.teslimatTarihiLabel}">
                            <h:outputText value="#{t.teslimatTarihi}"><f:convertDateTime pattern="#{messages.tarihSaatKisaFormat}"
                                                                                         type="localDateTime"/></h:outputText>
                        </p:column>
                        <p:column headerText="#{messages.teslimEdilenUrunLabel}"><h:outputText value="#{t.urunBilgileri}"/></p:column>
                        <p:column headerText="#{messages.durumLabel}"><h:outputText value="#{t.stokHareketTuru.displayValue}"/></p:column>
                    </p:dataTable>
                </p:tab>

                <p:tab title="#{messages.belgelerLabel}">
                    <p:dataTable value="#{tabTalepController.belgeler}" var="b" rows="5"
                                 emptyMessage="#{messages.kayitBulunamadi}" styleClass="w-100">
                        <p:column headerText="#{messages.tip}"><h:outputText value="#{b.belgeTuru.displayValue}"/></p:column>
                        <p:column headerText="#{messages.dosyaAdi}"><h:outputText value="#{b.dosyaAdi}"/></p:column>
                        <p:column headerText="#{messages.tarih}">
                            <h:outputText value="#{b.yuklenmeTarihi}"><f:convertDateTime pattern="#{messages.tarihSaatKisaFormat}"
                                                                                         type="localDateTime"/></h:outputText>
                        </p:column>
                    </p:dataTable>
                </p:tab>

                <p:tab title="#{messages.islemGecmisi}">
                    <p:dataTable value="#{tabTalepController.statusHistory}" var="h" rows="10" paginator="true"
                                 emptyMessage="#{messages.kayitBulunamadi}" styleClass="w-100">
                        <p:column headerText="#{messages.tarih}">
                            <h:outputText value="#{h.islemTarihi}"><f:convertDateTime pattern="#{messages.tarihSaatKisaFormat}" type="localDateTime"/></h:outputText>
                        </p:column>
                        <p:column headerText="#{messages.durumLabel}">
                            <h:outputText value="#{h.eskiDurum.displayValue}"/> → <h:outputText value="#{h.yeniDurum.displayValue}"/>
                        </p:column>
                        <p:column headerText="#{messages.aciklamaLabel}"><h:outputText value="#{h.aciklama}"/></p:column>
                        <p:column headerText="#{messages.kisiLabel}"><h:outputText value="#{h.islemiYapanSyKullanici.kullaniciAdi}"/></p:column>
                    </p:dataTable>
                </p:tab>

            </p:tabView>

        </h:form>
    </p:dialog>

</ui:composition>
</html>
