<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces"
                xmlns:pt="jakarta.faces.passthrough"
                xmlns:coco="jakarta.faces.composite/ui">

    <h:form id="TabKisiListForm" styleClass="form-height">

        <p:contextMenu id="TabKisiDataTableContextMenu" for="datalist:datalist">
            <p:menuitem value="#{messages.buttonEkle}" onclick="document.getElementById('TabKisiListForm:datalist:datalist:createButton').click();"
                        icon="pi pi-plus" rendered="#{syKullaniciController.hasPermission('tabkisi:ekle')}"/>
            <p:menuitem value="#{messages.buttonGuncelle}" onclick="document.getElementById('TabKisiListForm:datalist:datalist:editButton').click();"
                        icon="pi pi-pencil" rendered="#{syKullaniciController.hasPermission('tabkisi:guncelle')}"/>
            <p:menuitem value="#{messages.buttonDetay}" onclick="document.getElementById('TabKisiListForm:datalist:datalist:viewButton').click();"
                        icon="pi pi-search"/>
            <p:menuitem value="#{messages.buttonSil}" onclick="document.getElementById('TabKisiListForm:datalist:datalist:deleteButton').click();"
                        icon="pi pi-trash" rendered="#{syKullaniciController.hasPermission('tabkisi:sil')}"/>
        </p:contextMenu>
        <coco:datatable id="datalist"
                        value="#{tabKisiController.lazyItems}"
                        rowKey="#{item.id}"
                        selection="#{tabKisiController.selected}"
                        filtered="#{tabKisiController.filtered}"
                        rowselect=":TabKisiListForm:datalist:datalist:createButton,:TabKisiListForm:datalist:datalist:viewButton,:TabKisiListForm:datalist:datalist:editButton,:TabKisiListForm:datalist:datalist:deleteButton"
                        rowDblselect="document.getElementById('TabKisiListForm:datalist:datalist:editButton').click()"
                        contextMenu=":TabKisiListForm:datalist:datalist:createButton :TabKisiListForm:datalist:datalist:viewButton :TabKisiListForm:datalist:datalist:editButton :TabKisiListForm:datalist:datalist:deleteButton"
                        selectListener="#{tabKisiController.resetParents}"
                        controller="#{tabKisiController}"
                        header="#{messages.cihazListesi}">

            <p:ajax event="colResize" listener="#{tabKisiController.onResize}"/>

            <f:facet name="paginatorBottomLeft">

                <p:commandButton id="createButton" styleClass="ui-button-primary" icon="pi pi-plus" pt:data-tooltip="#{messages.buttonEkle}"
                                 actionListener="#{tabKisiController.prepareCreate}" update=":TabKisiCreateForm:TabKisiCreateForm"
                                 oncomplete="PF('TabKisiCreateDialog').show()" onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('tabkisi:ekle')}"/>
                <p:commandButton id="editButton" styleClass="ui-button-success" icon="pi pi-pencil" pt:data-tooltip="#{messages.buttonGuncelle}"
                                 update=":TabKisiEditForm:TabKisiEditForm" oncomplete="PF('TabKisiEditDialog').show()"
                                 disabled="#{empty tabKisiController.selected}" onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('tabkisi:guncelle')}"/>
                <p:commandButton id="viewButton" styleClass="ui-button-info" icon="pi pi-search" pt:data-tooltip="#{messages.buttonDetay}"
                                 update=":TabKisiViewForm:TabKisiViewForm" oncomplete="PF('TabKisiViewDialog').show()"
                                 disabled="#{empty tabKisiController.selected}" onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"/>
                <p:commandButton id="deleteButton" styleClass="ui-button-danger" icon="pi pi-trash" pt:data-tooltip="#{messages.buttonSil}"
                                 actionListener="#{tabKisiController.delete}" update=":growl,datalist"
                                 disabled="#{empty tabKisiController.selected}"
                                 rendered="#{syKullaniciController.hasPermission('tabkisi:sil')}">
                    <p:confirm header="#{messages.ConfirmationHeader}" message="#{messages.ConfirmDeleteMessage}" icon="pi pi-exclamation-circle"/>
                </p:commandButton>

            </f:facet>

        </coco:datatable>


        <ui:include src="/confirmation.xhtml"/>

    </h:form>

</ui:composition>
