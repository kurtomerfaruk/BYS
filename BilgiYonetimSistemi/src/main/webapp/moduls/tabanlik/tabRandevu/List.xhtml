<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces">

    <div class="card">
        <h:form id="TabRandevuListForm">

            <div class="row">
                <div class="col-xl-3">
                    <div class="border border-4">
                        <h3 class="m-5 text-blue-900">Yaklaşan Randevular</h3>
                        <div class="pe-2 me-n1 mb-3 event-list" data-simplebar="" style="height: 400px">
                            <ui:repeat value="#{tabRandevuController.incomingEvents}" var="incoming">
                                <div class="card border card-border-primary mb-3">
                                    <div class="card-body">
                                        <span class="fw-medium">
                                            <h:outputText value="#{incoming.randevuTarihi}">
                                                <f:convertDateTime pattern="#{messages.tarihSaatKisaFormat}" type="localDateTime"/>
                                            </h:outputText>
                                        </span>
                                        <h6 class="card-title fs-16">
                                            #{incoming.tabKisi.gnlKisi.adSoyad} - #{incoming.randevuTuru.displayValue}
                                        </h6>
                                    </div>
                                </div>
                            </ui:repeat>
                        </div>
                    </div>
                </div>

                <div class="col-xl-9">
                    <p:schedule id="schedule" value="#{tabRandevuController.lazyEventModel}"
                                styleClass="scheduleWidget" aspectRatio="1.88"
                                rightHeaderTemplate="dayGridMonth,timeGridWeek,timeGridDay,listYear"
                                allDaySlot="true" timeZone="Asia/Istanbul" clientTimeZone="Asia/Istanbul"
                                widgetVar="tabRandevuSchedule" locale="tr">
                        <p:ajax event="dateSelect" listener="#{tabRandevuController.onDateSelect}"
                                update=":TabRandevuCreateForm"
                                onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"
                                oncomplete="PF('TabRandevuCreateDialog').show()"/>
                        <p:ajax event="eventSelect" listener="#{tabRandevuController.onEventSelect}"
                                update=":TabRandevuEditForm"
                                oncomplete="PF('TabRandevuEditDialog').show()"
                                onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"/>
                    </p:schedule>
                </div>
            </div>

            <div class="mt-3">
                <p:commandButton value="#{messages.randevuVerText}" icon="pi pi-calendar-plus"
                                 styleClass="ui-button-primary"
                                 actionListener="#{bysController.openCommonDialog('tabTalepSec')}"
                                 process="@this" update=":TabRandevuCreateForm"
                                 rendered="#{syKullaniciController.hasPermission('tabtalep:guncelle')}">
                    <p:ajax event="dialogReturn" listener="#{tabRandevuController.onTalepSelectedForCreate}" update=":TabRandevuCreateForm"/>
                </p:commandButton>
            </div>

        </h:form>

        <script type="text/javascript">
            $(document).ready(function () {
                $(".event-list").height($(".scheduleWidget").height() - 100);
            });
        </script>
    </div>

</ui:composition>
