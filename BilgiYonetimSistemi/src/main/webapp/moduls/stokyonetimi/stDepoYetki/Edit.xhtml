<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces"
      xmlns:coco="jakarta.faces.composite/ui">

<ui:composition>

    <coco:editpage id="StDepoYetkiEditForm"
                   widgetVar="StDepoYetkiEditDialog"
                   actionListener="#{stDepoYetkiController.save}"
                   listForm="StDepoYetkiListForm"
                   model="#{stDepoYetkiController.selected}">

        <p:outputLabel value="#{messages.kullaniciLabel}" for="@next"/>
        <p:selectOneMenu value="#{stDepoYetkiController.selected.syKullanici}" required="true" filter="true"
                         converter="omnifaces.SelectItemsConverter" style="width:400px !important">
            <f:selectItem itemLabel="#{messages.seciniz}" itemValue="#{null}"/>
            <f:selectItems value="#{syKullaniciController.items}"
                           var="kullanicilar"
                           itemValue="#{kullanicilar}"
                           itemLabel="#{kullanicilar.gnlPersonel.gnlKisi.adSoyad}"/>
        </p:selectOneMenu>

        <p:outputLabel value="#{messages.depoLabel}" for="@next"/>
        <p:selectOneMenu value="#{stDepoYetkiController.selected.stDepo}" required="true" filter="true"
                         converter="omnifaces.SelectItemsConverter">
            <f:selectItem itemLabel="#{messages.seciniz}" itemValue="#{null}"/>
            <f:selectItems value="#{stDepoController.items}"
                           var="depolar"
                           itemValue="#{depolar}"
                           itemLabel="#{depolar.ad}"/>
        </p:selectOneMenu>

    </coco:editpage>

</ui:composition>

</html>
