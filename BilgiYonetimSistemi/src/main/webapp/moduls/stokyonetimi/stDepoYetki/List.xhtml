<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces"
                xmlns:pt="jakarta.faces.passthrough"
                xmlns:coco="jakarta.faces.composite/ui">

    <h:form id="StDepoYetkiListForm" class="form-height">

        <p:contextMenu id="StDepoYetkiDataTableContextMenu" for="datalist:datalist">
            <p:menuitem value="#{messages.buttonEkle}"
                        onclick="document.getElementById('StDepoYetkiListForm:datalist:datalist:createButton').click();"
                        icon="pi pi-plus" rendered="#{syKullaniciController.hasPermission('stdepoyetki:ekle')}"/>
            <p:menuitem value="#{messages.buttonGuncelle}"
                        onclick="document.getElementById('StDepoYetkiListForm:datalist:datalist:editButton').click();"
                        icon="pi pi-pencil" rendered="#{syKullaniciController.hasPermission('stdepoyetki:guncelle')}"/>
            <p:menuitem value="#{messages.buttonDetay}" onclick="document.getElementById('StDepoYetkiListForm:datalist:datalist:viewButton').click();"
                        icon="pi pi-search"/>
            <p:menuitem value="#{messages.buttonSil}" onclick="document.getElementById('StDepoYetkiListForm:datalist:datalist:deleteButton').click();"
                        icon="pi pi-trash" rendered="#{syKullaniciController.hasPermission('stdepoyetki:sil')}"/>
        </p:contextMenu>

        <coco:datatable id="datalist"
                        value="#{stDepoYetkiController.lazyItems}"
                        rowKey="#{item.id}"
                        selection="#{stDepoYetkiController.selected}"
                        filtered="#{stDepoYetkiController.filtered}"
                        rowselect=":StDepoYetkiListForm:datalist:datalist:createButton,:StDepoYetkiListForm:datalist:datalist:viewButton,:StDepoYetkiListForm:datalist:datalist:editButton,:StDepoYetkiListForm:datalist:datalist:deleteButton"
                        rowDblselect="document.getElementById('StDepoYetkiListForm:datalist:datalist:editButton').click()"
                        contextMenu=":StDepoYetkiListForm:datalist:datalist:createButton :StDepoYetkiListForm:datalist:datalist:viewButton :StDepoYetkiListForm:datalist:datalist:editButton :StDepoYetkiListForm:datalist:datalist:deleteButton"
                        selectListener="#{stDepoYetkiController.resetParents}"
                        controller="#{stDepoYetkiController}"
                        header="#{messages.depoListesi}">

            <p:ajax event="colResize" listener="#{stDepoYetkiController.onResize}"/>


            <f:facet name="paginatorBottomLeft">
                <p:commandButton id="createButton" styleClass="ui-button-primary" icon="pi pi-plus" pt:data-tooltip="#{messages.buttonEkle}"
                                 actionListener="#{stDepoYetkiController.prepareCreate}" update=":StDepoYetkiCreateForm:StDepoYetkiCreateForm"
                                 oncomplete="PF('StDepoYetkiCreateDialog').show()" onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('stdepoyetki:ekle')}"/>
                <p:commandButton id="editButton" styleClass="ui-button-success" icon="pi pi-pencil" pt:data-tooltip="#{messages.buttonGuncelle}"
                                 update=":StDepoYetkiEditForm:StDepoYetkiEditForm"
                                 oncomplete="PF('StDepoYetkiEditDialog').show()" disabled="#{empty stDepoYetkiController.selected}"
                                 onstart="PF('Loading').show()"
                                 onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('stdepoyetki:guncelle')}"/>
                <p:commandButton id="viewButton" styleClass="ui-button-info" icon="pi pi-search" pt:data-tooltip="#{messages.buttonDetay}"
                                 update=":StDepoYetkiViewForm:StDepoYetkiViewForm"
                                 oncomplete="PF('StDepoYetkiViewDialog').show()" disabled="#{empty stDepoYetkiController.selected}"
                                 onstart="PF('Loading').show()"
                                 onsuccess="PF('Loading').hide()"/>
                <p:commandButton id="deleteButton" styleClass="ui-button-danger" pt:data-tooltip="#{messages.buttonSil}" icon="pi pi-trash"
                                 actionListener="#{stDepoYetkiController.delete}"
                                 update=":growl,datalist" disabled="#{empty stDepoYetkiController.selected}"
                                 rendered="#{syKullaniciController.hasPermission('stdepoyetki:sil')}">
                    <p:confirm header="#{messages.ConfirmationHeader}" message="#{messages.ConfirmDeleteMessage}" icon="pi pi-warning"/>
                </p:commandButton>
            </f:facet>

        </coco:datatable>


        <ui:include src="/confirmation.xhtml"/>

    </h:form>

</ui:composition>
