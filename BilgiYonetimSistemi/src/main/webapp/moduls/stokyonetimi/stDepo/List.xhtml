<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces"
                xmlns:pt="jakarta.faces.passthrough"
                xmlns:coco="jakarta.faces.composite/ui">

    <h:form id="StDepoListForm" class="form-height">

        <p:contextMenu id="StDepoDataTableContextMenu" for="datalist:datalist">
            <p:menuitem value="#{messages.buttonEkle}" onclick="document.getElementById('StDepoListForm:datalist:datalist:createButton').click();"
                        icon="pi pi-plus" rendered="#{syKullaniciController.hasPermission('stdepo:ekle')}"/>
            <p:menuitem value="#{messages.buttonGuncelle}" onclick="document.getElementById('StDepoListForm:datalist:datalist:editButton').click();"
                        icon="pi pi-pencil" rendered="#{syKullaniciController.hasPermission('stdepo:guncelle')}"/>
            <p:menuitem value="#{messages.buttonDetay}" onclick="document.getElementById('StDepoListForm:datalist:datalist:viewButton').click();"
                        icon="pi pi-search"/>
            <p:menuitem value="#{messages.buttonSil}" onclick="document.getElementById('StDepoListForm:datalist:datalist:deleteButton').click();"
                        icon="pi pi-trash" rendered="#{syKullaniciController.hasPermission('stdepo:sil')}"/>
        </p:contextMenu>

        <coco:datatable id="datalist"
                        value="#{stDepoController.lazyItems}"
                        rowKey="#{item.id}"
                        selection="#{stDepoController.selected}"
                        filtered="#{stDepoController.filtered}"
                        rowselect=":StDepoListForm:datalist:datalist:createButton,:StDepoListForm:datalist:datalist:viewButton,:StDepoListForm:datalist:datalist:editButton,:StDepoListForm:datalist:datalist:deleteButton"
                        rowDblselect="document.getElementById('StDepoListForm:datalist:datalist:editButton').click()"
                        contextMenu=":StDepoListForm:datalist:datalist:createButton :StDepoListForm:datalist:datalist:viewButton :StDepoListForm:datalist:datalist:editButton :StDepoListForm:datalist:datalist:deleteButton"
                        selectListener="#{stDepoController.resetParents}"
                        controller="#{stDepoController}"
                        header="#{messages.depoListesi}">

            <p:ajax event="colResize" listener="#{stDepoController.onResize}"/>


            <f:facet name="paginatorBottomLeft">
                <p:commandButton id="createButton" styleClass="ui-button-primary" icon="pi pi-plus" pt:data-tooltip="#{messages.buttonEkle}"
                                 actionListener="#{stDepoController.prepareCreate}" update=":StDepoCreateForm:StDepoCreateForm"
                                 oncomplete="PF('StDepoCreateDialog').show()" onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('stdepo:ekle')}"/>
                <p:commandButton id="editButton" styleClass="ui-button-success" icon="pi pi-pencil" pt:data-tooltip="#{messages.buttonGuncelle}"
                                 update=":StDepoEditForm:StDepoEditForm"
                                 oncomplete="PF('StDepoEditDialog').show()" disabled="#{empty stDepoController.selected}"
                                 onstart="PF('Loading').show()"
                                 onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('stdepo:guncelle')}"/>
                <p:commandButton id="viewButton" styleClass="ui-button-info" icon="pi pi-search" pt:data-tooltip="#{messages.buttonDetay}"
                                 update=":StDepoViewForm:StDepoViewForm"
                                 oncomplete="PF('StDepoViewDialog').show()" disabled="#{empty stDepoController.selected}"
                                 onstart="PF('Loading').show()"
                                 onsuccess="PF('Loading').hide()"/>
                <p:commandButton id="deleteButton" styleClass="ui-button-danger" pt:data-tooltip="#{messages.buttonSil}" icon="pi pi-trash"
                                 actionListener="#{stDepoController.delete}"
                                 update=":growl,datalist" disabled="#{empty stDepoController.selected}"
                                 rendered="#{syKullaniciController.hasPermission('stdepo:sil')}">
                    <p:confirm header="#{messages.ConfirmationHeader}" message="#{messages.ConfirmDeleteMessage}" icon="pi pi-warning"/>
                </p:commandButton>
            </f:facet>

        </coco:datatable>


        <ui:include src="/confirmation.xhtml"/>

    </h:form>

</ui:composition>
