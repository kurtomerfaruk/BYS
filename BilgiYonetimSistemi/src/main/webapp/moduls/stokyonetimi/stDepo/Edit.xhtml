<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="primefaces"
      xmlns:coco="jakarta.faces.composite/ui">

<ui:composition>

    <coco:editpage id="StDepoEditForm"
                   widgetVar="StDepoEditDialog"
                   actionListener="#{stDepoController.save}"
                   listForm="StDepoListForm"
                   model="#{stDepoController.selected}">

        <p:outputLabel value="#{messages.kodLabel}" for="@next"/>
        <p:inputText value="#{stDepoController.selected.kod}" title="#{messages.kodText}" size="50" maxlength="50"/>

        <p:outputLabel value="#{messages.birimLabel}" for="@next"/>
        <p:inputText value="#{stDepoController.selected.ad}" title="#{messages.birimText}" size="50" maxlength="150"/>

    </coco:editpage>

</ui:composition>

</html>
