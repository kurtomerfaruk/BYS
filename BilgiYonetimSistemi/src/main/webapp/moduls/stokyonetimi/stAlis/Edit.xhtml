<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:p="primefaces">

<ui:composition>

    <p:dialog widgetVar="StAlisEditDialog"
              id="StAlisEditDialogId"
              modal="true"
              resizable="false"
              closeOnEscape="true"
              header="#{messages.dialogKayitGuncelle} - #{messages.alisBelgesiText}"
              appendTo="@(body)"
              responsive="true"
              fitViewport="true"
              position="top"
              onShow="PF('StAlisEditDialog').initPosition(); stBarkodOdak('StAlisEditForm:barkodOku');"
              style="min-width:1000px;">

        <h:form id="StAlisEditForm">
            <h:panelGroup id="display">
                <div class="card">
                    <div class="card-body">

                        <ui:include src="/moduls/stokyonetimi/stAlis/Field.xhtml">
                            <ui:param name="formId" value="StAlisEditForm"/>
                        </ui:include>

                    </div>
                    <div class="card-footer">
                        <div class="float-end">
                            <p:commandButton icon="pi pi-times" styleClass="ui-button-danger"
                                             value="#{messages.buttonIptal}" immediate="true"
                                             onclick="PF('StAlisEditDialog').hide()"
                                             onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()">
                                <p:resetInput target="@form"/>
                            </p:commandButton>
                            <p:commandButton icon="pi pi-check" styleClass="ui-button-success"
                                             value="#{messages.buttonKaydet}"
                                             actionListener="#{stAlisController.saveEdit}"
                                             update="display,:StAlisListForm:datalist:datalist,:growl"
                                             oncomplete="handleSubmit(xhr,status,args,PF('StAlisEditDialog'));"
                                             onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"/>
                        </div>
                    </div>
                </div>
            </h:panelGroup>
        </h:form>

    </p:dialog>

</ui:composition>

</html>
