<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces"
                xmlns:pt="jakarta.faces.passthrough"
                xmlns:coco="jakarta.faces.composite/ui">

    <h:form id="StStokHareketListForm" styleClass="form-height">

        <p:contextMenu id="StStokHareketDataTableContextMenu" for="datalist:datalist">
            <p:menuitem value="#{messages.buttonEkle}"
                        onclick="document.getElementById('StStokHareketListForm:datalist:datalist:createButton').click();"
                        icon="pi pi-plus" rendered="#{syKullaniciController.hasPermission('ststokhareket:ekle')}"/>
            <p:menuitem value="#{messages.buttonGuncelle}"
                        onclick="document.getElementById('StStokHareketListForm:datalist:datalist:editButton').click();"
                        icon="pi pi-pencil" rendered="#{syKullaniciController.hasPermission('ststokhareket:guncelle')}"/>
            <p:menuitem value="#{messages.buttonDetay}"
                        onclick="document.getElementById('StStokHareketListForm:datalist:datalist:viewButton').click();"
                        icon="pi pi-search"/>
            <p:menuitem value="#{messages.buttonSil}"
                        onclick="document.getElementById('StStokHareketListForm:datalist:datalist:deleteButton').click();"
                        icon="pi pi-trash" rendered="#{syKullaniciController.hasPermission('ststokhareket:sil')}"/>
        </p:contextMenu>
        <coco:datatable id="datalist"
                        value="#{stStokHareketController.lazyItems}"
                        rowKey="#{item.id}"
                        selection="#{stStokHareketController.selected}"
                        filtered="#{stStokHareketController.filtered}"
                        rowselect=":StStokHareketListForm:datalist:datalist:createButton,:StStokHareketListForm:datalist:datalist:viewButton,:StStokHareketListForm:datalist:datalist:editButton,:StStokHareketListForm:datalist:datalist:deleteButton"
                        rowDblselect="document.getElementById('StStokHareketListForm:datalist:datalist:editButton').click()"
                        contextMenu=":StStokHareketListForm:datalist:datalist:createButton :StStokHareketListForm:datalist:datalist:viewButton :StStokHareketListForm:datalist:datalist:editButton :StStokHareketListForm:datalist:datalist:deleteButton"
                        selectListener="#{stStokHareketController.resetParents}"
                        controller="#{stStokHareketController}"
                        header="#{messages.birimListesi}">

            <p:ajax event="colResize" listener="#{stStokHareketController.onResize}"/>

            <f:facet name="paginatorBottomLeft">

                <p:commandButton id="createButton" styleClass="ui-button-primary" icon="pi pi-plus" pt:data-tooltip="#{messages.buttonEkle}"
                                 actionListener="#{stStokHareketController.prepareCreate}" update=":StStokHareketCreateForm:StStokHareketCreateForm"
                                 oncomplete="PF('StStokHareketCreateDialog').show()" onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('ststokhareket:ekle')}"/>
                <p:commandButton id="editButton" styleClass="ui-button-success" icon="pi pi-pencil" pt:data-tooltip="#{messages.buttonGuncelle}"
                                 update=":StStokHareketEditForm:StStokHareketEditForm" oncomplete="PF('StStokHareketEditDialog').show()"
                                 disabled="#{empty stStokHareketController.selected}" onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('ststokhareket:guncelle')}"/>
                <p:commandButton id="viewButton" styleClass="ui-button-info" icon="pi pi-search" pt:data-tooltip="#{messages.buttonDetay}"
                                 update=":StStokHareketViewForm:StStokHareketViewForm" oncomplete="PF('StStokHareketViewDialog').show()"
                                 disabled="#{empty stStokHareketController.selected}" onstart="PF('Loading').show()"
                                 onsuccess="PF('Loading').hide()"/>
                <p:commandButton id="deleteButton" styleClass="ui-button-danger" icon="pi pi-trash" pt:data-tooltip="#{messages.buttonSil}"
                                 actionListener="#{stStokHareketController.delete}" update=":growl,datalist"
                                 disabled="#{empty stStokHareketController.selected}"
                                 rendered="#{syKullaniciController.hasPermission('ststokhareket:sil')}">
                    <p:confirm header="#{messages.ConfirmationHeader}" message="#{messages.ConfirmDeleteMessage}" icon="pi pi-exclamation-circle"/>
                </p:commandButton>

            </f:facet>

        </coco:datatable>


        <ui:include src="/confirmation.xhtml"/>

    </h:form>

</ui:composition>
