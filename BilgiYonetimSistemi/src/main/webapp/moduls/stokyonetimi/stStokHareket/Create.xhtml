<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces"
      xmlns:coco="jakarta.faces.composite/ui">

<ui:composition>

    <coco:createpage id="StStokHareketCreateForm"
                     renderedListener="#{stStokHareketController.selected != null}"
                     widgetVar="StStokHareketCreateDialog"
                     actionListener="#{stStokHareketController.createMovement}"
                     listForm="StStokHareketListForm">

        <p:outputLabel value="#{messages.hareketNoLabel}" for="@next"/>
        <p:inputText value="#{stStokHareketController.selected.hareketNo}" title="#{messages.hareketNoText}" readonly="true" size="30"
                     maxlength="50"/>

        <p:outputLabel value="#{messages.stokLabel}" for="@next"/>
        <p:selectOneMenu value="#{stStokHareketController.selected.stStok}" required="true" converter="omnifaces.SelectItemsConverter" filter="true">
            <f:selectItem itemValue="#{null}" itemLabel="#{messages.seciniz}"/>
            <f:selectItems value="#{stStokController.items}" var="s" itemLabel="#{s.stokKodu} - #{s.stokAdi}" itemValue="#{s}"/>
        </p:selectOneMenu>

        <p:outputLabel value="#{messages.depoLabel}" for="@next"/>
        <p:selectOneMenu value="#{stStokHareketController.selected.stDepo}" required="true" converter="omnifaces.SelectItemsConverter">
            <f:selectItem itemValue="#{null}" itemLabel="#{messages.seciniz}"/>
            <f:selectItems value="#{stDepoController.items}" var="d" itemLabel="#{d.depoAdi}" itemValue="#{d}"/>
        </p:selectOneMenu>

        <p:outputLabel value="#{messages.lokasyonLabel}" for="@next"/>
        <p:selectOneMenu value="#{stStokHareketController.selected.stDepoLokasyon}" converter="omnifaces.SelectItemsConverter">
            <f:selectItem itemValue="#{null}" itemLabel="#{messages.seciniz}"/>
            <f:selectItems value="#{stDepoLokasyonController.items}" var="l" itemLabel="#{l.lokasyonKodu}" itemValue="#{l}"/>
        </p:selectOneMenu>

        <p:outputLabel value="#{messages.hedefDepoLabel}" for="@next"/>
        <p:selectOneMenu value="#{stStokHareketController.selected.hedefDepo}" converter="omnifaces.SelectItemsConverter">
            <f:selectItem itemValue="#{null}" itemLabel="#{messages.seciniz}"/>
            <f:selectItems value="#{stDepoController.items}" var="d" itemLabel="#{d.depoAdi}" itemValue="#{d}"/>
        </p:selectOneMenu>

        <p:outputLabel value="#{messages.hedefLokasyonLabel}" for="@next"/>
        <p:selectOneMenu value="#{stStokHareketController.selected.hedefLokasyon}" converter="omnifaces.SelectItemsConverter">
            <f:selectItem itemValue="#{null}" itemLabel="#{messages.seciniz}"/>
            <f:selectItems value="#{stDepoLokasyonController.items}" var="l" itemLabel="#{l.lokasyonKodu}" itemValue="#{l}"/>
        </p:selectOneMenu>

        <p:outputLabel value="#{messages.hareketTurLabel}" for="@next"/>
        <p:selectOneMenu value="#{stStokHareketController.selected.hareketTuru}" required="true" converter="omnifaces.SelectItemsConverter">
            <f:selectItem itemValue="#{null}" itemLabel="#{messages.seciniz}"/>
            <f:selectItems value="#{enumHareketTuru.ALL_VALUES}" var="h" itemLabel="#{h.displayValue}" itemValue="#{h}"/>
        </p:selectOneMenu>

        <p:outputLabel value="#{messages.durumLabel}" for="@next"/>
        <p:selectOneMenu value="#{stStokHareketController.selected.durum}" required="true" converter="omnifaces.SelectItemsConverter">
            <f:selectItem itemValue="#{null}" itemLabel="#{messages.seciniz}"/>
            <f:selectItems value="#{enumGirisCikis.ALL_VALUES}" var="g" itemLabel="#{g.displayValue}" itemValue="#{g}"/>
        </p:selectOneMenu>

        <p:outputLabel value="#{messages.birimLabel}" for="@next"/>
        <p:selectOneMenu value="#{stStokHareketController.selected.stBirim}" required="true" converter="omnifaces.SelectItemsConverter">
            <f:selectItem itemValue="#{null}" itemLabel="#{messages.seciniz}"/>
            <f:selectItems value="#{stBirimController.items}" var="b" itemLabel="#{b.tanim}" itemValue="#{b}"/>
        </p:selectOneMenu>

        <p:outputLabel value="#{messages.miktarLabel}" for="@next"/>
        <p:inputNumber value="#{stStokHareketController.selected.miktar}" required="true" decimalPlaces="4" styleClass="text-end">
            <p:ajax event="keyup" update="toplamMaliyet" listener="#{stStokHareketController.calculate()}"/>
        </p:inputNumber>

        <p:outputLabel value="#{messages.birimMaliyetLabel}" for="@next"/>
        <p:inputNumber value="#{stStokHareketController.selected.birimMaliyet}" decimalPlaces="4" styleClass="text-end">
            <p:ajax event="keyup" update="toplamMaliyet" listener="#{stStokHareketController.calculate()}"/>
        </p:inputNumber>

        <p:outputLabel value="#{messages.toplamMaliyetLabel}" for="@next"/>
        <p:inputNumber id="toplamMaliyet" value="#{stStokHareketController.selected.toplamMaliyet}" decimalPlaces="4" styleClass="text-end"
                       readonly="true"/>

        <!--        <p:outputLabel value="Belge Türü" for="@next"/>-->
        <!--        <p:inputText value="#{stStokHareketController.selected.belgeTuru}" size="20" maxlength="50"/>-->

        <!--        <p:outputLabel value="Belge No" for="@next"/>-->
        <!--        <p:inputText value="#{stStokHareketController.selected.belgeNo}" size="20" maxlength="50"/>-->

        <p:outputLabel value="Açıklama" for="@next"/>
        <p:inputTextarea value="#{stStokHareketController.selected.aciklama}" rows="3" cols="50"/>

    </coco:createpage>

</ui:composition>

</html>
