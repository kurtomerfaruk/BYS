<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces"
      xmlns:coco="jakarta.faces.composite/ui">

<ui:composition>

    <coco:viewpage id="StStokHareketViewForm"
                   model="#{stStokHareketController.selected}"
                   widgetVar="StStokHareketViewDialog">

        <h:outputText value="#{messages.hareketNoLabel}"/>
        <h:outputText value="#{stStokHareketController.selected.hareketNo}"/>

        <h:outputText value="#{messages.islemTarihiLabel}"/>
        <h:outputText value="#{stStokHareketController.selected.islemTarihi}">
            <f:convertDateTime pattern="#{messages.tarihSaatKisaFormat}" type="localDateTime"/>
        </h:outputText>

        <h:outputText value="#{messages.depoLabel}"/>
        <h:outputText value="#{stStokHareketController.selected.stDepo.ad}"/>

        <h:outputText value="#{messages.stokLabel}"/>
        <h:outputText value="#{stStokHareketController.selected.stStok.malzemeKodu} - #{stStokHareketController.selected.stStok.stokAdi}"/>

        <h:outputText value="#{messages.hareketTuruLabel}"/>
        <h:outputText value="#{stStokHareketController.selected.hareketTuru.displayValue}"/>

        <h:outputText value="#{messages.yonLabel}"/>
        <h:outputText value="#{stStokHareketController.selected.yon.displayValue}"/>

        <h:outputText value="#{messages.miktarLabel}"/>
        <h:outputText value="#{stStokHareketController.selected.miktar}">
            <f:convertNumber minFractionDigits="2" maxFractionDigits="2"/>
        </h:outputText>

        <h:outputText value="#{messages.birimMaliyetLabel}"/>
        <h:outputText value="#{stStokHareketController.selected.birimMaliyet}">
            <f:convertNumber minFractionDigits="2" maxFractionDigits="2"/>
        </h:outputText>

        <h:outputText value="#{messages.belgeTuruLabel}"/>
        <h:outputText value="#{stStokHareketController.selected.belgeTuru}"/>

        <h:outputText value="#{messages.belgeNoLabel}"/>
        <h:outputText value="#{stStokHareketController.selected.belgeNo}"/>

        <p:outputLabel value="#{messages.aciklamaLabel}" for="@next"/>
        <p:inputTextarea id="aciklama" value="#{stStokHareketController.selected.aciklama}"
                         title="#{messages.aciklamaText}" rows="3" styleClass="w-100"
                         autoResize="false" maxlength="300" readonly="true"/>

    </coco:viewpage>

</ui:composition>

</html>
