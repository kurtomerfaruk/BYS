<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:p="primefaces">

<ui:composition>

    <!-- Kamera ile barkod okutma: tek dialog, hem ekleme hem güncelleme ekranı kullanır -->
    <p:dialog widgetVar="StBarkodScannerDialog"
              id="StBarkodScannerDialog"
              header="Kameradan barkod okut"
              modal="true"
              resizable="false"
              closable="false"
              closeOnEscape="false"
              draggable="false"
              appendTo="@(body)"
              responsive="true"
              width="480">
        <h:form id="StBarkodScannerForm">
            <div id="stBarkodScannerContainer" style="width:100%;min-height:220px;background:#222;"></div>
            <div class="mt-2" style="text-align:right">
                <p:commandButton type="button" value="#{messages.buttonKapat}" icon="pi pi-times"
                                 styleClass="ui-button-danger"
                                 onclick="stBarkodScanner.kapat()"/>
            </div>
        </h:form>
    </p:dialog>

</ui:composition>

</html>
