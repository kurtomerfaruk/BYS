<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:pt="jakarta.faces.passthrough"
      xmlns:p="primefaces">
<ui:composition>

    <h:panelGroup id="barkodInputPanel" layout="block">
        <!-- Barkod alaninda Enter: Ekle butonunu tetikler -->
        <p:defaultCommand target="btnBarkodEkle" scope="barkodInputPanel"/>

        <div class="ui-grid ui-grid-responsive mb-3">
            <div class="ui-grid-row">
                <div class="ui-grid-col-3">
                    <div class="mt-2 fst-italic">
                        <i class="bx bx-info-circle"></i> Ürünün barkodunu okutunuz
                    </div>
                </div>
                <div class="ui-grid-col-9">
                    <div class="ui-inputgroup">
                        <span class="ui-inputgroup-addon"><i class="pi pi-qrcode"></i></span>
                        <p:inputText id="yeniBarkod" value="#{stStokController.barkod.barkod}"
                                     title="#{messages.barkodText}" maxlength="50" styleClass="w-100"
                                     autocomplete="off" placeholder="Barkod Okut / Gir" pt:autofocus="true"/>
                        <p:commandButton id="btnBarkodEkle" pt:data-tooltip="#{messages.buttonEkle}" icon="pi pi-plus"
                                         styleClass="ui-button-primary"
                                         actionListener="#{stStokController.addBarkod}"
                                         process="barkodInputPanel"
                                         update="barkodInputPanel barkodTable :growl"
                                         onstart="PF('Loading').show()"
                                         oncomplete="PF('Loading').hide(); stBarkodOdak('#{barkodInputId}');"/>
                        <p:commandButton type="button" pt:data-tooltip="#{messages.buttonKameraAc}" icon="pi pi-camera"
                                         styleClass="ui-button-secondary"
                                         onclick="stBarkodScanner.ac('#{barkodInputId}')"/>
                    </div>
                </div>

            </div>
        </div>
    </h:panelGroup>

    <p:dataTable id="barkodTable" value="#{stStokController.selected.stokBarkodList}" var="barkodItem"
                 styleClass="w-100" emptyMessage="#{messages.kayitBulunamadi}"
                 paginator="true" rows="10" rowsPerPageTemplate="10,20,50" lazy="false" paginatorPosition="bottom" size="small">
        <p:column headerText="#{messages.barkodText}">
            <h:outputText value="#{barkodItem.barkod}"/>
        </p:column>
        <p:column headerText="#{messages.buttonSil}" style="width:60px;text-align:center">
            <p:commandButton icon="pi pi-trash" styleClass="ui-button-danger"
                             actionListener="#{stStokController.removeBarkod(barkodItem)}"
                             update="barkodTable :growl"
                             onstart="PF('Loading').show()" oncomplete="PF('Loading').hide(); stBarkodOdak('#{barkodInputId}');">
                <p:confirm header="#{messages.ConfirmationHeader}" message="#{messages.ConfirmDeleteMessage}"
                           icon="pi pi-exclamation-circle"/>
            </p:commandButton>
        </p:column>
    </p:dataTable>

</ui:composition>

</html>
