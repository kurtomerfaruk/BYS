<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces">
<ui:composition>

    <div class="ui-grid ui-grid-responsive mb-3">
        <div class="ui-grid-row">
            <div class="ui-grid-col-4">
                <p:outputLabel value="#{messages.barkodLabel}" for="yeniBarkod"/>
                <p:inputText id="yeniBarkod" value="#{stStokController.barkod.barkod}"
                             title="#{messages.barkodText}" maxlength="100" styleClass="w-100"/>
            </div>
            <div class="ui-grid-col-3">
                <p:outputLabel value="#{messages.birimLabel}" for="yeniBarkodBirim"/>
                <p:selectOneMenu id="yeniBarkodBirim" value="#{stStokController.barkod.stBirim}" filter="true"
                                 converter="omnifaces.SelectItemsConverter" styleClass="w-100">
                    <f:selectItem itemValue="#{null}" itemLabel="#{messages.seciniz}"/>
                    <f:selectItems value="#{stBirimController.items}" var="birimItem"
                                   itemValue="#{birimItem}" itemLabel="#{birimItem.ad}"/>
                </p:selectOneMenu>
            </div>
            <div class="ui-grid-col-2">
                <p:outputLabel value="#{messages.anaBarkodLabel}" for="yeniAnaBarkod"/>
                <p:selectBooleanCheckbox id="yeniAnaBarkod" value="#{stStokController.barkod.anaBarkod}"/>
            </div>
            <div class="ui-grid-col-3">
                <p:commandButton value="#{messages.buttonEkle}" icon="pi pi-plus" styleClass="ui-button-primary mt-4"
                                 actionListener="#{stStokController.addBarkod}"
                                 process="@form" update=":StStokEditForm:barkodTable,:growl"
                                 onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"/>
            </div>
        </div>
    </div>

    <p:dataTable id="barkodTable" value="#{stStokController.selected.stokBarkodList}" var="barkodItem"
                 styleClass="w-100" emptyMessage="#{messages.kayitBulunamadi}"
                 paginator="true" rows="10" rowsPerPageTemplate="10,20,50" lazy="false" paginatorPosition="bottom">
        <p:column headerText="#{messages.barkodText}">
            <h:outputText value="#{barkodItem.barkod}"/>
        </p:column>
        <p:column headerText="#{messages.birimText}">
            <h:outputText value="#{barkodItem.stBirim.ad}"/>
        </p:column>
        <p:column headerText="#{messages.anaBarkodText}">
            <h:outputText value="#{barkodItem.anaBarkod ? messages.evet : messages.hayir}"/>
        </p:column>
        <p:column headerText="#{messages.buttonSil}" style="width:60px;text-align:center">
            <p:commandButton icon="pi pi-trash" styleClass="ui-button-danger"
                             actionListener="#{stStokController.removeBarkod(barkodItem)}"
                             update=":StStokEditForm:barkodTable,:growl"
                             onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()">
                <p:confirm header="#{messages.ConfirmationHeader}" message="#{messages.ConfirmDeleteMessage}"
                           icon="pi pi-exclamation-circle"/>
            </p:commandButton>
        </p:column>
    </p:dataTable>

</ui:composition>

</html>
