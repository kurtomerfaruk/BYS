<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:p="primefaces">

<ui:composition>

    <p:dialog widgetVar="StStokEditDialog"
              id="StStokEditDialogId"
              modal="true"
              resizable="false"
              closeOnEscape="true"
              header="#{messages.dialogYeniKayit}"
              appendTo="@(body)"
              responsive="true"
              onShow="PF('StStokEditDialog').initPosition();"
              fitViewport="true"
              position="top">

        <h:form id="StStokEditForm">
            <h:panelGroup id="display">
                <p:focus context="display"/>
                <p:panelGrid id="stokEditPanel" columns="1" columnClasses="column" rendered="#{stStokController.selected != null}" layout="tabular">

                    <p:panelGrid columns="2" layout="tabular" styleClass="w-100">
                        <p:outputLabel value="#{messages.malzemeKoduLabel}" for="@next"/>
                        <p:inputText value="#{stStokController.selected.malzemeKodu}" title="#{messages.malzemeKoduText}" required="true" size="50"
                                     maxlength="14"/>

                        <p:outputLabel value="#{messages.stokKoduLabel}" for="@next"/>
                        <p:inputText value="#{stStokController.selected.stokKodu}" title="#{messages.stokKoduText}" size="50" maxlength="50"/>

                        <p:outputLabel value="#{messages.stokAdiLabel}" for="@next"/>
                        <p:inputText value="#{stStokController.selected.stokAdi}" title="#{messages.stokAdiText}" required="true" size="50"
                                     maxlength="200"/>

                        <p:outputLabel value="#{messages.kategoriLabel}" for="@next"/>
                        <p:selectOneMenu value="#{stStokController.selected.stStokKategori}" converter="omnifaces.SelectItemsConverter" filter="true">
                            <f:selectItem itemValue="#{null}" itemLabel="#{messages.seciniz}"/>
                            <f:selectItems value="#{stStokKategoriController.items}" var="k" itemLabel="#{k.kategoriAdi}" itemValue="#{k}"/>
                        </p:selectOneMenu>

                        <p:outputLabel value="#{messages.markaLabel}" for="@next"/>
                        <p:inputText value="#{stStokController.selected.marka}" title="#{messages.markaText}" size="50" maxlength="100"/>

                        <p:outputLabel value="#{messages.modelText}" for="@next"/>
                        <p:inputText value="#{stStokController.selected.model}" title="#{messages.modelText}" size="50" maxlength="100"/>

                        <p:outputLabel value="Birim" for="@next"/>
                        <p:selectOneMenu value="#{stStokController.selected.stBirim}" required="true" converter="omnifaces.SelectItemsConverter">
                            <f:selectItem itemValue="#{null}" itemLabel="#{messages.seciniz}"/>
                            <f:selectItems value="#{stBirimController.items}" var="b" itemLabel="#{b.tanim}" itemValue="#{b}"/>
                        </p:selectOneMenu>

                        <p:outputLabel value="#{messages.kdvOraniLabel}" for="@next"/>
                        <p:selectOneMenu value="#{stStokController.selected.kdvOrani}" required="true">
                            <f:selectItem itemValue="0" itemLabel="0"/>
                            <f:selectItem itemValue="1" itemLabel="1"/>
                            <f:selectItem itemValue="10" itemLabel="10"/>
                            <f:selectItem itemValue="20" itemLabel="20"/>
                        </p:selectOneMenu>

                        <p:outputLabel value="#{messages.kritikStokLabel}" for="@next"/>
                        <p:inputNumber value="#{stStokController.selected.kritikStok}" decimalPlaces="4"/>

                        <p:outputLabel value="#{messages.varsayilanDepoLabel}" for="@next"/>
                        <p:selectOneMenu value="#{stStokController.selected.varsayilanStDepo}" converter="omnifaces.SelectItemsConverter">
                            <f:selectItem itemValue="#{null}" itemLabel="#{messages.seciniz}"/>
                            <f:selectItems value="#{stDepoController.items}" var="d" itemLabel="#{d.depoAdi}" itemValue="#{d}"/>
                        </p:selectOneMenu>

                        <h:outputText/>
                        <h:panelGroup>
                            <p:selectBooleanCheckbox value="#{stStokController.selected.lotTakibi}" itemLabel="#{messages.lotTakibiText}"/>
                            <p:selectBooleanCheckbox value="#{stStokController.selected.seriNoTakibi}" itemLabel="#{messages.seriNoTakibiText}"/>
                            <p:selectBooleanCheckbox value="#{stStokController.selected.sktTakibi}" itemLabel="#{messages.sktTakibiText}"/>
                        </h:panelGroup>

                        <p:outputLabel value="#{messages.maliyetYonetimiLabel}" for="@next"/>
                        <p:selectOneMenu value="#{stStokController.selected.maliyetYontemi}" converter="omnifaces.SelectItemsConverter">
                            <f:selectItem itemValue="#{null}" itemLabel="#{messages.seciniz}"/>
                            <f:selectItems value="#{enumMaliyetYontemi.ALL_VALUES}" var="m" itemLabel="#{m.displayValue}" itemValue="#{m}"/>
                        </p:selectOneMenu>

                        <p:outputLabel value="#{messages.aciklamaLabel}" for="@next"/>
                        <p:inputTextarea value="#{stStokController.selected.aciklama}" rows="3" styleClass="w-100" autoResize="false"/>
                    </p:panelGrid>

                    <p:panelGrid id="barcodePanel" columns="1" layout="grid" styleClass="w-100"
                                 columnClasses="ui-g-12 ui-md-12 ui-lg-12">
                        <p:outputLabel value="Yeni Barkod" for="@next"/>
                        <h:panelGroup>
                            <div class="ui-inputgroup">
                                <p:inputText id="barcode" value="#{stStokController.barcode}" size="30" maxlength="50"/>
                                <p:commandButton icon="pi pi-plus"
                                                 actionListener="#{stStokController.addBarkod}"
                                                 update="barcodePanel,:growl" process="barcodePanel" styleClass="ui-button-primary"/>
                            </div>
                        </h:panelGroup>

                        <p:dataTable id="barkodTable" value="#{stStokController.selected.stokBarkodList}" var="b" style="max-width:500px"
                                     size="small" filterBy="#{stStokController.filterBy}">
                            <p:column headerText="Barkod" filterMatchMode="contains" filterBy="#{b.barkod}">
                                <h:outputText value="#{b.barkod}"/>
                            </p:column>

                            <p:column style="display:none" filterBy="#{b.aktif}">
                                <h:outputText value="#{b.aktif}"/>
                            </p:column>

                            <p:column width="70">
                                <p:commandButton icon="pi pi-trash" styleClass="ui-button-danger"
                                                 actionListener="#{stStokController.removeBarkod(b)}"
                                                 update="StStokEditForm:barcodePanel,:growl" process="StStokEditForm:barcodePanel"/>
                            </p:column>
                        </p:dataTable>
                    </p:panelGrid>

                    <f:facet name="footer">
                        <div class="float-end">
                            <p:commandButton icon="pi pi-check" styleClass="ui-button-success"
                                             actionListener="#{stStokController.save}"
                                             value="#{messages.buttonKaydet}"
                                             update=":StStokListForm:datalist:datalist,:growl,display"
                                             oncomplete="handleSubmit(xhr,status,args,PF('StStokEditDialog'));"
                                             onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"/>
                            <p:commandButton icon="pi pi-times" styleClass="ui-button-danger"
                                             value="#{messages.buttonIptal}"
                                             onclick="PF('StStokEditDialog').hide()" immediate="true"
                                             onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()">
                                <p:resetInput target="@form"/>
                            </p:commandButton>
                        </div>
                    </f:facet>
                </p:panelGrid>
            </h:panelGroup>
        </h:form>
    </p:dialog>


</ui:composition>

</html>
