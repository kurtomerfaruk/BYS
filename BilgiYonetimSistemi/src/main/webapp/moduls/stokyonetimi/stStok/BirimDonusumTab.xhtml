<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces">
<ui:composition>

    <div class="ui-grid ui-grid-responsive mb-3">
        <div class="ui-grid-row">
            <div class="ui-grid-col-4">
                <p:outputLabel value="#{messages.birimLabel}" for="yeniDonusumBirim"/>
                <p:selectOneMenu id="yeniDonusumBirim" value="#{stStokController.birimDonusum.stBirim}" filter="true"
                                 converter="omnifaces.SelectItemsConverter" styleClass="w-100">
                    <f:selectItem itemValue="#{null}" itemLabel="#{messages.seciniz}"/>
                    <f:selectItems value="#{stBirimController.items}" var="birimItem"
                                   itemValue="#{birimItem}" itemLabel="#{birimItem.ad}"/>
                </p:selectOneMenu>
            </div>
            <div class="ui-grid-col-4">
                <p:outputLabel value="#{messages.donusumCarpaniLabel}" for="yeniDonusumCarpani"/>
                <p:inputNumber id="yeniDonusumCarpani" value="#{stStokController.birimDonusum.donusumCarpani}"
                               decimalPlaces="4" minValue="0" emptyValue="empty" styleClass="w-100"/>
            </div>
            <div class="ui-grid-col-4">
                <p:commandButton value="#{messages.buttonEkle}" icon="pi pi-plus" styleClass="ui-button-primary mt-4"
                                 actionListener="#{stStokController.addBirimDonusum}"
                                 process="@form" update=":StStokEditForm:birimDonusumTable,:growl"
                                 onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"/>
            </div>
        </div>
    </div>

    <p:dataTable id="birimDonusumTable" value="#{stStokController.selected.stokBirimDonusumList}"
                 var="donusumItem" styleClass="w-100" emptyMessage="#{messages.kayitBulunamadi}"
                 paginator="true" rows="10" rowsPerPageTemplate="10,20,50" lazy="false" size="small" paginatorPosition="bottom">
        <p:column headerText="#{messages.birimText}">
            <h:outputText value="#{donusumItem.stBirim.ad}"/>
        </p:column>
        <p:column headerText="#{messages.donusumCarpaniText}">
            <h:outputText value="#{donusumItem.donusumCarpani}">
                <f:convertNumber maxFractionDigits="4"/>
            </h:outputText>
        </p:column>
        <p:column headerText="#{messages.buttonSil}" style="width:60px;text-align:center">
            <p:commandButton icon="pi pi-trash" styleClass="ui-button-danger"
                             actionListener="#{stStokController.removeBirimDonusum(donusumItem)}"
                             update=":StStokEditForm:birimDonusumTable,:growl"
                             onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()">
                <p:confirm header="#{messages.ConfirmationHeader}" message="#{messages.ConfirmDeleteMessage}"
                           icon="pi pi-exclamation-circle"/>
            </p:commandButton>
        </p:column>
    </p:dataTable>

</ui:composition>

</html>
