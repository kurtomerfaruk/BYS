<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:p="primefaces">

<ui:composition>

    <p:dialog widgetVar="StStokCreateDialog"
              id="StStokCreateDialogId"
              modal="true"
              resizable="false"
              closeOnEscape="true"
              header="#{messages.dialogYeniKayit}"
              appendTo="@(body)"
              responsive="true"
              fitViewport="true"
              position="top"
              style="min-width:960px;">

        <h:form id="StStokCreateForm">
            <h:panelGroup id="display">
                <p:focus context="display"/>
                <div class="card">
                    <div class="card-body">

                        <ul class="nav nav-tabs mb-3 tab-style-8 scaleX">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="stKartCreateTab" data-bs-toggle="tab"
                                        data-bs-target="#stKartCreateTabPane" type="button" role="tab"
                                        aria-controls="stKartCreateTabPane" aria-selected="true">Kart Bilgileri
                                </button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="stBarkodCreateTab" data-bs-toggle="tab"
                                        data-bs-target="#stBarkodCreateTabPane" type="button" role="tab"
                                        aria-controls="stBarkodCreateTabPane" aria-selected="false">Barkodlar
                                </button>
                            </li>
                        </ul>

                        <div class="tab-content">
                            <div class="tab-pane show active overflow-hidden" id="stKartCreateTabPane"
                                 role="tabpanel" aria-labelledby="stKartCreateTab" tabindex="0">
                                <p:panelGrid columns="2" styleClass="w-100" layout="tabular"
                                             rendered="#{stStokController.selected != null}">
                                    <ui:include src="/moduls/stokyonetimi/stStok/KartTab.xhtml"/>
                                </p:panelGrid>
                            </div>

                            <div class="tab-pane overflow-hidden" id="stBarkodCreateTabPane"
                                 role="tabpanel" aria-labelledby="stBarkodCreateTab" tabindex="0">
                                <ui:include src="/moduls/stokyonetimi/stStok/BarkodTab.xhtml">
                                    <ui:param name="barkodInputId" value="StStokCreateForm:yeniBarkod"/>
                                </ui:include>
                            </div>

                        </div>
                    </div><!-- end card-body -->
                    <div class="card-footer">
                        <div class="float-end">
                            <p:commandButton id="btnKaydetDevam" icon="pi pi-check-circle" styleClass="ui-button-help"
                                             actionListener="#{stStokController.saveProceed}"
                                             value="#{messages.buttonKaydet}"
                                             update="display,:StStokListForm:datalist:datalist,:growl"
                                             onstart="PF('Loading').show()" oncomplete="PF('Loading').hide();"/>
                            <p:commandButton id="btnKaydetKapat" icon="pi pi-check" styleClass="ui-button-success"
                                             actionListener="#{stStokController.saveNew}"
                                             value="#{messages.buttonKaydetKapat}"
                                             update="display,:StStokListForm:datalist:datalist,:growl"
                                             oncomplete="handleSubmit(xhr,status,args,PF('StStokCreateDialog'));"
                                             onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"/>
                            <p:commandButton icon="pi pi-times" styleClass="ui-button-danger"
                                             value="#{messages.buttonKapat}"
                                             onclick="PF('StStokCreateDialog').hide()" immediate="true"
                                             onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()">
                                <p:resetInput target="@form"/>
                            </p:commandButton>
                        </div>
                    </div>
                </div>
                <p:defaultCommand target="btnKaydetDevam"/>
            </h:panelGroup>
        </h:form>

    </p:dialog>

</ui:composition>

</html>
