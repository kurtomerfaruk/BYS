<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces"
                xmlns:pt="jakarta.faces.passthrough"
                xmlns:coco="jakarta.faces.composite/ui">

    <h:form id="StTransferListForm" styleClass="form-height">

        <p:contextMenu id="StTransferDataTableContextMenu" for="datalist:datalist">
            <p:menuitem value="#{messages.buttonEkle}" onclick="document.getElementById('StTransferListForm:datalist:datalist:createButton').click();"
                        icon="pi pi-plus" rendered="#{syKullaniciController.hasPermission('sttransfer:ekle')}"/>
            <p:menuitem value="#{messages.buttonGuncelle}"
                        onclick="document.getElementById('StTransferListForm:datalist:datalist:editButton').click();"
                        icon="pi pi-pencil" rendered="#{syKullaniciController.hasPermission('sttransfer:guncelle')}"/>
            <p:menuitem value="#{messages.buttonDetay}" onclick="document.getElementById('StTransferListForm:datalist:datalist:viewButton').click();"
                        icon="pi pi-search"/>
            <p:menuitem value="#{messages.buttonSil}" onclick="document.getElementById('StTransferListForm:datalist:datalist:deleteButton').click();"
                        icon="pi pi-trash" rendered="#{syKullaniciController.hasPermission('sttransfer:sil')}"/>
        </p:contextMenu>
        <coco:datatable id="datalist"
                        value="#{stTransferController.lazyItems}"
                        rowKey="#{item.id}"
                        selection="#{stTransferController.selected}"
                        filtered="#{stTransferController.filtered}"
                        rowselect=":StTransferListForm:datalist:datalist:createButton,
                        :StTransferListForm:datalist:datalist:viewButton,
                        :StTransferListForm:datalist:datalist:editButton,
                        :StTransferListForm:datalist:datalist:deleteButton,
                        :StTransferListForm:datalist:datalist:confirmButton,
                        :StTransferListForm:datalist:datalist:dispatchButton,
                        :StTransferListForm:datalist:datalist:pickupButton,
                        :StTransferListForm:datalist:datalist:cancelButton,"
                        rowDblselect="document.getElementById('StTransferListForm:datalist:datalist:editButton').click()"
                        contextMenu=":StTransferListForm:datalist:datalist:createButton
                        :StTransferListForm:datalist:datalist:viewButton
                        :StTransferListForm:datalist:datalist:editButton
                        :StTransferListForm:datalist:datalist:deleteButton
                        :StTransferListForm:datalist:datalist:confirmButton
                        :StTransferListForm:datalist:datalist:dispatchButton
                        :StTransferListForm:datalist:datalist:pickupButton
                        :StTransferListForm:datalist:datalist:cancelButton"
                        selectListener="#{stTransferController.resetParents}"
                        controller="#{stTransferController}"
                        header="#{messages.transferListesi}">

            <p:ajax event="colResize" listener="#{stTransferController.onResize}"/>

            <f:facet name="paginatorBottomLeft">

                <p:commandButton id="createButton" styleClass="ui-button-primary" icon="pi pi-plus" pt:data-tooltip="#{messages.buttonEkle}"
                                 actionListener="#{stTransferController.prepareCreate}" update=":StTransferCreateForm:StTransferCreateForm"
                                 oncomplete="PF('StTransferCreateDialog').show()" onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('sttransfer:ekle')}"/>
                <p:commandButton id="editButton" styleClass="ui-button-success" icon="pi pi-pencil" pt:data-tooltip="#{messages.buttonGuncelle}"
                                 update=":StTransferEditForm:StTransferEditForm" oncomplete="PF('StTransferEditDialog').show()"
                                 disabled="#{empty stTransferController.selected}" onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('sttransfer:guncelle')}"/>
                <p:commandButton id="viewButton" styleClass="ui-button-info" icon="pi pi-search" pt:data-tooltip="#{messages.buttonDetay}"
                                 update=":StTransferViewForm:StTransferViewForm" oncomplete="PF('StTransferViewDialog').show()"
                                 disabled="#{empty stTransferController.selected}" onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"/>
                <p:commandButton id="deleteButton" styleClass="ui-button-danger" icon="pi pi-trash" pt:data-tooltip="#{messages.buttonSil}"
                                 actionListener="#{stTransferController.delete}" update=":growl,datalist"
                                 disabled="#{empty stTransferController.selected}"
                                 rendered="#{syKullaniciController.hasPermission('sttransfer:sil')}">
                    <p:confirm header="#{messages.ConfirmationHeader}" message="#{messages.ConfirmDeleteMessage}" icon="pi pi-exclamation-circle"/>
                </p:commandButton>

                <p:commandButton id="confirmButton" styleClass="ui-button-warning" icon="pi pi-check" value="#{messages.buttonOnayla}"
                                 actionListener="#{stTransferController.confirm()}" update=":growl,datalist"
                                 disabled="#{empty stTransferController.selected}" onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('sttransfer:onayla')}"/>
                <p:commandButton id="dispatchButton" styleClass="ui-button-warning" icon="pi pi-send" value="#{messages.buttonSevket}"
                                 actionListener="#{stTransferController.dispatch()}" update=":growl,datalist"
                                 disabled="#{empty stTransferController.selected}" onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('sttransfer:sevket')}"/>
                <p:commandButton id="pickupButton" styleClass="ui-button-success" icon="pi pi-inbox" value="#{messages.buttonTeslimAl}"
                                 actionListener="#{stTransferController.pickUp()}" update=":growl,datalist"
                                 disabled="#{empty stTransferController.selected}" onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('sttransfer:teslimal')}"/>
                <p:commandButton id="cancelButton" styleClass="ui-button-danger" icon="pi pi-times" value="#{messages.buttonIptal}"
                                 actionListener="#{stTransferController.cancel()}" update=":growl,datalist"
                                 disabled="#{empty stTransferController.selected}" onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('sttransfer:iptal')}"/>

            </f:facet>

        </coco:datatable>


        <ui:include src="/confirmation.xhtml"/>

    </h:form>

</ui:composition>
