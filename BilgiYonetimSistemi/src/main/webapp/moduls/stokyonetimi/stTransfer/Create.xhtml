<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces"
      xmlns:coco="jakarta.faces.composite/ui">

<ui:composition>

    <coco:createpage id="StTransferCreateForm"
                     renderedListener="#{stTransferController.selected != null}"
                     widgetVar="StTransferCreateDialog"
                     actionListener="#{stTransferController.saveNew}"
                     listForm="StTransferListForm">

        <p:outputLabel value="#{messages.transferNoLabel}" for="@next"/>
        <p:inputText value="#{stTransferController.selected.transferNo}" title="#{messages.transferNoText}" readonly="true" size="30" maxlength="50"/>

        <p:outputLabel value="#{messages.kaynakDepoLabel}" for="@next"/>
        <p:selectOneMenu value="#{stTransferController.selected.kaynakDepo}" required="true" filter="true" converter="omnifaces.SelectItemsConverter">
            <f:selectItem itemValue="#{null}" itemLabel="#{messages.seciniz}"/>
            <f:selectItems value="#{stDepoController.items}" var="d" itemLabel="#{d.depoAdi}" itemValue="#{d}"/>
        </p:selectOneMenu>

        <p:outputLabel value="#{messages.hedefDepoLabel}" for="@next"/>
        <p:selectOneMenu value="#{stTransferController.selected.hedefDepo}" required="true" filter="true" converter="omnifaces.SelectItemsConverter">
            <f:selectItem itemValue="#{null}" itemLabel="#{messages.seciniz}"/>
            <f:selectItems value="#{stDepoController.items}" var="d" itemLabel="#{d.depoAdi}" itemValue="#{d}"/>
        </p:selectOneMenu>

        <p:outputLabel value="#{messages.durumLabel}" for="@next"/>
        <p:selectOneMenu value="#{stTransferController.selected.durum}" required="true" converter="omnifaces.SelectItemsConverter">
            <f:selectItem itemValue="#{null}" itemLabel="#{messages.seciniz}"/>
            <f:selectItems value="#{enumTransferDurum.ALL_VALUES}" var="t" itemLabel="#{t.displayValue}" itemValue="#{t}"/>
        </p:selectOneMenu>

        <p:outputLabel value="#{messages.aciklamaLabel}" for="@next"/>
        <p:inputTextarea value="#{stTransferController.selected.aciklama}" rows="3" styleClass="w-100" autoResize="false"/>

        <p:outputLabel value="Stok Kartı" for="@next"/>
        <p:selectOneMenu value="#{stTransferController.stStok}" converter="omnifaces.SelectItemsConverter">
            <f:selectItem itemValue="#{null}" itemLabel="#{messages.seciniz}"/>
            <f:selectItems value="#{stStokController.items}" var="s" itemLabel="#{s.stokKodu} - #{s.stokAdi}" itemValue="#{s}"/>
        </p:selectOneMenu>

        <p:outputLabel value="Miktar" for="@next"/>
        <p:inputNumber value="#{stTransferController.amount}" decimalPlaces="4"/>

        <p:outputLabel value="Birim" for="@next"/>
        <p:selectOneMenu value="#{stTransferController.unit}" converter="omnifaces.SelectItemsConverter">
            <f:selectItem itemValue="#{null}" itemLabel="#{messages.seciniz}"/>
            <f:selectItems value="#{stBirimController.items}" var="b" itemLabel="#{b.birimAdi}" itemValue="#{b}"/>
        </p:selectOneMenu>

        <p:outputLabel value="Kaynak Lokasyon" for="@next"/>
        <p:selectOneMenu value="#{stTransferController.sourceLocation}" converter="omnifaces.SelectItemsConverter">
            <f:selectItem itemValue="#{null}" itemLabel="#{messages.seciniz}"/>
            <f:selectItems value="#{stDepoLokasyonController.items}" var="l" itemLabel="#{l.lokasyonKodu}" itemValue="#{l}"/>
        </p:selectOneMenu>

        <p:outputLabel value="Hedef Lokasyon" for="@next"/>
        <p:selectOneMenu value="#{stTransferController.targetLocation}" converter="omnifaces.SelectItemsConverter">
            <f:selectItem itemValue="#{null}" itemLabel="#{messages.seciniz}"/>
            <f:selectItems value="#{stDepoLokasyonController.items}" var="l" itemLabel="#{l.lokasyonKodu}" itemValue="#{l}"/>
        </p:selectOneMenu>

        <p:outputLabel value="" for="@next"/>
        <p:commandButton value="Kalem Ekle" icon="pi pi-plus"
                         actionListener="#{stTransferController.addItem()}"
                         update="@form" process="@this" styleClass="ui-button-primary"/>

        <p:outputLabel value="Transfer Kalemleri" for="@next"/>
        <p:dataTable value="#{stTransferController.selected.stTransferKalemList}" var="k">
            <p:column headerText="Stok Kartı">
                <h:outputText value="#{k.stStok.stokKodu} - #{k.stStok.stokAdi}"/>
            </p:column>
            <p:column headerText="Miktar">
                <h:outputText value="#{k.miktar}"/>
            </p:column>
            <p:column headerText="Birim">
                <h:outputText value="#{k.stBirim.tanim}"/>
            </p:column>
            <p:column headerText="Kaynak Lokasyon">
                <h:outputText value="#{k.kaynakStDepoLokasyon.lokasyonKodu}"/>
            </p:column>
            <p:column headerText="Hedef Lokasyon">
                <h:outputText value="#{k.hedefStDepoLokasyon.lokasyonKodu}"/>
            </p:column>
            <p:column>
                <p:commandButton icon="pi pi-trash" styleClass="ui-button-danger"
                                 actionListener="#{stTransferController.removeItem(k)}"
                                 update="@form" process="@this"/>
            </p:column>
        </p:dataTable>

    </coco:createpage>

</ui:composition>

</html>
