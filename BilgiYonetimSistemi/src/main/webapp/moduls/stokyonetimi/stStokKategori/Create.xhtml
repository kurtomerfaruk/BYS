<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces"
      xmlns:coco="jakarta.faces.composite/ui">

<ui:composition>

    <coco:createpage id="StStokKategoriCreateForm"
                     renderedListener="#{stStokKategoriController.selected != null}"
                     widgetVar="StStokKategoriCreateDialog"
                     actionListener="#{stStokKategoriController.saveNew}"
                     listForm="StStokKategoriListForm">

        <p:outputLabel value="#{messages.kodLabel}" for="@next"/>
        <p:inputText id="kod" value="#{stStokKategoriController.selected.kod}" title="#{messages.kodText}" size="30" maxlength="50"/>

        <p:outputLabel value="#{messages.adLabel}" for="@next"/>
        <p:inputText id="ad" value="#{stStokKategoriController.selected.ad}" title="#{messages.adText}" size="50" maxlength="150" required="true"/>

        <p:outputLabel value="#{messages.ustKategoriLabel}" for="@next"/>
        <p:selectOneMenu id="ustStokKategori" value="#{stStokKategoriController.selected.ustKategori}" filter="true"
                         converter="omnifaces.SelectItemsConverter">
            <f:selectItem itemValue="#{null}" itemLabel="#{messages.seciniz}"/>
            <f:selectItems value="#{stStokKategoriController.items}" var="kategoriItem"
                           itemValue="#{kategoriItem}" itemLabel="#{kategoriItem.ad}"/>
        </p:selectOneMenu>

    </coco:createpage>

</ui:composition>

</html>
