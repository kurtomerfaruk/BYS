<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces"
      xmlns:coco="jakarta.faces.composite/ui">

<ui:composition>

    <coco:editpage id="StDepoLokasyonEditForm"
                   widgetVar="StDepoLokasyonEditDialog"
                   actionListener="#{stDepoLokasyonController.save}"
                   listForm="StDepoLokasyonListForm"
                   model="#{stDepoLokasyonController.selected}">

        <p:outputLabel value="#{messages.depoLabel}" for="@next"/>
        <p:selectOneMenu value="#{stDepoLokasyonController.selected.stDepo}" required="true" converter="omnifaces.SelectItemsConverter" filter="true">
            <f:selectItem itemValue="#{null}" itemLabel="#{messages.seciniz}"/>
            <f:selectItems value="#{stDepoController.items}" var="depo" itemLabel="#{depo.depoAdi}" itemValue="#{depo}"/>
        </p:selectOneMenu>

        <p:outputLabel value="#{messages.lokasyonKoduLabel}" for="@next"/>
        <p:inputText value="#{stDepoLokasyonController.selected.lokasyonKodu}" title="#{messages.lokasyonKoduText}" required="true" size="30"
                     maxlength="50"/>

        <p:outputLabel value="#{messages.koridorLabel}" for="@next"/>
        <p:inputText value="#{stDepoLokasyonController.selected.koridor}" title="#{messages.koridorText}" size="20" maxlength="50"/>

        <p:outputLabel value="#{messages.rafLabel}" for="@next"/>
        <p:inputText value="#{stDepoLokasyonController.selected.raf}" title="#{messages.rafText}" size="20" maxlength="50"/>

        <p:outputLabel value="#{messages.bolumLabel}" for="@next"/>
        <p:inputText value="#{stDepoLokasyonController.selected.bolum}" title="#{messages.bolumText}" size="20" maxlength="50"/>

        <p:outputLabel value="#{messages.gozNoLabel}" for="@next"/>
        <p:inputText value="#{stDepoLokasyonController.selected.gozNo}" title="#{messages.gozNoText}" size="20" maxlength="50"/>

        <p:outputLabel value="#{messages.lokasyonTipiLabel}" for="@next"/>
        <p:selectOneMenu value="#{stDepoLokasyonController.selected.lokasyonTipi}" converter="omnifaces.SelectItemsConverter">
            <f:selectItem itemValue="#{null}" itemLabel="#{messages.seciniz}"/>
            <f:selectItems value="#{enumLokasyonTipi.ALL_VALUES}" var="tip" itemLabel="#{tip.displayValue}" itemValue="#{tip}"/>
        </p:selectOneMenu>

        <p:outputLabel value="#{messages.kapasiteMiktarLabel}" for="@next"/>
        <p:inputNumber value="#{stDepoLokasyonController.selected.kapasiteMiktar}" title="#{messages.kapasiteMiktarText}" decimalPlaces="4"/>

    </coco:editpage>

</ui:composition>

</html>
