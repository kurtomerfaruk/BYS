<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces"
                xmlns:pt="jakarta.faces.passthrough"
                xmlns:coco="jakarta.faces.composite/ui">

    <h:form id="StSayimListForm" class="form-height">

        <p:contextMenu id="StSayimDataTableContextMenu" for="datalist:datalist">
            <p:menuitem value="#{messages.buttonEkle}" onclick="document.getElementById('StSayimListForm:datalist:datalist:createButton').click();"
                        icon="pi pi-plus" rendered="#{syKullaniciController.hasPermission('stsayim:ekle')}"/>
            <p:menuitem value="#{messages.buttonGuncelle}" onclick="document.getElementById('StSayimListForm:datalist:datalist:editButton').click();"
                        icon="pi pi-pencil" rendered="#{syKullaniciController.hasPermission('stsayim:guncelle')}"/>
            <p:menuitem value="#{messages.buttonDetay}" onclick="document.getElementById('StSayimListForm:datalist:datalist:viewButton').click();"
                        icon="pi pi-search"/>
            <p:menuitem value="#{messages.buttonYazdir}" onclick="document.getElementById('StSayimListForm:datalist:datalist:printButton').click();"
                        icon="pi pi-print"/>
        </p:contextMenu>

        <coco:datatable id="datalist"
                        value="#{stSayimController.lazyItems}"
                        rowKey="#{item.id}"
                        selection="#{stSayimController.selected}"
                        filtered="#{stSayimController.filtered}"
                        rowselect=":StSayimListForm:datalist:datalist:createButton,:StSayimListForm:datalist:datalist:viewButton,:StSayimListForm:datalist:datalist:editButton,:StSayimListForm:datalist:datalist:printButton"
                        rowDblselect="document.getElementById('StSayimListForm:datalist:datalist:editButton').click()"
                        contextMenu=":StSayimListForm:datalist:datalist:createButton :StSayimListForm:datalist:datalist:viewButton :StSayimListForm:datalist:datalist:editButton :StSayimListForm:datalist:datalist:printButton"
                        selectListener="#{stSayimController.resetParents}"
                        controller="#{stSayimController}"
                        header="#{messages.sayimListesi}">

            <p:ajax event="colResize" listener="#{stSayimController.onResize}"/>


            <f:facet name="paginatorBottomLeft">
                <p:commandButton id="createButton" styleClass="ui-button-primary" icon="pi pi-plus" pt:data-tooltip="#{messages.buttonEkle}"
                                 actionListener="#{stSayimController.prepareCreate}" update=":StSayimCreateForm:StSayimCreateForm"
                                 oncomplete="PF('StSayimCreateDialog').show()" onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('stsayim:ekle')}"/>
                <p:commandButton id="editButton" styleClass="ui-button-success" icon="pi pi-pencil" pt:data-tooltip="#{messages.buttonGuncelle}"
                                 update=":StSayimEditForm"
                                 oncomplete="PF('StSayimEditDialog').show()" disabled="#{empty stSayimController.selected}"
                                 onstart="PF('Loading').show()"
                                 onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('stsayim:guncelle')}"/>
                <p:commandButton id="viewButton" styleClass="ui-button-info" icon="pi pi-search" pt:data-tooltip="#{messages.buttonDetay}"
                                 update=":StSayimViewForm,StSayimViewDialogId"
                                 oncomplete="PF('StSayimViewDialog').show()" disabled="#{empty stSayimController.selected}"
                                 onstart="PF('Loading').show()"
                                 onsuccess="PF('Loading').hide()"/>
                <p:commandButton id="printButton" styleClass="ui-button-secondary" icon="pi pi-print" pt:data-tooltip="#{messages.buttonYazdir}"
                                 actionListener="#{stSayimPrint.print(stSayimController.selected.id)}"
                                 update=":PrintForm,:growl"
                                 oncomplete="PF('PrintDialog').show()"
                                 disabled="#{empty stSayimController.selected}"
                                 onstart="PF('Loading').show()"
                                 onsuccess="PF('Loading').hide()"/>
            </f:facet>

        </coco:datatable>


        <ui:include src="/confirmation.xhtml"/>

    </h:form>

    <ui:include src="/print/Print.xhtml"/>

</ui:composition>
