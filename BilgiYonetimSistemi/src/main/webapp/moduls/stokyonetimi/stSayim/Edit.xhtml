<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:pt="jakarta.faces.passthrough"
      xmlns:p="primefaces">

<ui:composition>

    <p:dialog widgetVar="StSayimEditDialog"
              id="StSayimEditDialogId"
              modal="true"
              resizable="false"
              closeOnEscape="true"
              header="#{messages.dialogKayitGuncelle}"
              appendTo="@(body)"
              responsive="true"
              fitViewport="true"
              position="top"
              onShow="PF('StSayimEditDialog').initPosition(); stBarkodOdak('StSayimEditForm:sayimBarkod');"
              style="min-width:1050px;">

        <h:form id="StSayimEditForm">
            <h:panelGroup id="display">
                <div class="card">
                    <div class="card-body">

                        <p:panelGrid columns="2" styleClass="w-100" layout="tabular"
                                     rendered="#{stSayimController.selected != null}">
                            <p:outputLabel value="#{messages.depoLabel}" for="stDepo"/>
                            <p:selectOneMenu id="stDepo" value="#{stSayimController.selected.stDepo}" filter="true"
                                             converter="omnifaces.SelectItemsConverter" required="true"
                                             disabled="#{stSayimController.selected.durum ne 'TASLAK'}">
                                <f:selectItem itemValue="#{null}" itemLabel="#{messages.seciniz}"/>
                                <f:selectItems value="#{stDepoController.items}" var="depoItem"
                                               itemValue="#{depoItem}" itemLabel="#{depoItem.ad}"/>
                            </p:selectOneMenu>

                            <p:outputLabel value="#{messages.aciklamaLabel}" for="aciklama"/>
                            <p:inputTextarea id="aciklama" value="#{stSayimController.selected.aciklama}"
                                             title="#{messages.aciklamaText}" rows="2" styleClass="w-100"
                                             autoResize="false" maxlength="300"
                                             disabled="#{stSayimController.selected.durum ne 'TASLAK'}"/>

                            <p:outputLabel value="#{messages.durumLabel}" for="@next"/>
                            <h:outputText value="#{stSayimController.selected.durum.displayValue}"
                                          styleClass="fw-bold"/>
                        </p:panelGrid>

                        <!-- TASLAK: kalem ekleme -->
                        <ui:fragment rendered="#{stSayimController.selected.durum eq 'TASLAK'}">

                            <div class="ui-grid ui-grid-responsive">
                                <div class="ui-grid-row">
                                    <div class="ui-grid-col-10">
                                        <p:outputLabel value="#{messages.stokText}" for="@next"/>
                                        <p:selectOneMenu id="kalemStok" value="#{stSayimController.kalem.stStok}"
                                                         filter="true"
                                                         converter="omnifaces.SelectItemsConverter">
                                            <f:selectItem itemValue="#{null}" itemLabel="#{messages.seciniz}"/>
                                            <f:selectItems value="#{stStokController.items}" var="stokItem"
                                                           itemValue="#{stokItem}"
                                                           itemLabel="#{stokItem.stokKodu} - #{stokItem.stokAdi}"/>
                                        </p:selectOneMenu>
                                    </div>
                                    <div class="ui-grid-col-2">
                                        <p:outputLabel value="#{messages.miktarText}" for="@next"/>
                                        <div class="ui-inputgroup">
                                            <p:inputNumber id="kalemSistem"
                                                           value="#{stSayimController.kalem.sistemMiktari}"
                                                           decimalPlaces="4" emptyValue="empty" minValue="0"
                                                           style="width:140px !important;"/>
                                            <p:commandButton pt:data-tooltip="#{messages.buttonKalemEkle}"
                                                             icon="pi pi-plus"
                                                             styleClass="ui-button-primary"
                                                             actionListener="#{stSayimController.addKalem}"
                                                             process="@this,kalemStok,kalemSistem"
                                                             update="display,:growl"
                                                             onstart="PF('Loading').show()"
                                                             onsuccess="PF('Loading').hide()"/>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </ui:fragment>

                        <!-- SAYIMDA: tek ekran -->
                        <ui:fragment rendered="#{stSayimController.selected.durum eq 'SAYIMDA'}">
                            <h:panelGroup id="sayimHizliPanel" layout="block"
                                          style="padding:10px;border:1px solid #d5dce3;border-radius:6px;background:#f8fbff;">
                                <p:defaultCommand target="btnBarkodEkle" scope="sayimHizliPanel"/>
                                <div class="ui-grid ui-grid-responsive">
                                    <div class="ui-grid-row">
                                        <div class="ui-grid-col-5">
                                            <p:outputLabel
                                                    value="#{messages.barkodText} / #{messages.stokKoduText} / #{messages.malzemeKoduText}"
                                                    for="@next"/>
                                            <p:inputText id="sayimBarkod"
                                                         value="#{stSayimController.barcodeInput}"
                                                         maxlength="50" autocomplete="off" styleClass="w-100"
                                                         style="font-size:16px;font-weight:600"/>
                                        </div>
                                        <div class="ui-grid-col-2">
                                            <p:outputLabel value="#{messages.sayilanMiktarText}" for="@next"/>
                                            <div class="ui-inputgroup">
                                                <p:inputNumber id="sayimMiktar"
                                                               value="#{stSayimController.countQuantity}"
                                                               decimalPlaces="4" minValue="0" emptyValue="empty"
                                                               styleClass="w-100"/>
                                                <p:commandButton id="btnBarkodEkle"
                                                                 pt:data-tooltip="#{messages.buttonKaydet}"
                                                                 icon="pi pi-check"
                                                                 styleClass="ui-button-primary"
                                                                 actionListener="#{stSayimController.addCountFromBarcode}"
                                                                 process="sayimHizliPanel"
                                                                 update="sayimHizliPanel sayimKalemTable sayimOzetPanel :growl"
                                                                 onstart="PF('Loading').show()"
                                                                 oncomplete="PF('Loading').hide(); stBarkodOdak('StSayimEditForm:sayimBarkod');"/>
                                                <p:commandButton type="button" icon="pi pi-camera"
                                                                 pt:data-tooltip="#{messages.buttonKameraAc}"
                                                                 styleClass="ui-button-secondary"
                                                                 onclick="stBarkodScanner.ac('StSayimEditForm:sayimBarkod','StSayimEditForm:btnBarkodEkle')"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="mt-2" style="font-size:12px;color:#718295">
                                    Barkodu okutup Enter'a basın; değer anında kaydedilir.
                                </div>
                                <h:panelGroup rendered="#{stSayimController.duplicateCount}">
                                    <div style="margin-top:6px;font-size:12px;color:#8a5a00">
                                        Bu stok zaten sayıldı. Ekle veya değiştir
                                        <p:commandButton value="#{messages.miktarEkle}" icon="pi pi-plus"
                                                         styleClass="ui-button-success ms-1"
                                                         actionListener="#{stSayimController.addToExistingCount}"
                                                         process="sayimHizliPanel"
                                                         update="sayimHizliPanel sayimKalemTable sayimOzetPanel :growl"
                                                         oncomplete="PF('Loading').hide(); stBarkodOdak('StSayimEditForm:sayimBarkod')"/>
                                        <p:commandButton value="#{messages.degistir}" icon="pi pi-pencil"
                                                         styleClass="ui-button-secondary ms-1"
                                                         actionListener="#{stSayimController.overwriteCount}"
                                                         process="sayimHizliPanel"
                                                         update="sayimHizliPanel sayimKalemTable sayimOzetPanel :growl"
                                                         oncomplete="PF('Loading').hide(); stBarkodOdak('StSayimEditForm:sayimBarkod')"/>
                                    </div>
                                </h:panelGroup>
                            </h:panelGroup>

                            <h:panelGroup id="sayimOzetPanel" layout="block"
                                          styleClass="d-flex justify-content-between align-items-center mt-2 mb-2 flex-wrap">
                                <div style="font-size:12px;color:#5b6b7b">
                                    #{messages.sayilanMiktarText}: <b>
                                    <p:outputLabel value="#{stSayimController.countedCount}"/>
                                </b> /
                                    #{stSayimController.selected.kalemler.size()} ·
                                    #{messages.kalan}: <b><p:outputLabel value="#{stSayimController.remainingCount}"/>
                                </b> ·
                                    #{messages.farkli}: <b><p:outputLabel value="#{stSayimController.differenceCount}"/></b>
                                    <div class="progress progress-lg custom-progress-3 progress-animate my-2 ozet-progress" role="progressbar"
                                         aria-valuenow="#{stSayimController.completePercentage()}" aria-valuemin="0" aria-valuemax="100">
                                        <div class="progress-bar" style="width: #{stSayimController.completePercentage()}%">
                                            <div class="progress-bar-value ozet-progress"><p:outputLabel
                                                    value="#{stSayimController.completePercentage()}"/>%
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="d-flex gap-2">
                                    <p:commandButton value="#{messages.buttonSayimGeriAl}" icon="pi pi-undo"
                                                     styleClass="ui-button-warning"
                                                     actionListener="#{stSayimController.undoLastCount}"
                                                     process="@this" update="display,:growl"/>
                                    <p:commandButton value="#{messages.buttonSayimTamamla}" icon="pi pi-check-circle"
                                                     styleClass="ui-button-success"
                                                     actionListener="#{stSayimController.finish}"
                                                     update="display,:StSayimListForm:datalist:datalist,:growl"/>
                                </div>
                            </h:panelGroup>
                        </ui:fragment>

                        <!-- SAYIMDA: düzenlenebilir kalem tablosu -->
                        <p:dataTable id="sayimKalemTable"
                                     value="#{stSayimController.selected.kalemler}"
                                     var="kalemItem"
                                     emptyMessage="#{messages.kayitBulunamadi}"
                                     size="small"
                                     stripedRows="true"
                                     lazy="false"
                                     scrollable="true"
                                     scrollHeight="260"
                                     rowIndexVar="indexVar"
                                     showGridlines="true"
                                     editable="#{stSayimController.selected.durum eq 'SAYIMDA'
                                     or stSayimController.selected.durum eq 'ONAY_BEKLIYOR'}"
                                     editMode="cell">

                            <p:ajax event="cellEdit" listener="#{stSayimController.onCountCellEdit}"
                                    update="sayimKalemTable StSayimEditForm:sayimOzetPanel :growl"/>
                            <p:column headerText="#{messages.stokKoduText}" filterBy="#{kalemItem.stStok.stokKodu}" filterMatchMode="contains"
                                      width="150">
                                <h:outputText value="#{kalemItem.stStok.stokKodu}"/>
                            </p:column>
                            <p:column headerText="#{messages.stokText}" filterBy="#{kalemItem.stStok.stokAdi}" filterMatchMode="contains">
                                <h:outputText value="#{kalemItem.stStok.stokAdi}"/>
                            </p:column>
                            <p:column headerText="#{messages.sistemMiktariText}" styleClass="text-end" filterBy="#{kalemItem.sistemMiktari}"
                                      width="120">
                                <h:outputText value="#{kalemItem.sistemMiktari}">
                                    <f:convertNumber minFractionDigits="0" maxFractionDigits="4"/>
                                </h:outputText>
                            </p:column>
                            <p:column headerText="#{messages.sayilanMiktarText}" styleClass="text-end"
                                      filterBy="#{kalemItem.sayilanMiktar}" width="120">
                                <p:cellEditor>
                                    <f:facet name="output">
                                        <h:outputText value="#{kalemItem.sayilanMiktar}">
                                            <f:convertNumber minFractionDigits="0" maxFractionDigits="4"/>
                                        </h:outputText>
                                    </f:facet>
                                    <f:facet name="input">
                                        <p:inputNumber value="#{kalemItem.sayilanMiktar}" decimalPlaces="4"
                                                       minValue="0" emptyValue="empty">
                                            <p:ajax event="change" update="@(.total),StSayimEditForm:sayimOzetPanel"/>
                                        </p:inputNumber>
                                    </f:facet>
                                </p:cellEditor>
                            </p:column>
                            <p:column headerText="#{messages.farkText}" styleClass="text-end" width="120">
                                <p:outputLabel value="#{kalemItem.fark}"
                                               styleClass="total #{kalemItem.fark != null and kalemItem.fark != 0 ? 'text-warning fw-bold' : ''}">
                                    <f:convertNumber minFractionDigits="0" maxFractionDigits="4"/>
                                </p:outputLabel>
                            </p:column>
                            <p:column headerText="#{messages.durumText}" width="100">
                                <p:outputLabel value="#{stSayimController.getItemStatus(kalemItem)}" styleClass="total"/>
                            </p:column>
                            <p:column width="70" styleClass="text-center" headerText="İşlem">
                                <p:commandButton icon="pi pi-ban" styleClass="ui-button-warning rounded-button ui-button-sm"
                                                 pt:data-tooltip="#{messages.sayilmadi}"
                                                 disabled="#{stSayimController.selected.durum eq 'TAMAMLANDI'
                                                 or stSayimController.selected.durum  eq 'IPTAL'}"
                                                 actionListener="#{stSayimController.markNotCounted(kalemItem)}"
                                                 process="@this" update="sayimKalemTable StSayimEditForm:sayimOzetPanel :growl"/>
                            </p:column>
                        </p:dataTable>

                    </div>

                    <div class="card-footer">
                        <div class="float-end d-flex gap-2 flex-wrap">
                            <p:commandButton icon="pi pi-check" styleClass="ui-button-success"
                                             value="#{messages.buttonKaydet}"
                                             actionListener="#{stSayimController.save}"
                                             update="display,:StSayimListForm:datalist:datalist,:growl"
                                             oncomplete="handleSubmit(xhr,status,args,PF('StSayimEditDialog'));"
                                             onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"
                                             rendered="#{stSayimController.selected.durum eq 'TASLAK'}"/>

                            <p:commandButton value="#{messages.buttonSayimBaslat}" icon="pi pi-play"
                                             styleClass="ui-button-primary"
                                             actionListener="#{stSayimController.start}"
                                             update="display,:StSayimListForm:datalist:datalist,:growl"
                                             onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"
                                             rendered="#{stSayimController.selected.durum eq 'TASLAK'}"/>

                            <p:commandButton value="#{messages.buttonSayimOnayla}" icon="pi pi-verified"
                                             styleClass="ui-button-success"
                                             actionListener="#{stSayimController.confirm}"
                                             update="display,:StSayimListForm:datalist:datalist,:growl"
                                             onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"
                                             rendered="#{stSayimController.selected.durum eq 'ONAY_BEKLIYOR'}"/>

                            <p:commandButton value="#{messages.buttonIptalEt}" icon="pi pi-ban"
                                             styleClass="ui-button-warning"
                                             actionListener="#{stSayimController.cancel}"
                                             update="display,:StSayimListForm:datalist:datalist,:growl"
                                             onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"
                                             rendered="#{stSayimController.selected.durum ne 'TAMAMLANDI' and stSayimController.selected.durum ne 'IPTAL'}"/>

                            <p:commandButton icon="pi pi-times" styleClass="ui-button-danger"
                                             value="#{messages.buttonKapat}" onclick="PF('StSayimEditDialog').hide()"
                                             onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"
                                             immediate="true"/>
                        </div>
                    </div>
                </div>
                <ui:include src="/confirmation.xhtml"/>
            </h:panelGroup>
        </h:form>

    </p:dialog>

</ui:composition>

</html>
