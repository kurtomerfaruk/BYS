<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces"
      xmlns:coco="jakarta.faces.composite/ui">

<ui:composition>

    <coco:createpage id="OrtCihazCreateForm"
                     renderedListener="#{ortCihazController.selected != null}"
                     widgetVar="OrtCihazCreateDialog"
                     actionListener="#{ortCihazController.saveNew}"
                     listForm="OrtCihazListForm">

        <p:outputLabel value="#{messages.cihazTuruLabel}" for="@next"/>
        <p:selectOneMenu value="#{ortCihazController.selected.cihazTur}" converter="omnifaces.SelectItemsConverter" required="true">
            <f:selectItem itemValue="#{null}" itemLabel="#{messages.seciniz}"/>
            <f:selectItems value="#{enumCihazTur.ALL_VALUES}"
                           var="cihazs"
                           itemLabel="#{cihazs.displayValue}"
                           itemValue="#{cihazs}"/>
        </p:selectOneMenu>

        <p:outputLabel value="#{messages.cihazLabel}" for="@next"/>
        <p:inputText value="#{ortCihazController.selected.tanim}" title="#{messages.projeAdiText}" required="true" size="50"
                     maxlength="250"/>

    </coco:createpage>

</ui:composition>

</html>
