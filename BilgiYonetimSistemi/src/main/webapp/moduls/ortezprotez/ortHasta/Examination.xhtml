<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces">
<ui:composition>

    <p:outputLabel value="#{messages.ameliyatOlduguHastaneLabel}" for="@next"/>
    <p:selectOneMenu value="#{ortHastaController.selected.ameliyatOlduguHastane}" filter="true" converter="omnifaces.SelectItemsConverter">
        <f:selectItem itemValue="#{null}" itemLabel="#{messages.seciniz}"/>
        <f:selectItems value="#{gnlHastaneController.items}"
                       var="hastanes"
                       itemLabel="#{hastanes.tanim}"
                       itemValue="#{hastanes}"/>
    </p:selectOneMenu>

    <p:outputLabel value="#{messages.ameliyatTarihiLabel}" for="@next"/>
    <p:datePicker id="ameliyatTarihi" locale="tr" pattern="#{messages.tarihFormat}" value="#{ortHastaController.selected.ameliyatTarihi}"
                  title="#{messages.ameliyatTarihiText}" mask="true" monthNavigator="true" yearNavigator="true" showButtonBar="true" showIcon="true"
                  showOnFocus="false"/>

    <p:outputLabel value="#{messages.depremeNeredeYakalandiLabel}" for="@next"/>
    <p:selectOneMenu value="#{ortHastaController.selected.depremeNeredeYakalandi}" filter="true"
                     converter="omnifaces.SelectItemsConverter">
        <f:selectItem itemValue="#{null}" itemLabel="#{messages.seciniz}"/>
        <f:selectItems value="#{gnlIlController.items}"
                       var="sehirs"
                       itemLabel="#{sehirs.tanim}"
                       itemValue="#{sehirs.tanim}"/>
    </p:selectOneMenu>

    <p:outputLabel value="#{messages.birinciDereceVefatDurumuLabel}" for="@next"/>
    <p:selectManyCheckbox  value="#{ortHastaController.yakinlikDerecesiList}"
                          converter="omnifaces.SelectItemsConverter" layout="responsive" columns="2">
        <f:selectItems value="#{enumYakinlikDerecesi.ALL_VALUES}"
                       var="yakinlikDerecesis"
                       itemValue="#{yakinlikDerecesis}"
                       itemLabel="#{yakinlikDerecesis.displayValue}"/>
    </p:selectManyCheckbox>

    <p:outputLabel value="#{messages.meslekLabel}" for="@next"/>
    <p:selectOneMenu value="#{ortHastaController.selected.gnlKisi.meslek}" filter="true" converter="omnifaces.SelectItemsConverter">
        <f:selectItem itemValue="#{null}" itemLabel="#{messages.seciniz}"/>
        <f:selectItems value="#{gnlMeslekController.items}"
                       var="mesleks"
                       itemLabel="#{mesleks.tanim}"
                       itemValue="#{mesleks.tanim}"/>
    </p:selectOneMenu>
</ui:composition>
</html>
