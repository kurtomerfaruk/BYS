<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces"
                xmlns:pt="jakarta.faces.passthrough"
                xmlns:coco="jakarta.faces.composite/ui">

    <h:form id="OrtMalzemeTalepListForm" styleClass="form-height">

        <coco:datatable id="datalist"
                        value="#{ortMalzemeTalepController.lazyItems}"
                        rowKey="#{item.id}"
                        selection="#{ortMalzemeTalepController.selected}"
                        filtered="#{ortMalzemeTalepController.filtered}"
                        rowselect=":OrtMalzemeTalepListForm:datalist:datalist:viewButton"
                        rowDblselect="document.getElementById('OrtMalzemeTalepListForm:datalist:datalist:viewButton').click()"
                        contextMenu=":OrtMalzemeTalepListForm:datalist:datalist:viewButton"
                        selectListener="#{ortMalzemeTalepController.resetParents}"
                        controller="#{ortMalzemeTalepController}"
                        header="Malzeme Onay Listesi">

            <p:ajax event="colResize" listener="#{ortMalzemeTalepController.onResize}"/>

            <f:facet name="paginatorBottomLeft">
                <p:commandButton id="viewButton" styleClass="ui-button-info" icon="pi pi-search" pt:data-tooltip="#{messages.buttonDetay}"
                                 update=":OrtMalzemeTalepOnayForm" oncomplete="PF('OrtMalzemeTalepOnayDialog').show()"
                                 disabled="#{empty ortMalzemeTalepController.selected}" onstart="PF('Loading').show()"
                                 onsuccess="PF('Loading').hide()"/>
            </f:facet>

        </coco:datatable>

        <ui:include src="/confirmation.xhtml"/>

    </h:form>

</ui:composition>
