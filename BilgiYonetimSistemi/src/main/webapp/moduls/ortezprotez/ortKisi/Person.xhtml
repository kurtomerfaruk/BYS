<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces"
      xmlns:coco="jakarta.faces.composite/ui">

<ui:composition>

    <h:outputText value="#{messages.eklemeYeriLabel}"/>
    <h:outputText value="#{ortKisiController.selected.gnlKisi.eklemeYeri.displayValue}"/>

    <p:outputLabel value="#{messages.kayitTarihiLabel}" for="@next"/>
    <p:datePicker id="kayitTarihi" locale="tr" pattern="#{messages.tarihFormat}"
                  value="#{ortKisiController.selected.gnlKisi.kayitTarihi}"
                  title="#{messages.kayitTarihiText}" mask="true"
                  monthNavigator="true" yearNavigator="true" showButtonBar="true"
                  showIcon="true" showOnFocus="false"/>

    <p:outputLabel value="#{messages.uyrukLabel}" for="@next"/>
    <p:selectOneMenu id="uyruk" value="#{ortKisiController.selected.gnlKisi.uyruk}"
                     required="true" converter="omnifaces.SelectItemsConverter">
        <f:selectItem itemLabel="#{messages.seciniz}" itemValue="#{null}"/>
        <f:selectItems value="#{enumUyruk.ALL_VALUES}"
                       var="uyruks"
                       itemLabel="#{uyruks.displayValue}"
                       itemValue="#{uyruks}"/>
    </p:selectOneMenu>


    <p:outputLabel value="#{messages.tcKimlikNoLabel}" for="@next"/>
    <coco:tcKimlikNoDogumTarihi actionListener="#{ortKisiController.getTcKimlik()}"
                                update=":growl,@(.tcUpdate)"
                                value="#{ortKisiController.selected.gnlKisi.tcKimlikNo}"
                                dateValue="#{ortKisiController.selected.gnlKisi.dogumTarihi}"/>

    <p:outputLabel value="#{messages.adLabel}" for="@next"/>
    <p:inputText id="ad" value="#{ortKisiController.selected.gnlKisi.ad}" size="50" title="#{messages.adText}" required="true"
                 readonly="#{facesContext.renderResponse}" styleClass="tcUpdate"/>

    <p:outputLabel value="#{messages.soyadLabel}" for="@next"/>
    <p:inputText id="soyad" value="#{ortKisiController.selected.gnlKisi.soyad}" title="#{messages.soyadText}" required="true"
                 readonly="#{facesContext.renderResponse}" styleClass="tcUpdate"/>

    <p:outputLabel value="#{messages.telefonLabel}" for="@next"/>
    <p:inputMask id="telefon" value="#{ortKisiController.selected.gnlKisi.telefon}" mask="#{messages.telefonFormat}" required="true"
                 title="#{messages.telefonText}" size="14" styleClass="tcUpdate"/>

    <p:outputLabel value="#{messages.telefonLabel}" for="@next"/>
    <p:inputMask id="telefon2" value="#{ortKisiController.selected.gnlKisi.telefon2}" mask="#{messages.telefonFormat}" title="#{messages.telefonText}"
                 size="14" styleClass="tcUpdate"/>

    <p:outputLabel value="#{messages.anaAdiLabel}" for="@next"/>
    <p:inputText id="anaAdi" value="#{ortKisiController.selected.gnlKisi.anaAdi}" title="#{messages.anaAdiLabel}" required="true"
                 styleClass="tcUpdate"/>

    <p:outputLabel value="#{messages.babaAdiLabel}" for="@next"/>
    <p:inputText id="babaAdi" value="#{ortKisiController.selected.gnlKisi.babaAdi}" title="#{messages.babaAdiLabel}" required="true"
                 styleClass="tcUpdate"/>

    <p:outputLabel value="#{messages.dogumYeriLabel}" for="@next"/>
    <p:inputText id="dogumYeri" value="#{ortKisiController.selected.gnlKisi.dogumYeri}" title="#{messages.dogumYeriText}" required="true"
                 styleClass="tcUpdate"/>

    <p:outputLabel value="#{messages.cinsiyetLabel}" for="@next"/>
    <p:inputText id="cinsiyet" value="#{ortKisiController.selected.gnlKisi.cinsiyet}" required="true" readonly="#{facesContext.renderResponse}"
                 styleClass="tcUpdate"/>

    <p:outputLabel value="#{messages.medeniDurumLabel}" for="@next"/>
    <p:inputText id="medeniDurum" value="#{ortKisiController.selected.gnlKisi.medeniDurum}" title="#{messages.medeniDurumText}" required="true"
                 readonly="#{facesContext.renderResponse}"
                 styleClass="tcUpdate"/>

    <p:outputLabel value="#{messages.egitimDurumuLabel}" for="@next"/>
    <p:selectOneMenu id="egitimDurumu" styleClass="tcUpdate"
                     value="#{ortKisiController.selected.gnlKisi.egitimDurumu}"
                     required="true" converter="omnifaces.SelectItemsConverter">
        <f:selectItem itemLabel="#{messages.seciniz}" itemValue="#{null}"/>
        <f:selectItems value="#{enumEgitimDurumu.ALL_VALUES}"
                       var="enumEgitimDurumus"
                       itemLabel="#{enumEgitimDurumus.displayValue}"
                       itemValue="#{enumEgitimDurumus}"/>
    </p:selectOneMenu>

    <p:outputLabel value="#{messages.sehirLabel}" for="@next"/>
    <p:selectOneMenu id="sehir" value="#{ortKisiController.selected.gnlKisi.gnlIl}" filter="true" converter="omnifaces.SelectItemsConverter"
                     disabled="#{!ortKisiController.sehirDisi}" styleClass="tcUpdate" required="true">
        <f:selectItem itemLabel="#{messages.seciniz}" itemValue="#{null}"/>
        <f:selectItems value="#{gnlIlController.items}"
                       var="sehirs"
                       itemValue="#{sehirs}"
                       itemLabel="#{sehirs.tanim}"/>
        <p:ajax event="change" update="ilce"/>
    </p:selectOneMenu>

    <p:outputLabel value="#{messages.ilceLabel}" for="@next"/>
    <p:selectOneMenu id="ilce" value="#{ortKisiController.selected.gnlKisi.gnlIlce}" filter="true" converter="omnifaces.SelectItemsConverter"
                     disabled="#{!ortKisiController.sehirDisi}" styleClass="tcUpdate" required="true">
        <f:selectItem itemLabel="#{messages.seciniz}" itemValue="#{null}"/>
        <f:selectItems value="#{gnlIlceController.getIlceByIlId(ortKisiController.selected.gnlKisi.gnlIl)}"
                       var="ilces"
                       itemLabel="#{ilces.tanim}"
                       itemValue="#{ilces}"/>
        <p:ajax event="change" update="mahalle"/>
    </p:selectOneMenu>

    <p:outputLabel value="#{messages.mahalleLabel}" for="@next"/>
    <p:selectOneMenu id="mahalle" value="#{ortKisiController.selected.gnlKisi.gnlMahalle}" filter="true" required="true"
                     converter="omnifaces.SelectItemsConverter" styleClass="tcUpdate" disabled="#{!ortKisiController.sehirDisi}">
        <f:selectItem itemValue="#{null}" itemLabel="#{messages.seciniz}"/>
        <f:selectItems value="#{gnlMahalleController.getMahalleByIlce(ortKisiController.selected.gnlKisi.gnlIlce)}"
                       var="mahalles"
                       itemLabel="#{mahalles.tanim}"
                       itemValue="#{mahalles}"/>
    </p:selectOneMenu>

    <p:outputLabel value="#{messages.adresLabel}" for="@next"/>
    <p:inputTextarea rows="4" id="adres" value="#{ortKisiController.selected.gnlKisi.adres}" title="#{messages.adresText}" styleClass="w-100 tcUpdate"
                     autoResize="false" readonly="#{!ortKisiController.sehirDisi}"/>

    <p:outputLabel value="#{messages.cocukSayisiLabel}" for="@next"/>
    <p:spinner id="cocukSayisi" value="#{ortKisiController.selected.gnlKisi.cocukSayisi}" title="#{messages.cocukSayisiText}" required="true"
               styleClass="tcUpdate" stepFactor="1"/>

    <p:outputLabel value="#{messages.ehliyetLabel}" for="@next"/>
    <h:panelGroup>
        <div class="ui-inputgroup">
            <div class="ui-inputgroup-addon">
                <p:selectBooleanCheckbox id="ehliyet"
                                         value="#{ortKisiController.selected.gnlKisi.ehliyet}">
                    <p:ajax event="change" update="ehliyetAciklama"
                            listener="#{ortKisiController.selected.gnlKisi.setEhliyetAciklama('')}"/>
                </p:selectBooleanCheckbox>
            </div>
            <p:inputText id="ehliyetAciklama"
                         value="#{ortKisiController.selected.gnlKisi.ehliyetAciklama}"
                         title="#{messages.ehliyetAciklamaText}"
                         required="#{ortKisiController.selected.gnlKisi.ehliyet}"
                         disabled="#{!ortKisiController.selected.gnlKisi.ehliyet}"/>
        </div>
    </h:panelGroup>

    <p:outputLabel value="#{messages.sabikaKaydiLabel}" for="@next"/>
    <h:panelGroup>
        <div class="ui-inputgroup">
            <div class="ui-inputgroup-addon">
                <p:selectBooleanCheckbox id="sabikaKaydi"
                                         value="#{ortKisiController.selected.gnlKisi.sabikaKaydi}">
                    <p:ajax event="change" update="sabikaKaydiAciklama"
                            listener="#{ortKisiController.selected.gnlKisi.setSabikaKaydiAciklama('')}"/>
                </p:selectBooleanCheckbox>
            </div>
            <p:inputText id="sabikaKaydiAciklama"
                         value="#{ortKisiController.selected.gnlKisi.sabikaKaydiAciklama}"
                         title="#{messages.sabikaKaydiAciklamaText}"
                         required="#{ortKisiController.selected.gnlKisi.sabikaKaydi}"
                         disabled="#{!ortKisiController.selected.gnlKisi.sabikaKaydi}"/>
        </div>
    </h:panelGroup>

    <p:outputLabel value="#{messages.iskurLabel}" for="@next"/>
    <p:selectBooleanCheckbox id="iskurKaydi" value="#{ortKisiController.selected.gnlKisi.iskurKaydi}"/>

</ui:composition>
</html>
