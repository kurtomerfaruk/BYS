<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces">

<ui:composition>

    <p:dialog id="OrtTalepViewDlg" widgetVar="OrtTalepViewDialog"
              header="#{messages.dialogKayitBilgisi}"
              modal="true" resizable="false" closeOnEscape="true" responsive="true"
              appendTo="@(body)" fitViewport="true" position="top" style="min-width: 1000px; max-width: 1100px;">

        <h:form id="OrtTalepViewForm">

            <!-- 1) ÖZET KARTI -->
            <div class="otd-card otd-pad">
                <div class="otd-summary">
                    <div class="otd-avatar">
                        <h:outputText value="#{ortTalepController.selected.ortKisi.gnlKisi.adSoyad.charAt(0)}"/>
                    </div>
                    <div class="otd-who">
                        <div class="name">
                            <h:outputText value="#{ortTalepController.selected.ortKisi.gnlKisi.adSoyad}"/>
                        </div>
                        <div class="meta">
                            <h:outputText value="#{messages.tcKimlikNoText}"/>:
                            <h:outputText value="#{ortTalepController.selected.ortKisi.gnlKisi.tcKimlikNo}"/>
                            &nbsp;·&nbsp;
                            <h:outputText value="#{ortTalepController.selected.ortKisi.gnlKisi.telefon}"/>
                            &nbsp;·&nbsp;
                            <h:outputText value="#{ortTalepController.selected.ortKisi.gnlKisi.gnlIlce.tanim}"/>
                        </div>
                    </div>
                    <span class="otd-pill blue">
                        <h:outputText value="#{ortTalepController.selected.talepTipi.displayValue}"/>
                    </span>
                    <span class="otd-pill big green">
                        <h:outputText value="#{ortTalepController.selected.durum.displayValue}"/>
                    </span>
                </div>

                <div class="otd-facts">
                    <div class="otd-fact">
                        <label>#{messages.talepNoLabel}</label>
                        <div><h:outputText value="#{ortTalepController.selected.talepNo}"/></div>
                    </div>
                    <div class="otd-fact">
                        <label>#{messages.talepTarihiLabel}</label>
                        <div><h:outputText value="#{ortTalepController.selected.talepTarihi}">
                            <f:convertDateTime pattern="#{messages.tarihSaatFormat}" type="localDateTime"/>
                        </h:outputText></div>
                    </div>
                    <div class="otd-fact">
                        <label>#{messages.teknikerLabel}</label>
                        <div><h:outputText value="#{ortTalepController.selected.teknikerOrtPersonel.gnlPersonel.gnlKisi.adSoyad}"/></div>
                    </div>
                    <div class="otd-fact">
                        <label>#{messages.fizyoterapistLabel}</label>
                        <div><h:outputText value="#{ortTalepController.selected.fizyoterapistOrtPersonel.gnlPersonel.gnlKisi.adSoyad}"/></div>
                    </div>
                    <div class="otd-fact">
                        <label>#{messages.projeLabel}</label>
                        <div><h:outputText value="#{ortTalepController.selected.ortProje.tanim}"/></div>
                    </div>
                    <div class="otd-fact">
                        <label>#{messages.sutKoduLabel}</label>
                        <div><h:outputText value="#{ortTalepController.selected.ortSutKodu.kod}"/></div>
                    </div>
                </div>
            </div>

            <!-- 2) STEPPER: 10 ana aşama -->
            <div class="otd-card otd-pad">
                <div class="otd-steps">
                    <ui:repeat value="#{ortTalepController.processStages}" var="stage">
                        <div class="otd-step #{stage.cssClass}">
                            <div class="dot">
                                <h:outputText value="#{stage.sira}" rendered="#{stage.cssClass == 'current'}"/>
                                <h:outputText value="✓" rendered="#{stage.cssClass == 'done'}"/>
                            </div>
                            <div class="lbl">
                                <h:outputText value="#{stage.ad}"/>
                                <small><h:outputText value="#{stage.detay}"/></small>
                            </div>
                        </div>
                    </ui:repeat>
                </div>
            </div>

            <!-- 3) SIRADAKİ İŞLEM -->
            <ui:fragment rendered="#{ortTalepController.primaryAction != null}">
                <div class="otd-card otd-pad otd-next">
                    <div class="ic"><i class="pi pi-arrow-right"/></div>
                    <div class="txt">
                        <h3>
                            <h:outputText value="#{messages.siradakiIslemLabel}"/>
                            <h:outputText value="#{ortTalepController.primaryAction.displayValue}"/>
                        </h3>
                        <p><h:outputText value="#{ortTalepController.pendingAction}"/></p>
                        <!-- Ödeme adımında ödeme kaydı -->
                        <h:panelGroup rendered="#{ortTalepController.primaryAction == enumOrtTalepIslem.ODEME_AL}">
                            <table style="width:100%;margin-top:10px;font-size:13px;">
                                <tr>
                                    <td style="padding:4px 8px 4px 0;width:100px;">
                                        <h:outputText value="#{messages.tutarLabel}"/>
                                    </td>
                                    <td style="padding:4px 0;">
                                        <p:inputText value="#{ortTalepBelgeController.odemeTutar}" style="width:100%;"/>
                                    </td>
                                    <td style="padding:4px 8px 4px 16px;width:100px;">
                                        <h:outputText value="#{messages.odemeSekliLabel}"/>
                                    </td>
                                    <td style="padding:4px 0;">
                                        <p:inputText value="#{ortTalepBelgeController.odemeSekli}" style="width:100%;"/>
                                    </td>
                                    <td style="padding:4px 8px 4px 16px;width:100px;">
                                        <h:outputText value="#{messages.dekontNoLabel}"/>
                                    </td>
                                    <td style="padding:4px 0;">
                                        <p:inputText value="#{ortTalepBelgeController.dekontNo}" style="width:100%;"/>
                                    </td>
                                    <td style="padding:4px 0 4px 12px;">
                                        <p:commandButton value="#{messages.buttonKaydet}" icon="pi pi-save"
                                                         styleClass="ui-button-success"
                                                         actionListener="#{ortTalepBelgeController.saveOdeme}"
                                                         process="@form" update="@form,:growl"/>
                                    </td>
                                </tr>
                            </table>
                        </h:panelGroup>

                        <!-- Personel ataması adımında tekniker/fizyoterapist seçimi -->
                        <h:panelGroup rendered="#{ortTalepController.primaryAction == enumOrtTalepIslem.PERSONEL_ATA}">
                            <table style="width:100%;margin-top:10px;font-size:13px;">
                                <tr>
                                    <td style="padding:4px 8px 4px 0;width:140px;">
                                        <h:outputText value="#{messages.teknikerLabel}"/>
                                    </td>
                                    <td style="padding:4px 0;">
                                        <p:selectOneMenu value="#{ortTalepController.selected.teknikerOrtPersonel}"
                                                         filter="true" style="width:100%;"
                                                         converter="omnifaces.SelectItemsConverter">
                                            <f:selectItem itemLabel="#{messages.seciniz}" itemValue="#{null}"/>
                                            <f:selectItems value="#{ortPersonelController.items}" var="p"
                                                           itemLabel="#{p.gnlPersonel.gnlKisi.adSoyad}" itemValue="#{p}"/>
                                        </p:selectOneMenu>
                                    </td>
                                    <td style="padding:4px 8px 4px 16px;width:140px;">
                                        <h:outputText value="#{messages.fizyoterapistLabel}"/>
                                    </td>
                                    <td style="padding:4px 0;">
                                        <p:selectOneMenu value="#{ortTalepController.selected.fizyoterapistOrtPersonel}"
                                                         filter="true" style="width:100%;"
                                                         converter="omnifaces.SelectItemsConverter">
                                            <f:selectItem itemLabel="#{messages.seciniz}" itemValue="#{null}"/>
                                            <f:selectItems value="#{ortPersonelController.items}" var="p"
                                                           itemLabel="#{p.gnlPersonel.gnlKisi.adSoyad}" itemValue="#{p}"/>
                                        </p:selectOneMenu>
                                    </td>
                                </tr>
                            </table>
                        </h:panelGroup>

                        <!-- Ölçü formları adımında SUT kodu seçimi -->
                        <h:panelGroup rendered="#{ortTalepController.primaryAction == enumOrtTalepIslem.FORMLARI_TAMAMLA}">
                            <table style="width:100%;margin-top:10px;font-size:13px;">
                                <tr>
                                    <td style="padding:4px 8px 4px 0;width:100px;">
                                        <h:outputText value="#{messages.sutKoduLabel}"/>
                                    </td>
                                    <td style="padding:4px 0;">
                                        <p:selectOneMenu value="#{ortTalepController.selected.ortSutKodu}" filter="true"
                                                         style="width:100%;" converter="omnifaces.SelectItemsConverter">
                                            <f:selectItem itemLabel="#{messages.seciniz}" itemValue="#{null}"/>
                                            <f:selectItems value="#{ortSutKoduController.items}" var="sut"
                                                           itemLabel="#{sut.kod} - #{sut.tanim}" itemValue="#{sut}"/>
                                        </p:selectOneMenu>
                                    </td>
                                </tr>
                            </table>
                        </h:panelGroup>

                        <!-- Malzeme talebi adımında kalem ekleme -->

                        <h:panelGroup rendered="#{ortTalepController.primaryAction == enumOrtTalepIslem.MALZEME_TALEP_ET}">
                            <div style="margin-top:12px;padding:12px;border:1px dashed #cbd5e1;border-radius:10px;background:#f8fafc;">
                                <strong style="font-size:13px;">#{messages.malzemeTalepKalemleriText}</strong>
                                <div class="row g-2 mt-2 align-items-end">
                                    <div class="col-md-4">
                                        <label style="font-size:11px;color:#94a3b8;">#{messages.malzemeLabel}</label>
                                        <p:selectOneMenu value="#{ortMalzemeTalepController.seciliStok}" filter="true" filterMatchMode="contains"
                                                         style="width:100%;" converter="omnifaces.SelectItemsConverter">
                                            <f:selectItem itemLabel="#{messages.seciniz}" itemValue="#{null}"/>
                                            <f:selectItems value="#{stStokController.items}" var="st"
                                                           itemLabel="#{st.stokKodu} - #{st.stokAdi}" itemValue="#{st}"/>
                                        </p:selectOneMenu>
                                    </div>
                                    <div class="col-md-3">
                                        <label style="font-size:11px;color:#94a3b8;">#{messages.depoLabel}</label>
                                        <p:selectOneMenu value="#{ortMalzemeTalepController.seciliDepo}" filter="true"
                                                         style="width:100%;" converter="omnifaces.SelectItemsConverter">
                                            <f:selectItem itemLabel="#{messages.seciniz}" itemValue="#{null}"/>
                                            <f:selectItems value="#{stDepoController.items}" var="depo"
                                                           itemLabel="#{depo.ad}" itemValue="#{depo}"/>
                                        </p:selectOneMenu>
                                    </div>
                                    <div class="col-md-2">
                                        <label style="font-size:11px;color:#94a3b8;">#{messages.miktarText}</label>
                                        <p:inputText value="#{ortMalzemeTalepController.miktar}" style="width:100%;"/>
                                    </div>
                                    <div class="col-md-3">
                                        <p:commandButton value="#{messages.buttonEkle}" icon="pi pi-plus"
                                                         styleClass="ui-button-secondary"
                                                         actionListener="#{ortMalzemeTalepController.addItem()}"
                                                         process="@form" update="@form,:growl"/>
                                    </div>
                                </div>
                                <p:dataTable value="#{ortMalzemeTalepController.yeniKalemler}" var="kalem"
                                             emptyMessage="#{messages.kayitBulunamadi}" styleClass="w-100 mt-2" size="small">
                                    <p:column headerText="#{messages.malzemeLabel}">
                                        <h:outputText value="#{kalem.stStok.stokAdi}"/>
                                    </p:column>
                                    <p:column headerText="#{messages.depoLabel}">
                                        <h:outputText value="#{kalem.stDepo.ad}"/>
                                    </p:column>
                                    <p:column headerText="#{messages.miktarText}">
                                        <h:outputText value="#{kalem.istenenMiktar}"/>
                                    </p:column>
                                    <p:column style="width:50px;">
                                        <p:commandButton icon="pi pi-trash" styleClass="ui-button-danger"
                                                         actionListener="#{ortMalzemeTalepController.removeItem(kalem)}"
                                                         process="@this" update="@form"/>
                                    </p:column>
                                </p:dataTable>
                                <div class="mt-2">
                                    <label style="font-size:11px;color:#94a3b8;">#{messages.aciklamaLabel}</label>
                                    <p:inputText value="#{ortMalzemeTalepController.talepAciklama}" style="width:100%;"/>
                                    <p:commandButton value="#{messages.buttonMalzemeTalepOlustur}" icon="pi pi-save"
                                                     styleClass="ui-button-primary"
                                                     actionListener="#{ortMalzemeTalepController.createRequest}"
                                                     process="@form" update="@form,:growl"/>
                                </div>
                            </div>
                        </h:panelGroup>

                        <!-- Belge gerektiren adımlarda (ölçü formu, rapor, reçete, sözleşme, dekont, tutanak) doğrudan yükleme -->
                        <h:panelGroup rendered="#{ortTalepBelgeController.requiredBelgeTuru != null}">
                            <div style="margin-top:12px;padding:12px;border:1px dashed #cbd5e1;border-radius:10px;background:#f8fafc;">
                                <div class="d-flex align-items-center gap-2 mb-2">
                                    <i class="pi pi-paperclip" style="color:#4361ee;"/>
                                    <strong style="font-size:13px;">
                                        <h:outputText value="#{ortTalepBelgeController.requiredBelgeTuru.displayValue}"/>
                                    </strong>
                                    <ui:fragment rendered="#{ortTalepBelgeController.requiredBelgeYuklendi}">
                                        <span class="otd-pill green" style="font-size:11px;">
                                            <h:outputText value="#{messages.yuklendiText}"/>
                                        </span>
                                    </ui:fragment>
                                </div>
                                <p:fileUpload listener="#{ortTalepBelgeController.uploadRequired}"
                                              mode="advanced" auto="true" multiple="false"
                                              dragDropSupport="false"
                                              uploadLabel="#{messages.buttonYukle}"
                                              cancelLabel="#{messages.buttonIptal}"
                                              label="#{messages.buttonSec}"
                                              invalidFileMessage="#{messages.hataliDosyaTipi}"
                                              invalidSizeMessage="#{messages.hataliDosyaBoyutu}"
                                              update="@form,:growl"
                                              allowTypes="/(\.|\/)(pdf|jpe?g|png|doc|docx|xls|xlsx)$/">
                                    <p:validateFile sizeLimit="10000000"/>
                                </p:fileUpload>
                            </div>
                        </h:panelGroup>
                        <p:inputTextarea styleClass="otd-note"
                                         value="#{ortTalepController.transitionDescription}"
                                         placeholder="#{messages.islemAciklamaIpucuText}"
                                         rows="2" autoResize="false"/>
                        <div class="otd-more">
                            <h:outputText value="#{messages.digerIslemlerLabel}"/>
                            <ui:repeat value="#{ortTalepController.secondaryActions}" var="action">
                                <p:commandLink value="#{action.displayValue}"
                                               actionListener="#{ortTalepController.applyTransition(action)}"
                                               process="@form" update="@form,:growl"
                                               style="margin-right: 10px;"/>
                            </ui:repeat>
                        </div>
                    </div>
                    <p:commandButton value="#{ortTalepController.primaryAction.displayValue}"
                                     icon="#{ortTalepController.primaryAction.icon}"
                                     styleClass="ui-button-primary"
                                     actionListener="#{ortTalepController.applyTransition(ortTalepController.primaryAction)}"
                                     process="@form" update="@form,:growl"
                                     onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"/>
                </div>
            </ui:fragment>

            <ui:fragment rendered="#{ortTalepController.primaryAction == null}">
                <div class="otd-card otd-pad">
                    <div class="otd-next" style="border-color:#dcfce7;background:linear-gradient(100deg,#ecfdf5,#f8fafc)">
                        <div class="ic" style="background:#16a34a"><i class="pi pi-check"/></div>
                        <div class="txt">
                            <h3><h:outputText value="#{messages.surecTamamlandiLabel}"/></h3>
                            <p><h:outputText value="#{ortTalepController.pendingAction}"/></p>
                        </div>
                    </div>
                </div>
            </ui:fragment>

            <!-- 4) SEKMELİ İÇERİK -->
            <div class="otd-card">
                <div class="otd-tabs">
                    <button type="button" class="otd-tab active" onclick="otdTab('genel',this)">
                        <h:outputText value="#{messages.genelBilgilerLabel}"/>
                    </button>
                    <button type="button" class="otd-tab" onclick="otdTab('randevu',this)">
                        <h:outputText value="#{messages.randevuListesi}"/>
                        <span class="cnt"><h:outputText value="#{ortTalepController.appointmentCount}"/></span>
                    </button>
                    <button type="button" class="otd-tab" onclick="otdTab('belge',this)">
                        <h:outputText value="#{messages.belgelerLabel}"/>
                        <span class="cnt">0</span>
                    </button>
                    <button type="button" class="otd-tab" onclick="otdTab('malzeme',this)">
                        <h:outputText value="#{messages.malzemeText}"/>
                    </button>
                    <button type="button" class="otd-tab" onclick="otdTab('gecmis',this)">
                        <h:outputText value="#{messages.islemGecmisiLabel}"/>
                    </button>
                </div>

                <div class="otd-pane active" id="otd-genel">
                    <div class="otd-kv">
                        <div><label>#{messages.talepTipiLabel}</label>
                            <div><h:outputText value="#{ortTalepController.selected.talepTipi.displayValue}"/></div>
                        </div>
                        <div><label>#{messages.teknikerLabel}</label>
                            <div><h:outputText value="#{ortTalepController.selected.teknikerOrtPersonel.gnlPersonel.gnlKisi.adSoyad}"/></div>
                        </div>
                        <div><label>#{messages.fizyoterapistLabel}</label>
                            <div><h:outputText value="#{ortTalepController.selected.fizyoterapistOrtPersonel.gnlPersonel.gnlKisi.adSoyad}"/></div>
                        </div>
                        <div><label>#{messages.projeLabel}</label>
                            <div><h:outputText value="#{ortTalepController.selected.ortProje.tanim}"/></div>
                        </div>
                        <div><label>#{messages.sutKoduLabel}</label>
                            <div><h:outputText value="#{ortTalepController.selected.ortSutKodu.tanim}"/></div>
                        </div>
                        <div><label>#{messages.aciklamaLabel}</label>
                            <div><h:outputText value="#{ortTalepController.selected.aciklama}"/></div>
                        </div>
                    </div>
                </div>

                <div class="otd-pane" id="otd-randevu">
                    <div class="d-flex flex-wrap gap-2 mb-3">
                        <ui:repeat value="#{enumRandevuTuru.ALL_VALUES}" var="tur">
                            <p:commandButton value="#{tur.displayValue}" icon="pi pi-calendar-plus"
                                             styleClass="ui-button-secondary"
                                             actionListener="#{ortRandevuController.prepareCreateForTalep(ortTalepController.selected)}"
                                             update=":OrtRandevuCreateForm"
                                             oncomplete="PF('OrtRandevuCreateDialog').show()"
                                             rendered="#{syKullaniciController.hasPermission('ortrandevu:ekle')}"/>
                        </ui:repeat>
                    </div>
                    <p:dataTable value="#{ortRandevuController.getTalepRandevulari(ortTalepController.selected)}"
                                 var="randevu" emptyMessage="#{messages.kayitBulunamadi}"
                                 styleClass="w-100" size="small">
                        <p:column headerText="#{messages.randevuTuruText}">
                            <h:outputText value="#{randevu.randevuTuru.displayValue}"/>
                        </p:column>
                        <p:column headerText="#{messages.randevuTarihiText}">
                            <h:outputText value="#{randevu.randevuTarihi}">
                                <f:convertDateTime pattern="#{messages.tarihSaatFormat}" type="localDateTime"/>
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{messages.sorumluPersonelText}">
                            <h:outputText value="#{randevu.ortPersonel.gnlPersonel.gnlKisi.adSoyad}"/>
                        </p:column>
                        <p:column headerText="#{messages.durumText}">
                            <span class="otd-pill #{randevu.durum == enumRandevuDurumu.GELDI or randevu.durum == enumRandevuDurumu.TAMAMLANDI ? 'green' : (randevu.durum == enumRandevuDurumu.GELMEDI or randevu.durum == enumRandevuDurumu.IPTAL_EDILDI ? 'red' : 'gray')}">
                                <h:outputText value="#{randevu.durum.displayValue}"/>
                            </span>
                        </p:column>
                        <p:column headerText="#{messages.sonucText}">
                            <h:outputText value="#{randevu.sonuc}"/>
                        </p:column>
                        <p:column headerText="#{messages.islemTarihiText}" style="width: 200px;">
                            <p:commandButton value="Geldi" icon="pi pi-check" styleClass="ui-button-success"
                                             actionListener="#{ortRandevuController.markAttended(randevu)}"
                                             process="@this" update="@form,:growl"
                                             rendered="#{randevu.durum == enumRandevuDurumu.PLANLANDI and syKullaniciController.hasPermission('ortrandevu:guncelle')}"/>
                            <p:commandButton value="Tamamla" icon="pi pi-check-circle" styleClass="ui-button-primary"
                                             actionListener="#{ortRandevuController.markCompleted(randevu)}"
                                             process="@this" update="@form,:growl"
                                             rendered="#{randevu.durum == enumRandevuDurumu.GELDI and syKullaniciController.hasPermission('ortrandevu:guncelle')}"/>
                        </p:column>
                    </p:dataTable>
                </div>

                <div class="otd-pane" id="otd-belge">
                    <div class="row g-2 mb-3 align-items-end">

                        <div class="col-md-4">
                            <label style="font-size:11px;color:#94a3b8;">Belge Türü</label>
                            <p:selectOneMenu value="#{ortTalepBelgeController.seciliBelgeTuru}" style="width:100%;"
                                             converter="omnifaces.SelectItemsConverter">
                                <f:selectItem itemLabel="#{messages.seciniz}" itemValue="#{null}"/>
                                <f:selectItems value="#{enumOrtBelgeTuru.ALL_VALUES}" var="tur"
                                               itemLabel="#{tur.displayValue}" itemValue="#{tur}"/>
                            </p:selectOneMenu>
                        </div>
                        <div class="col-md-4">
                            <label style="font-size:11px;color:#94a3b8;">#{messages.aciklamaLabel}</label>
                            <p:inputText value="#{ortTalepBelgeController.belgeAciklama}" style="width:100%;"/>
                        </div>
                        <div class="col-md-4">
                            <p:fileUpload listener="#{ortTalepBelgeController.upload}"
                                          mode="advanced" auto="true" multiple="false"
                                          update="@form,:growl"
                                          label="#{messages.buttonEkle}"
                                          styleClass="ui-button-secondary"/>
                        </div>
                    </div>
                    <p:dataTable id="belgeDatalist" value="#{ortTalepBelgeController.belgeler}" var="belge"
                                 emptyMessage="#{messages.kayitBulunamadi}" styleClass="w-100" size="small">
                        <p:column headerText="#{messages.belgeTuruText}">
                            <h:outputText value="#{belge.belgeTuru.displayValue}"/>
                        </p:column>
                        <p:column headerText="#{messages.dosyaAdiText}">
                            <h:outputText value="#{belge.dosyaAdi}"/>
                        </p:column>
                        <p:column headerText="#{messages.tarihText}">
                            <h:outputText value="#{belge.yuklenmeTarihi}">
                                <f:convertDateTime pattern="#{messages.tarihSaatFormat}" type="localDateTime"/>
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{messages.dosyaBoyutuText}">
                            <h:outputText value="#{belge.dosyaBoyutu}"/>
                        </p:column>
                        <p:column headerText="#{messages.aciklamaText}">
                            <h:outputText value="#{belge.aciklama}"/>
                        </p:column>
                        <p:column headerText="#{messages.islemTarihiText}" style="width:150px;">
                            <p:commandButton icon="pi pi-download" title="#{messages.buttonIndir}" styleClass="ui-button-info"
                                             actionListener="#{ortTalepBelgeController.selectForDownload(belge)}"
                                             ajax="false">
                                <p:fileDownload value="#{ortTalepBelgeController.download}"/>
                            </p:commandButton>
                            <p:commandButton icon="pi pi-trash" title="#{messages.buttonSil}" styleClass="ui-button-danger"
                                             actionListener="#{ortTalepBelgeController.removeBelge(belge)}"
                                             process="@this" update="@form,:growl">
                                <p:confirm header="#{messages.ConfirmationHeader}"
                                           message="#{messages.ConfirmDeleteMessage}" icon="pi pi-exclamation-triangle"/>
                            </p:commandButton>
                        </p:column>
                    </p:dataTable>
                    <!-- Ödeme kayıtları -->
                    <h:outputText value="#{messages.odemeListesi}" style="display:block;margin-top:18px;font-weight:600;"/>
                    <p:dataTable value="#{ortTalepBelgeController.odemeler}" var="odeme"
                                 emptyMessage="#{messages.kayitBulunamadi}" styleClass="w-100" size="small">
                        <p:column headerText="#{messages.tarihText}">
                            <h:outputText value="#{odeme.odemeTarihi}">
                                <f:convertDateTime pattern="#{messages.tarihSaatFormat}" type="localDateTime"/>
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{messages.tutarLabel}">
                            <h:outputText value="#{odeme.tutar}">
                                <f:convertNumber type="currency" currencySymbol="₺"/>
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{messages.odemeSekliLabel}">
                            <h:outputText value="#{odeme.odemeSekli}"/>
                        </p:column>
                        <p:column headerText="#{messages.dekontNoLabel}">
                            <h:outputText value="#{odeme.dekontNo}"/>
                        </p:column>
                    </p:dataTable>
                </div>
                <div class="otd-pane" id="otd-malzeme">
                    <p:dataTable value="#{ortMalzemeTalepController.talepler}" var="mt"
                                 emptyMessage="#{messages.kayitBulunamadi}" styleClass="w-100" size="small">
                        <p:column headerText="#{messages.tarihText}">
                            <h:outputText value="#{mt.talepTarihi}">
                                <f:convertDateTime pattern="#{messages.tarihSaatFormat}" type="localDateTime"/>
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{messages.durumText}">
                            <span class="otd-pill #{mt.durum == enumOrtMalzemeDurumu.ONAYLANDI ? 'green' : (mt.durum == enumOrtMalzemeDurumu.REDDEDILDI ? 'red' : 'gray')}">
                                <h:outputText value="#{mt.durum.displayValue}"/>
                            </span>
                        </p:column>
                        <p:column headerText="#{messages.malzemeTalepKalemleriText}">
                            <p:commandLink value="#{messages.detayText}"
                                           actionListener="#{ortMalzemeTalepController.showDetails(mt)}"
                                           update=":OrtTalepViewForm:malzemeDetayPanel"
                                           oncomplete="PF('malzemeDetayDialog').show()"/>
                        </p:column>
                        <p:column headerText="#{messages.aciklamaText}">
                            <h:outputText value="#{mt.aciklama}"/>
                        </p:column>
                    </p:dataTable>

                    <h:panelGroup id="malzemeDetayPanel">
                        <p:dataTable value="#{ortMalzemeTalepController.seciliDetaylar}" var="d"
                                     emptyMessage="#{messages.kayitBulunamadi}" styleClass="w-100 mt-3" size="small"
                                     rendered="#{not empty ortMalzemeTalepController.seciliDetaylar}">
                            <p:column headerText="#{messages.malzemeText}">
                                <h:outputText value="#{d.stStok.stokAdi}"/>
                            </p:column>
                            <p:column headerText="#{messages.depoText}">
                                <h:outputText value="#{d.stDepo.ad}"/>
                            </p:column>
                            <p:column headerText="#{messages.miktarText}">
                                <h:outputText value="#{d.istenenMiktar}"/>
                            </p:column>
                            <p:column headerText="#{messages.onaylananMiktarText}">
                                <h:outputText value="#{d.onaylananMiktar}"/>
                            </p:column>
                        </p:dataTable>
                    </h:panelGroup>
                </div>
                <div class="otd-pane" id="otd-gecmis">
                    <div class="otd-timeline">
                        <ui:repeat value="#{ortTalepController.statusHistory}" var="gecmis">
                            <div class="otd-event">
                                <div class="eh">
                                    <span class="et"><h:outputText value="#{gecmis.yeniDurum.displayValue}"/></span>
                                    <span class="ed"><h:outputText value="#{gecmis.islemTarihi}">
                                        <f:convertDateTime pattern="#{messages.tarihSaatFormat}" type="localDateTime"/>
                                    </h:outputText></span>
                                </div>
                                <div class="eb"><h:outputText value="#{gecmis.aciklama}"/></div>
                                <div class="eu">
                                    <h:outputText value="#{messages.islemiYapanLabel}"/>:
                                    <h:outputText value="#{gecmis.islemiYapanSyKullanici.gnlPersonel.gnlKisi.adSoyad}"/>
                                </div>
                            </div>
                        </ui:repeat>
                    </div>
                </div>
            </div>

            <p:remoteCommand name="loadOtdBelgeler" actionListener="#{ortTalepBelgeController.loadForTalep()}"
                             update="otd-belge,belgeDatalist" process="@this"/>
            <p:remoteCommand name="loadOtdMalzeme" actionListener="#{ortMalzemeTalepController.loadForRequest()}"
                             process="@this"/>

            <div class="d-flex justify-content-end">
                <p:commandButton icon="pi pi-times" styleClass="ui-button-danger"
                                 value="#{messages.buttonKapat}"
                                 onclick="PF('OrtTalepViewDialog').hide()" immediate="true"/>
            </div>

        </h:form>
    </p:dialog>

    <script type="text/javascript">
        function otdTab(id, btn) {
            document.querySelectorAll('.otd-pane').forEach(function (p) {
                p.classList.remove('active');
            });
            document.querySelectorAll('.otd-tab').forEach(function (t) {
                t.classList.remove('active');
            });
            var pane = document.getElementById('otd-' + id);
            if (pane) {
                pane.classList.add('active');
            }
            if (btn) {
                btn.classList.add('active');
            }
            if (id === 'belge' &amp;&amp; typeof loadOtdBelgeler === 'function') {
                loadOtdBelgeler();
            }
            if (id === 'malzeme' &amp;&amp; typeof loadOtdMalzeme === 'function') {
                loadOtdMalzeme();
            }
        }
    </script>

</ui:composition>

</html>
