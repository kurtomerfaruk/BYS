<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces"
                xmlns:pt="jakarta.faces.passthrough"
                xmlns:coco="jakarta.faces.composite/ui">

    <h:form id="OrtTalepListForm" styleClass="form-height">

        <p:contextMenu id="OrtTalepDataTableContextMenu" for="datalist:datalist">
            <p:menuitem value="#{messages.buttonEkle}"
                        onclick="document.getElementById('OrtTalepListForm:datalist:datalist:createButton').click();"
                        icon="pi pi-plus" rendered="#{syKullaniciController.hasPermission('orttalep:ekle')}"/>
            <p:menuitem value="#{messages.buttonGuncelle}"
                        onclick="document.getElementById('OrtTalepListForm:datalist:datalist:editButton').click();"
                        icon="pi pi-pencil" rendered="#{syKullaniciController.hasPermission('orttalep:guncelle')}"/>
            <p:menuitem value="#{messages.buttonDetay}"
                        onclick="document.getElementById('OrtTalepListForm:datalist:datalist:viewButton').click();"
                        icon="pi pi-search"/>
            <p:menuitem value="#{messages.buttonSil}"
                        onclick="document.getElementById('OrtTalepListForm:datalist:datalist:deleteButton').click();"
                        icon="pi pi-trash" rendered="#{syKullaniciController.hasPermission('orttalep:sil')}"/>
        </p:contextMenu>

        <coco:datatable id="datalist"
                        value="#{ortTalepController.lazyItems}"
                        rowKey="#{item.id}"
                        selection="#{ortTalepController.selected}"
                        filtered="#{ortTalepController.filtered}"
                        rowselect=":OrtTalepListForm:datalist:datalist:createButton,:OrtTalepListForm:datalist:datalist:viewButton,:OrtTalepListForm:datalist:datalist:editButton,:OrtTalepListForm:datalist:datalist:deleteButton"
                        rowDblselect="document.getElementById('OrtTalepListForm:datalist:datalist:editButton').click()"
                        contextMenu=":OrtTalepListForm:datalist:datalist:createButton :OrtTalepListForm:datalist:datalist:viewButton :OrtTalepListForm:datalist:datalist:editButton :OrtTalepListForm:datalist:datalist:deleteButton"
                        selectListener="#{ortTalepController.resetParents}"
                        controller="#{ortTalepController}"
                        header="#{messages.talepListesi}">

            <p:ajax event="colResize" listener="#{ortTalepController.onResize}"/>

            <f:facet name="paginatorBottomLeft">
                <p:commandButton id="createButton" styleClass="ui-button-primary" icon="pi pi-plus"
                                 pt:data-tooltip="#{messages.buttonEkle}"
                                 actionListener="#{ortTalepController.prepareCreate}"
                                 update=":OrtTalepCreateForm:OrtTalepCreateForm"
                                 oncomplete="PF('OrtTalepCreateDialog').show()" onstart="PF('Loading').show()"
                                 onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('orttalep:ekle')}"/>
                <p:commandButton id="editButton" styleClass="ui-button-success" icon="pi pi-pencil"
                                 pt:data-tooltip="#{messages.buttonGuncelle}"
                                 actionListener="#{ortTalepController.readInfo()}"
                                 update=":OrtTalepEditForm:OrtTalepEditForm" oncomplete="PF('OrtTalepEditDialog').show()"
                                 disabled="#{empty ortTalepController.selected}" onstart="PF('Loading').show()"
                                 onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('orttalep:guncelle')}"/>
                <p:commandButton id="viewButton" styleClass="ui-button-info" icon="pi pi-search"
                                 pt:data-tooltip="#{messages.buttonDetay}"
                                 actionListener="#{ortTalepController.readInfo()}"
                                 update=":OrtTalepViewForm:OrtTalepViewForm"
                                 oncomplete="PF('OrtTalepViewDialog').show()"
                                 disabled="#{empty ortTalepController.selected}" onstart="PF('Loading').show()"
                                 onsuccess="PF('Loading').hide()"/>
                <p:commandButton id="deleteButton" styleClass="ui-button-danger" icon="pi pi-trash"
                                 pt:data-tooltip="#{messages.buttonSil}" actionListener="#{ortTalepController.delete}"
                                 update=":growl,datalist" disabled="#{empty ortTalepController.selected}"
                                 rendered="#{syKullaniciController.hasPermission('orttalep:sil')}">
                    <p:confirm header="#{messages.ConfirmationHeader}" message="#{messages.ConfirmDeleteMessage}"
                               icon="pi pi-warning"/>
                </p:commandButton>
            </f:facet>

        </coco:datatable>

        <ui:include src="/confirmation.xhtml"/>

    </h:form>

</ui:composition>
