<ui:composition>

    <coco:createpage id="OrtTalepCreateForm"
                     renderedListener="#{ortTalepController.selected != null}"
                     widgetVar="OrtTalepCreateDialog"
                     actionListener="#{ortTalepController.saveNew}"
                     listForm="OrtTalepListForm">

        <p:outputLabel value="#{messages.kisiLabel}" for="@next"/>
        <coco:inputWithButton id="inputWithButtonOrtKisi" inputId="ortKisiId"
                              inputValue="#{ortTalepController.selected.ortKisi.gnlKisi.tcKimlikNo}"
                              inputTitle="#{messages.tcKimlikNoText}"
                              actionListener="#{bysController.openCommonDialog('ortKisiSec')}"
                              ajaxListener="#{ortTalepController.selectOrtKisi}"
                              buttonTitle="#{messages.kisiSecmelisiniz}"
                              size="50"
                              dialogId="OrtTalepCreateDialogId"/>

        <p:outputLabel value="#{messages.adSoyadLabel}" for="@next"/>
        <p:inputText id="adSoyad" value="#{ortTalepController.selected.ortKisi.gnlKisi.adSoyad}"
                     title="#{messages.adSoyadText}" readonly="true" styleClass="inputUpdate"/>

        <p:outputLabel value="#{messages.talepTarihiLabel}" for="@next"/>
        <p:datePicker id="talepTarihi" locale="tr" pattern="#{messages.tarihSaatFormat}"
                      value="#{ortTalepController.selected.talepTarihi}" title="#{messages.talepTarihiText}"
                      mask="true" monthNavigator="true" yearNavigator="true" showButtonBar="true"
                      showIcon="true" showOnFocus="false"/>

        <p:outputLabel value="#{messages.talepTipiLabel}" for="@next"/>
        <p:selectOneMenu id="talepTipi" value="#{ortTalepController.selected.talepTipi}"
                         required="true" converter="omnifaces.SelectItemsConverter">
            <f:selectItem itemLabel="#{messages.seciniz}" itemValue="#{null}"/>
            <f:selectItems value="#{enumOrtTalepTipi.ALL_VALUES}"
                           var="talepTipi"
                           itemLabel="#{talepTipi.displayValue}"
                           itemValue="#{talepTipi}"/>
        </p:selectOneMenu>

        <p:outputLabel value="#{messages.durumLabel}" for="@next"/>
        <p:inputText id="durum" value="#{ortTalepController.selected.durum.displayValue}" readonly="true"/>

        <!--                           itemValue="#{personel}"/>-->
        <!--        </p:selectOneMenu>-->

        <!--        <p:outputLabel value="#{messages.fizyoterapistLabel}" for="@next"/>-->
        <!--        <p:selectOneMenu id="fizyoterapist" value="#{ortTalepController.selected.fizyoterapistOrtPersonel}" filter="true"-->
        <!--                         converter="omnifaces.SelectItemsConverter">-->
        <!--            <f:selectItem itemLabel="#{messages.seciniz}" itemValue="#{null}"/>-->

        <!--                           var="personel"-->
        <!--                           itemLabel="#{personel.gnlPersonel.gnlKisi.adSoyad}"-->
        <!--                           itemValue="#{personel}"/>-->
        <!--        </p:selectOneMenu>-->

        <p:outputLabel value="#{messages.projeLabel}" for="@next"/>
        <p:selectOneMenu id="ortProje" value="#{ortTalepController.selected.ortProje}" filter="true"
                         converter="omnifaces.SelectItemsConverter">
            <f:selectItem itemLabel="#{messages.seciniz}" itemValue="#{null}"/>
            <f:selectItems value="#{ortProjeController.items}"
                           var="proje"
                           itemLabel="#{proje.tanim}"
                           itemValue="#{proje}"/>
        </p:selectOneMenu>

        <p:outputLabel value="#{messages.sutKoduLabel}" for="@next"/>
        <p:selectOneMenu id="ortSutKodu" value="#{ortTalepController.selected.ortSutKodu}" filter="true"
                         converter="omnifaces.SelectItemsConverter">
            <f:selectItem itemLabel="#{messages.seciniz}" itemValue="#{null}"/>
            <f:selectItems value="#{ortSutKoduController.items}"
                           var="sutKoduItem"
                           itemLabel="#{sutKoduItem.tanim}"
                           itemValue="#{sutKoduItem}"/>
        </p:selectOneMenu>

        <p:outputLabel value="#{messages.aciklamaLabel}" for="@next"/>
        <p:inputTextarea rows="4" id="aciklama" value="#{ortTalepController.selected.aciklama}"
                         title="#{messages.aciklamaText}" styleClass="w-100" autoResize="false"/>

    </coco:createpage>

</ui:composition>
