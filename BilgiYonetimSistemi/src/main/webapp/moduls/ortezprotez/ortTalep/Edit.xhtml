<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces"
      xmlns:coco="jakarta.faces.composite/ui">

<ui:composition>

    <coco:editpage id="OrtTalepEditForm"
                   widgetVar="OrtTalepEditDialog"
                   model="#{ortTalepController.selected}"
                   listForm="OrtTalepListForm"
                   actionListener="#{ortTalepController.save}">

        <p:outputLabel value="#{messages.talepNoLabel}" for="@next"/>
        <p:inputText id="talepNo" value="#{ortTalepController.selected.talepNo}" readonly="true"/>

        <p:outputLabel value="#{messages.kisiLabel}" for="@next"/>
        <p:inputText id="ortKisiId" value="#{ortTalepController.selected.ortKisi.gnlKisi.tcKimlikNo}"
                     title="#{messages.tcKimlikNoText}" readonly="true" size="30"/>

        <p:outputLabel value="#{messages.adSoyadLabel}" for="@next"/>
        <p:inputText id="adSoyad" value="#{ortTalepController.selected.ortKisi.gnlKisi.adSoyad}"
                     title="#{messages.adSoyadText}" readonly="true" styleClass="inputUpdate"/>

        <p:outputLabel value="#{messages.talepTarihiLabel}" for="@next"/>
        <p:inputText id="talepTarihi" value="#{ortTalepController.selected.talepTarihi}"
                     title="#{messages.talepTarihiText}" readonly="true">
            <f:convertDateTime pattern="#{messages.tarihSaatFormat}" type="localDateTime"/>
        </p:inputText>

        <p:outputLabel value="#{messages.talepTipiLabel}" for="@next"/>
        <p:selectOneMenu id="talepTipi" value="#{ortTalepController.selected.talepTipi}"
                         required="true" converter="omnifaces.SelectItemsConverter">
            <f:selectItem itemLabel="#{messages.seciniz}" itemValue="#{null}"/>
            <f:selectItems value="#{enumOrtTalepTipi.ALL_VALUES}"
                           var="talepTipi"
                           itemLabel="#{talepTipi.displayValue}"
                           itemValue="#{talepTipi}"/>
        </p:selectOneMenu>

        <p:outputLabel value="#{messages.durumLabel}" for="@next"/>
        <p:inputText id="durum" value="#{ortTalepController.selected.durum.displayValue}" readonly="true"/>

        <p:outputLabel value="#{messages.teknikerLabel}" for="@next"/>
        <p:inputText id="tekniker" value="#{ortTalepController.selected.teknikerOrtPersonel.gnlPersonel.gnlKisi.adSoyad}"
                     readonly="true"/>

        <p:outputLabel value="#{messages.fizyoterapistLabel}" for="@next"/>
        <p:inputText id="fizyoterapist" value="#{ortTalepController.selected.fizyoterapistOrtPersonel.gnlPersonel.gnlKisi.adSoyad}"
                     readonly="true"/>

        <p:outputLabel value="#{messages.projeLabel}" for="@next"/>
        <p:inputText id="ortProje" value="#{ortTalepController.selected.ortProje.tanim}" readonly="true" size="50"/>

        <p:outputLabel value="#{messages.sutKoduLabel}" for="@next"/>
        <p:inputText id="ortSutKodu" value="#{ortTalepController.selected.ortSutKodu.tanim}" readonly="true"/>

        <p:outputLabel value="#{messages.aciklamaLabel}" for="@next"/>
        <p:inputTextarea rows="4" id="aciklama" value="#{ortTalepController.selected.aciklama}"
                         title="#{messages.aciklamaText}" styleClass="w-100" autoResize="false"/>

    </coco:editpage>

</ui:composition>

</html>
