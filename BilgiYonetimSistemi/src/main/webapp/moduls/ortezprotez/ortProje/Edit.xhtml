<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="primefaces"
      xmlns:coco="jakarta.faces.composite/ui">

<ui:composition>

    <coco:editpage id="OrtProjeEditForm"
                   model="#{ortProjeController.selected}"
                   widgetVar="OrtProjeEditDialog"
                   actionListener="#{ortProjeController.save}"
                   listForm="OrtProjeListForm">

        <p:outputLabel value="#{messages.projeAdiLabel}" for="@next"/>
        <p:inputText value="#{ortProjeController.selected.tanim}" title="#{messages.projeAdiText}" required="true" size="50" maxlength="200"/>

        <p:outputLabel value="#{messages.aciklamaLabel}" for="@next"/>
        <p:inputTextarea rows="4" value="#{ortProjeController.selected.aciklama}" title="#{messages.aciklamaText}" styleClass="w-100"
                         autoResize="false"/>

    </coco:editpage>

</ui:composition>

</html>
