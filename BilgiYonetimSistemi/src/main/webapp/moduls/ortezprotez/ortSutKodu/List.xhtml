<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces"
                xmlns:pt="jakarta.faces.passthrough"
                xmlns:coco="jakarta.faces.composite/ui">

    <h:form id="OrtSutKoduListForm" styleClass="form-height">

        <p:contextMenu id="OrtSutKoduDataTableContextMenu" for="datalist:datalist">
            <p:menuitem value="#{messages.buttonEkle}" onclick="document.getElementById('OrtSutKoduListForm:datalist:datalist:createButton').click();"
                        icon="pi pi-plus" rendered="#{syKullaniciController.hasPermission('ortsutkodu:ekle')}"/>
            <p:menuitem value="#{messages.buttonGuncelle}"
                        onclick="document.getElementById('OrtSutKoduListForm:datalist:datalist:editButton').click();"
                        icon="pi pi-pencil" rendered="#{syKullaniciController.hasPermission('ortsutkodu:guncelle')}"/>
            <p:menuitem value="#{messages.buttonDetay}" onclick="document.getElementById('OrtSutKoduListForm:datalist:datalist:viewButton').click();"
                        icon="pi pi-search"/>
            <p:menuitem value="#{messages.buttonSil}" onclick="document.getElementById('OrtSutKoduListForm:datalist:datalist:deleteButton').click();"
                        icon="pi pi-trash" rendered="#{syKullaniciController.hasPermission('ortsutkodu:sil')}"/>
        </p:contextMenu>

        <coco:datatable id="datalist"
                        value="#{ortSutKoduController.lazyItems}"
                        rowKey="#{item.id}"
                        selection="#{ortSutKoduController.selected}"
                        filtered="#{ortSutKoduController.filtered}"
                        rowselect=":OrtSutKoduListForm:datalist:datalist:createButton,:OrtSutKoduListForm:datalist:datalist:viewButton,:OrtSutKoduListForm:datalist:datalist:editButton,:OrtSutKoduListForm:datalist:datalist:deleteButton"
                        rowDblselect="document.getElementById('OrtSutKoduListForm:datalist:datalist:editButton').click()"
                        contextMenu=":OrtSutKoduListForm:datalist:datalist:createButton :OrtSutKoduListForm:datalist:datalist:viewButton :OrtSutKoduListForm:datalist:datalist:editButton :OrtSutKoduListForm:datalist:datalist:deleteButton"
                        selectListener="#{ortSutKoduController.resetParents}"
                        controller="#{ortSutKoduController}"
                        header="#{messages.sutKoduListesi}">

            <p:ajax event="colResize" listener="#{ortSutKoduController.onResize}"/>

            <f:facet name="paginatorBottomLeft">
                <p:commandButton id="createButton" styleClass="ui-button-primary" icon="pi pi-plus" pt:data-tooltip="#{messages.buttonEkle}"
                                 actionListener="#{ortSutKoduController.prepareCreate}" update=":OrtSutKoduCreateForm:OrtSutKoduCreateForm"
                                 oncomplete="PF('OrtSutKoduCreateDialog').show()" onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('ortsutkodu:ekle')}"/>
                <p:commandButton id="editButton" styleClass="ui-button-success" icon="pi pi-pencil" pt:data-tooltip="#{messages.buttonGuncelle}"
                                 update=":OrtSutKoduEditForm:OrtSutKoduEditForm" oncomplete="PF('OrtSutKoduEditDialog').show()"
                                 disabled="#{empty ortSutKoduController.selected}" onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('ortsutkodu:guncelle')}"/>
                <p:commandButton id="viewButton" styleClass="ui-button-info" icon="pi pi-search" pt:data-tooltip="#{messages.buttonDetay}"
                                 update=":OrtSutKoduViewForm:OrtSutKoduViewForm" oncomplete="PF('OrtSutKoduViewDialog').show()"
                                 disabled="#{empty ortSutKoduController.selected}" onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"/>
                <p:commandButton id="deleteButton" styleClass="ui-button-danger" icon="pi pi-trash" pt:data-tooltip="#{messages.buttonSil}"
                                 actionListener="#{ortSutKoduController.delete}" update=":growl,datalist"
                                 disabled="#{empty ortSutKoduController.selected}"
                                 rendered="#{syKullaniciController.hasPermission('ortsutkodu:sil')}">
                    <p:confirm header="#{messages.ConfirmationHeader}" message="#{messages.ConfirmDeleteMessage}" icon="pi pi-exclamation-circle"/>
                </p:commandButton>
            </f:facet>

        </coco:datatable>

        <ui:include src="/confirmation.xhtml"/>

    </h:form>

</ui:composition>
