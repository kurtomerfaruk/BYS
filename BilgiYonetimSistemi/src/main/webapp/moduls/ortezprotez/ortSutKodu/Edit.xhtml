<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="primefaces"
      xmlns:coco="jakarta.faces.composite/ui">

<ui:composition>

    <coco:editpage id="OrtSutKoduEditForm"
                   model="#{ortSutKoduController.selected}"
                   widgetVar="OrtSutKoduEditDialog"
                   actionListener="#{ortSutKoduController.save}"
                   listForm="OrtSutKoduListForm">

        <p:outputLabel value="#{messages.kodLabel}" for="@next"/>
        <p:inputText value="#{ortSutKoduController.selected.kod}" title="#{messages.kodText}" required="true" size="50" maxlength="50"/>

        <p:outputLabel value="#{messages.tanimLabel}" for="@next"/>
        <p:inputText value="#{ortSutKoduController.selected.tanim}" title="#{messages.tanimText}" required="true" size="50" maxlength="250"/>

    </coco:editpage>

</ui:composition>

</html>
