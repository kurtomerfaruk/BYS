<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces"
                xmlns:pt="jakarta.faces.passthrough"
                xmlns:coco="jakarta.faces.composite/ui">

    <h:form id="EyEngelinOlusumuListForm" styleClass="form-height">

        <p:contextMenu id="EyEngelinOlusumuDataTableContextMenu" for="datalist:datalist">
            <p:menuitem value="#{messages.buttonEkle}"
                        onclick="document.getElementById('EyEngelinOlusumuListForm:datalist:datalist:createButton').click();"
                        icon="pi pi-plus" rendered="#{syKullaniciController.hasPermission('eyengelinolusumu:ekle')}"/>
            <p:menuitem value="#{messages.buttonGuncelle}"
                        onclick="document.getElementById('EyEngelinOlusumuListForm:datalist:datalist:editButton').click();"
                        icon="pi pi-pencil" rendered="#{syKullaniciController.hasPermission('eyengelinolusumu:guncelle')}"/>
            <p:menuitem value="#{messages.buttonDetay}"
                        onclick="document.getElementById('EyEngelinOlusumuListForm:datalist:datalist:viewButton').click();"
                        icon="pi pi-search"/>
            <p:menuitem value="#{messages.buttonSil}"
                        onclick="document.getElementById('EyEngelinOlusumuListForm:datalist:datalist:deleteButton').click();"
                        icon="pi pi-trash" rendered="#{syKullaniciController.hasPermission('eyengelinolusumu:sil')}"/>
        </p:contextMenu>
        <coco:datatable id="datalist"
                        value="#{eyEngelinOlusumuController.lazyItems}"
                        rowKey="#{item.id}"
                        selection="#{eyEngelinOlusumuController.selected}"
                        filtered="#{eyEngelinOlusumuController.filtered}"
                        rowselect=":EyEngelinOlusumuListForm:datalist:datalist:createButton,:EyEngelinOlusumuListForm:datalist:datalist:viewButton,:EyEngelinOlusumuListForm:datalist:datalist:editButton,:EyEngelinOlusumuListForm:datalist:datalist:deleteButton"
                        rowDblselect="document.getElementById('EyEngelinOlusumuListForm:datalist:datalist:editButton').click()"
                        contextMenu=":EyEngelinOlusumuListForm:datalist:datalist:createButton :EyEngelinOlusumuListForm:datalist:datalist:viewButton :EyEngelinOlusumuListForm:datalist:datalist:editButton :EyEngelinOlusumuListForm:datalist:datalist:deleteButton"
                        selectListener="#{eyEngelinOlusumuController.resetParents}"
                        controller="#{eyEngelinOlusumuController}"
                        header="#{messages.engelinOlusumListesi}">


            <p:ajax event="colResize" listener="#{eyEngelinOlusumuController.onResize}"/>

            <f:facet name="paginatorBottomLeft">
                    <p:commandButton id="createButton" styleClass="ui-button-primary" icon="pi pi-plus"
                                     pt:data-tooltip="#{messages.buttonEkle}"
                                     actionListener="#{eyEngelinOlusumuController.prepareCreate}"
                                     update=":EyEngelinOlusumuCreateForm:EyEngelinOlusumuCreateForm"
                                     oncomplete="PF('EyEngelinOlusumuCreateDialog').show()" onstart="PF('Loading').show()"
                                     onsuccess="PF('Loading').hide()"
                                     rendered="#{syKullaniciController.hasPermission('eyengelinolusumu:ekle')}"/>
                    <p:commandButton id="editButton" styleClass="ui-button-success" icon="pi pi-pencil"
                                     pt:data-tooltip="#{messages.buttonGuncelle}"
                                     update=":EyEngelinOlusumuEditForm:EyEngelinOlusumuEditForm"
                                     oncomplete="PF('EyEngelinOlusumuEditDialog').show()"
                                     disabled="#{empty eyEngelinOlusumuController.selected}" onstart="PF('Loading').show()"
                                     onsuccess="PF('Loading').hide()"
                                     rendered="#{syKullaniciController.hasPermission('eyengelinolusumu:guncelle')}"/>
                    <p:commandButton id="viewButton" styleClass="ui-button-info" icon="pi pi-search"
                                     pt:data-tooltip="#{messages.buttonDetay}"
                                     update=":EyEngelinOlusumuViewForm:EyEngelinOlusumuViewForm"
                                     oncomplete="PF('EyEngelinOlusumuViewDialog').show()"
                                     disabled="#{empty eyEngelinOlusumuController.selected}" onstart="PF('Loading').show()"
                                     onsuccess="PF('Loading').hide()"/>
                    <p:commandButton id="deleteButton" styleClass="ui-button-danger" icon="pi pi-trash"
                                     pt:data-tooltip="#{messages.buttonSil}"
                                     actionListener="#{eyEngelinOlusumuController.delete}" update=":growl,datalist"
                                     disabled="#{empty eyEngelinOlusumuController.selected}"
                                     rendered="#{syKullaniciController.hasPermission('eyengelinolusumu:sil')}">
                        <p:confirm header="#{messages.ConfirmationHeader}" message="#{messages.ConfirmDeleteMessage}"
                                   icon="pi pi-warning"/>
                    </p:commandButton>
            </f:facet>

        </coco:datatable>


        <ui:include src="/confirmation.xhtml"/>

    </h:form>

</ui:composition>
