<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces"
                xmlns:pt="jakarta.faces.passthrough"
                xmlns:coco="jakarta.faces.composite/ui">

    <h:form id="GnlMeslekListForm" styleClass="form-height">

        <p:contextMenu id="GnlMeslekDataTableContextMenu" for="datalist:datalist">
            <p:menuitem value="#{messages.buttonEkle}" onclick="document.getElementById('GnlMeslekListForm:datalist:datalist:createButton').click();"
                        icon="pi pi-plus" rendered="#{syKullaniciController.hasPermission('gnlmeslek:ekle')}"/>
            <p:menuitem value="#{messages.buttonGuncelle}" onclick="document.getElementById('GnlMeslekListForm:datalist:datalist:editButton').click();"
                        icon="pi pi-pencil" rendered="#{syKullaniciController.hasPermission('gnlmeslek:guncelle')}"/>
            <p:menuitem value="#{messages.buttonDetay}" onclick="document.getElementById('GnlMeslekListForm:datalist:datalist:viewButton').click();"
                        icon="pi pi-search"/>
            <p:menuitem value="#{messages.buttonSil}" onclick="document.getElementById('GnlMeslekListForm:datalist:datalist:deleteButton').click();"
                        icon="pi pi-trash" rendered="#{syKullaniciController.hasPermission('gnlmeslek:sil')}"/>
        </p:contextMenu>
        <coco:datatable id="datalist"
                        value="#{gnlMeslekController.lazyItems}"
                        rowKey="#{item.id}"
                        selection="#{gnlMeslekController.selected}"
                        filtered="#{gnlMeslekController.filtered}"
                        rowselect=":GnlMeslekListForm:datalist:datalist:createButton,:GnlMeslekListForm:datalist:datalist:viewButton,:GnlMeslekListForm:datalist:datalist:editButton,:GnlMeslekListForm:datalist:datalist:deleteButton"
                        rowDblselect="document.getElementById('GnlMeslekListForm:datalist:datalist:editButton').click()"
                        contextMenu=":GnlMeslekListForm:datalist:datalist:createButton :GnlMeslekListForm:datalist:datalist:viewButton :GnlMeslekListForm:datalist:datalist:editButton :GnlMeslekListForm:datalist:datalist:deleteButton"
                        selectListener="#{gnlMeslekController.resetParents}"
                        controller="#{gnlMeslekController}"
                        header="#{messages.meslekListesi}">

            <p:ajax event="colResize" listener="#{gnlMeslekController.onResize}"/>

            <f:facet name="paginatorBottomLeft">

                <p:commandButton id="createButton" styleClass="ui-button-primary" icon="pi pi-plus" pt:data-tooltip="#{messages.buttonEkle}"
                                 actionListener="#{gnlMeslekController.prepareCreate}" update=":GnlMeslekCreateForm:GnlMeslekCreateForm"
                                 oncomplete="PF('GnlMeslekCreateDialog').show()" onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('gnlmeslek:ekle')}"/>
                <p:commandButton id="editButton" styleClass="ui-button-success" icon="pi pi-pencil" pt:data-tooltip="#{messages.buttonGuncelle}"
                                 update=":GnlMeslekEditForm:GnlMeslekEditForm" oncomplete="PF('GnlMeslekEditDialog').show()"
                                 disabled="#{empty gnlMeslekController.selected}" onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('gnlmeslek:guncelle')}"/>
                <p:commandButton id="viewButton" styleClass="ui-button-info" icon="pi pi-search" pt:data-tooltip="#{messages.buttonDetay}"
                                 update=":GnlMeslekViewForm:GnlMeslekViewForm" oncomplete="PF('GnlMeslekViewDialog').show()"
                                 disabled="#{empty gnlMeslekController.selected}" onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"/>
                <p:commandButton id="deleteButton" styleClass="ui-button-danger" icon="pi pi-trash" pt:data-tooltip="#{messages.buttonSil}"
                                 actionListener="#{gnlMeslekController.delete}" update=":growl,datalist" disabled="#{empty gnlMeslekController.selected}"
                                 rendered="#{syKullaniciController.hasPermission('gnlmeslek:sil')}">
                    <p:confirm header="#{messages.ConfirmationHeader}" message="#{messages.ConfirmDeleteMessage}" icon="pi pi-exclamation-circle"/>
                </p:commandButton>

            </f:facet>

        </coco:datatable>


        <ui:include src="/confirmation.xhtml"/>

    </h:form>

</ui:composition>
