<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="primefaces"
      xmlns:coco="jakarta.faces.composite/ui">

<ui:composition>

    <coco:createpage id="GnlMeslekCreateForm"
                     renderedListener="#{gnlMeslekController.selected != null}"
                     widgetVar="GnlMeslekCreateDialog"
                     actionListener="#{gnlMeslekController.saveNew}"
                     listForm="GnlMeslekListForm">

        <p:outputLabel value="#{messages.meslekLabel}" for="@next"/>
        <p:inputText id="tanim" value="#{gnlMeslekController.selected.tanim}" title="#{messages.meslekText}" size="50" maxlength="100"/>

    </coco:createpage>

</ui:composition>

</html>
