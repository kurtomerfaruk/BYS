      xmlns:p="primefaces"
      xmlns:coco="jakarta.faces.composite/ui">

<ui:composition>

    <coco:createpage id="GnlPersonelCreateForm"
                     renderedListener="#{gnlPersonelController.selected != null}"
                     widgetVar="GnlPersonelCreateDialog"
                     actionListener="#{gnlPersonelController.saveNew}"
                     listForm="GnlPersonelListForm"
                     onShow="adjustMenuWidth('GnlPersonelCreateForm');">

<!--        <p:outputLabel value="#{messages.kisiLabel}" for="inputWithButtonKisiId"/>-->
<!--        <coco:inputWithButton id="inputWithButtonKisiId" inputId="kisiId"-->
<!--                              inputValue="#{gnlPersonelController.selected.gnlKisi.adSoyad}"-->
<!--                              inputTitle="#{messages.personelText}"-->
<!--                              actionListener="#{bysController.openCommonDialog('gnlKisiSec')}"-->
<!--                              ajaxListener="#{gnlPersonelController.secilenGnlKisi}"-->
<!--                              buttonTitle="#{messages.kisiSecmelisiniz}"-->
<!--                              size="50"-->
<!--                              dialogId="GnlPersonelCreateDialogId"/>-->

        <p:outputLabel value="#{messages.uyrukLabel}" for="@next"/>
        <p:selectOneMenu id="uyruk" value="#{gnlPersonelController.selected.gnlKisi.uyruk}"
                         required="true" converter="omnifaces.SelectItemsConverter">
            <f:selectItem itemLabel="#{messages.seciniz}" itemValue="#{null}"/>
            <f:selectItems value="#{enumUyruk.ALL_VALUES}"
                           var="uyruks"
                           itemLabel="#{uyruks.displayValue}"
                           itemValue="#{uyruks}"/>
        </p:selectOneMenu>

        <p:outputLabel value="#{messages.tcKimlikNoLabel}" for="@next"/>
        <coco:tcKimlikNoDogumTarihi actionListener="#{gnlPersonelController.getTcKimlik()}"
                                    update=":growl,@(.tcUpdate)"
                                    value="#{gnlPersonelController.selected.gnlKisi.tcKimlikNo}"
                                    dateValue="#{gnlPersonelController.selected.gnlKisi.dogumTarihi}"/>

        <p:outputLabel value="#{messages.adLabel}" for="@next"/>
        <p:inputText id="ad" value="#{gnlPersonelController.selected.gnlKisi.ad}"
                     title="#{messages.adText}"
                     required="true"
                     readonly="#{facesContext.renderResponse}" styleClass="tcUpdate"/>

        <p:outputLabel value="#{messages.soyadLabel}" for="@next"/>
        <p:inputText id="soyad" value="#{gnlPersonelController.selected.gnlKisi.soyad}"
                     title="#{messages.soyadText}"
                     required="true" readonly="#{facesContext.renderResponse}"
                     styleClass="tcUpdate"/>

        <p:outputLabel value="#{messages.anaAdiLabel}" for="@next"/>
        <p:inputText id="anaAdi" value="#{gnlPersonelController.selected.gnlKisi.anaAdi}"
                     title="#{messages.anaAdiLabel}" required="true" styleClass="tcUpdate"/>

        <p:outputLabel value="#{messages.babaAdiLabel}" for="@next"/>
        <p:inputText id="babaAdi" value="#{gnlPersonelController.selected.gnlKisi.babaAdi}"
                     title="#{messages.babaAdiLabel}" required="true" styleClass="tcUpdate"/>

        <p:outputLabel value="#{messages.dogumYeriLabel}" for="@next"/>
        <p:inputText id="dogumYeri" value="#{gnlPersonelController.selected.gnlKisi.dogumYeri}"
                     title="#{messages.dogumYeriText}" required="true" styleClass="tcUpdate"/>

        <p:outputLabel value="#{messages.cinsiyetLabel}" for="@next"/>
        <p:inputText id="cinsiyet" value="#{gnlPersonelController.selected.gnlKisi.cinsiyet}"
                     required="true" readonly="#{facesContext.renderResponse}"
                     styleClass="tcUpdate"/>

        <p:outputLabel value="#{messages.medeniDurumLabel}" for="@next"/>
        <p:inputText id="medeniDurum"
                     value="#{gnlPersonelController.selected.gnlKisi.medeniDurum}"
                     title="#{messages.medeniDurumText}" required="true"
                     readonly="#{facesContext.renderResponse}"
                     styleClass="tcUpdate"/>

        <p:outputLabel value="#{messages.egitimDurumuLabel}" for="@next"/>
        <p:selectOneMenu id="egitimDurumu" styleClass="tcUpdate" value="#{gnlPersonelController.selected.gnlKisi.egitimDurumu}"
                         required="true" converter="omnifaces.SelectItemsConverter" filter="true" filterMatchMode="contains">
            <f:selectItem itemLabel="#{messages.seciniz}" itemValue="#{null}"/>
            <f:selectItems value="#{enumEgitimDurumu.ALL_VALUES}"
                           var="enumEgitimDurumus"
                           itemLabel="#{enumEgitimDurumus.displayValue}"
                           itemValue="#{enumEgitimDurumus}"/>
        </p:selectOneMenu>

        <p:outputLabel value="#{messages.telefonLabel}" for="@next"/>
        <p:inputMask id="telefon" value="#{gnlPersonelController.selected.gnlKisi.telefon}"
                     mask="#{messages.telefonFormat}" required="true" title="#{messages.telefonText}"
                     size="14" styleClass="tcUpdate"/>

        <p:outputLabel value="#{messages.telefonLabel}" for="@next"/>
        <p:inputMask id="telefon2" value="#{gnlPersonelController.selected.gnlKisi.telefon2}"
                     mask="#{messages.telefonFormat}" title="#{messages.telefonText}" size="14"
                     styleClass="tcUpdate"/>

        <p:outputLabel value="#{messages.adresLabel}" for="@next"/>
        <p:inputTextarea rows="4" id="adres"
                         value="#{gnlPersonelController.selected.gnlKisi.adres}"
                         title="#{messages.adresText}"
                         styleClass="w-100 tcUpdate" autoResize="false" />

        <p:outputLabel value="#{messages.unvanLabel}" for="@next"/>
        <p:selectOneMenu id="gnlunvanId" value="#{gnlPersonelController.selected.gnlUnvan}" filter="true"
                         converter="omnifaces.SelectItemsConverter" filterMatchMode="contains">
            <f:selectItem itemLabel="#{messages.seciniz}"/>
            <f:selectItems value="#{gnlUnvanController.items}"
                           var="gnlunvanIdItem"
                           itemValue="#{gnlunvanIdItem}"
                           itemLabel="#{gnlunvanIdItem.tanim.toString()}"/>
        </p:selectOneMenu>

        <p:outputLabel value="#{messages.birimLabel}" for="@next"/>
        <p:selectCheckboxMenu id="gnlBirim" value="#{gnlPersonelController.gnlBirims}" label="Birim" multiple="true"
                              converter="omnifaces.SelectItemsConverter" filter="true" filterMatchMode="startsWith"
                              styleClass="checkboxMenu">
            <f:selectItems value="#{gnlBirimController.items}"
                           var="birims"
                           itemValue="#{birims}"
                           itemLabel="#{birims.tanim.toString()}"/>
        </p:selectCheckboxMenu>

    </coco:createpage>

</ui:composition>

</html>
