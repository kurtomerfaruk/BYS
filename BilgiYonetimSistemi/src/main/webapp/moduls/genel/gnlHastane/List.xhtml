<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces"
                xmlns:pt="jakarta.faces.passthrough"
                xmlns:coco="jakarta.faces.composite/ui">

    <h:form id="GnlHastaneListForm" styleClass="form-height">

        <p:contextMenu id="GnlHastaneDataTableContextMenu" for="datalist:datalist">
            <p:menuitem value="#{messages.buttonEkle}" onclick="document.getElementById('GnlHastaneListForm:datalist:datalist:createButton').click();"
                        icon="pi pi-plus" rendered="#{syKullaniciController.hasPermission('gnlhastane:ekle')}"/>
            <p:menuitem value="#{messages.buttonGuncelle}" onclick="document.getElementById('GnlHastaneListForm:datalist:datalist:editButton').click();"
                        icon="pi pi-pencil" rendered="#{syKullaniciController.hasPermission('gnlhastane:guncelle')}"/>
            <p:menuitem value="#{messages.buttonDetay}" onclick="document.getElementById('GnlHastaneListForm:datalist:datalist:viewButton').click();"
                        icon="pi pi-search"/>
            <p:menuitem value="#{messages.buttonSil}" onclick="document.getElementById('GnlHastaneListForm:datalist:datalist:deleteButton').click();"
                        icon="pi pi-trash" rendered="#{syKullaniciController.hasPermission('gnlhastane:sil')}"/>
        </p:contextMenu>
        <coco:datatable id="datalist"
                        value="#{gnlHastaneController.lazyItems}"
                        rowKey="#{item.id}"
                        selection="#{gnlHastaneController.selected}"
                        filtered="#{gnlHastaneController.filtered}"
                        rowselect=":GnlHastaneListForm:datalist:datalist:createButton,:GnlHastaneListForm:datalist:datalist:viewButton,:GnlHastaneListForm:datalist:datalist:editButton,:GnlHastaneListForm:datalist:datalist:deleteButton"
                        rowDblselect="document.getElementById('GnlHastaneListForm:datalist:datalist:editButton').click()"
                        contextMenu=":GnlHastaneListForm:datalist:datalist:createButton :GnlHastaneListForm:datalist:datalist:viewButton :GnlHastaneListForm:datalist:datalist:editButton :GnlHastaneListForm:datalist:datalist:deleteButton"
                        selectListener="#{gnlHastaneController.resetParents}"
                        controller="#{gnlHastaneController}"
                        header="#{messages.hastaneListesi}">

            <p:ajax event="colResize" listener="#{gnlHastaneController.onResize}"/>

            <f:facet name="paginatorBottomLeft">

                <p:commandButton id="createButton" styleClass="ui-button-primary" icon="pi pi-plus" pt:data-tooltip="#{messages.buttonEkle}"
                                 actionListener="#{gnlHastaneController.prepareCreate}" update=":GnlHastaneCreateForm:GnlHastaneCreateForm"
                                 oncomplete="PF('GnlHastaneCreateDialog').show()" onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('gnlhastane:ekle')}"/>
                <p:commandButton id="editButton" styleClass="ui-button-success" icon="pi pi-pencil" pt:data-tooltip="#{messages.buttonGuncelle}"
                                 update=":GnlHastaneEditForm:GnlHastaneEditForm" oncomplete="PF('GnlHastaneEditDialog').show()"
                                 disabled="#{empty gnlHastaneController.selected}" onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('gnlhastane:guncelle')}"/>
                <p:commandButton id="viewButton" styleClass="ui-button-info" icon="pi pi-search" pt:data-tooltip="#{messages.buttonDetay}"
                                 update=":GnlHastaneViewForm:GnlHastaneViewForm" oncomplete="PF('GnlHastaneViewDialog').show()"
                                 disabled="#{empty gnlHastaneController.selected}" onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"/>
                <p:commandButton id="deleteButton" styleClass="ui-button-danger" icon="pi pi-trash" pt:data-tooltip="#{messages.buttonSil}"
                                 actionListener="#{gnlHastaneController.delete}" update=":growl,datalist" disabled="#{empty gnlHastaneController.selected}"
                                 rendered="#{syKullaniciController.hasPermission('gnlhastane:sil')}">
                    <p:confirm header="#{messages.ConfirmationHeader}" message="#{messages.ConfirmDeleteMessage}" icon="pi pi-exclamation-circle"/>
                </p:commandButton>

            </f:facet>

        </coco:datatable>


        <ui:include src="/confirmation.xhtml"/>

    </h:form>

</ui:composition>
