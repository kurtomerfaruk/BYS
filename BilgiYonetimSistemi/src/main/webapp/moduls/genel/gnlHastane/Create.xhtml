<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="primefaces"
      xmlns:coco="jakarta.faces.composite/ui">

<ui:composition>

    <coco:createpage id="GnlHastaneCreateForm"
                     renderedListener="#{gnlHastaneController.selected != null}"
                     widgetVar="GnlHastaneCreateDialog"
                     actionListener="#{gnlHastaneController.saveNew}"
                     listForm="GnlHastaneListForm">

        <p:outputLabel value="#{messages.hastaneLabel}" for="@next"/>
        <p:inputText id="tanim" value="#{gnlHastaneController.selected.tanim}" title="#{messages.hastalikText}" size="70" maxlength="250"/>

    </coco:createpage>

</ui:composition>

</html>
