<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces"
                xmlns:pt="jakarta.faces.passthrough"
                xmlns:coco="jakarta.faces.composite/ui">

    <h:form id="PkKesiIziListForm" class="form-height">

        <p:contextMenu id="PkKesiIziDataTableContextMenu" for="datalist:datalist">
            <p:menuitem value="#{messages.buttonEkle}"
                        onclick="document.getElementById('PkKesiIziListForm:datalist:datalist:createButton').click();"
                        icon="pi pi-plus" rendered="#{syKullaniciController.hasPermission('pkkesiizi:ekle')}"/>
            <p:menuitem value="#{messages.buttonGuncelle}"
                        onclick="document.getElementById('PkKesiIziListForm:datalist:datalist:editButton').click();"
                        icon="pi pi-pencil" rendered="#{syKullaniciController.hasPermission('pkkesiizi:guncelle')}"/>
            <p:menuitem value="#{messages.buttonDetay}" onclick="document.getElementById('PkKesiIziListForm:datalist:datalist:viewButton').click();"
                        icon="pi pi-search"/>
            <p:menuitem value="#{messages.buttonSil}" onclick="document.getElementById('PkKesiIziListForm:datalist:datalist:deleteButton').click();"
                        icon="pi pi-trash" rendered="#{syKullaniciController.hasPermission('pkkesiizi:sil')}"/>
        </p:contextMenu>

        <coco:datatable id="datalist"
                        value="#{pkKesiIziController.lazyItems}"
                        rowKey="#{item.id}"
                        selection="#{pkKesiIziController.selected}"
                        filtered="#{pkKesiIziController.filtered}"
                        rowselect=":PkKesiIziListForm:datalist:datalist:createButton,:PkKesiIziListForm:datalist:datalist:viewButton,:PkKesiIziListForm:datalist:datalist:editButton,:PkKesiIziListForm:datalist:datalist:deleteButton"
                        rowDblselect="document.getElementById('PkKesiIziListForm:datalist:datalist:editButton').click()"
                        contextMenu=":PkKesiIziListForm:datalist:datalist:createButton :PkKesiIziListForm:datalist:datalist:viewButton :PkKesiIziListForm:datalist:datalist:editButton :PkKesiIziListForm:datalist:datalist:deleteButton"
                        selectListener="#{pkKesiIziController.resetParents}"
                        controller="#{pkKesiIziController}"
                        header="#{messages.kesiIziListesi}">

            <p:ajax event="colResize" listener="#{pkKesiIziController.onResize}"/>


            <f:facet name="paginatorBottomLeft">
                <p:commandButton id="createButton" styleClass="ui-button-primary" icon="pi pi-plus" pt:data-tooltip="#{messages.buttonEkle}"
                                 actionListener="#{pkKesiIziController.prepareCreate}" update=":PkKesiIziCreateForm:PkKesiIziCreateForm"
                                 oncomplete="PF('PkKesiIziCreateDialog').show()" onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('pkkesiizi:ekle')}"/>
                <p:commandButton id="editButton" styleClass="ui-button-success" icon="pi pi-pencil" pt:data-tooltip="#{messages.buttonGuncelle}"
                                 update=":PkKesiIziEditForm:PkKesiIziEditForm"
                                 oncomplete="PF('PkKesiIziEditDialog').show()" disabled="#{empty pkKesiIziController.selected}"
                                 onstart="PF('Loading').show()"
                                 onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('pkkesiizi:guncelle')}"/>
                <p:commandButton id="viewButton" styleClass="ui-button-info" icon="pi pi-search" pt:data-tooltip="#{messages.buttonDetay}"
                                 update=":PkKesiIziViewForm:PkKesiIziViewForm"
                                 oncomplete="PF('PkKesiIziViewDialog').show()" disabled="#{empty pkKesiIziController.selected}"
                                 onstart="PF('Loading').show()"
                                 onsuccess="PF('Loading').hide()"/>
                <p:commandButton id="deleteButton" styleClass="ui-button-danger" pt:data-tooltip="#{messages.buttonSil}" icon="pi pi-trash"
                                 actionListener="#{pkKesiIziController.delete}"
                                 update=":growl,datalist" disabled="#{empty pkKesiIziController.selected}"
                                 rendered="#{syKullaniciController.hasPermission('pkkesiizi:sil')}">
                    <p:confirm header="#{messages.ConfirmationHeader}" message="#{messages.ConfirmDeleteMessage}" icon="pi pi-warning"/>
                </p:commandButton>
            </f:facet>

        </coco:datatable>


        <ui:include src="/confirmation.xhtml"/>

    </h:form>

</ui:composition>
