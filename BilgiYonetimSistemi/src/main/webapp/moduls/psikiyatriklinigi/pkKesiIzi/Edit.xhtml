<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="primefaces"
      xmlns:coco="jakarta.faces.composite/ui">

<ui:composition>

    <coco:editpage id="PkKesiIziEditForm"
                   widgetVar="PkKesiIziEditDialog"
                   actionListener="#{pkKesiIziController.save}"

                   model="#{pkKesiIziController.selected}">

        <p:outputLabel value="#{messages.kesiIziLabel}" for="@next"/>
