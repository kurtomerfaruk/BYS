<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces"
      xmlns:coco="jakarta.faces.composite/ui">

<ui:composition>

    <coco:createpage id="PkPersonelCreateForm"
                     renderedListener="#{pkPersonelController.selected != null}"
                     widgetVar="PkPersonelCreateDialog"
                     actionListener="#{pkPersonelController.saveNew}"
                     listForm="PkPersonelListForm">

        <p:outputLabel value="#{messages.personelLabel}" for="@next"/>
        <p:selectOneMenu id="uyruk" value="#{pkPersonelController.selected.gnlPersonel}"
                         required="true" converter="omnifaces.SelectItemsConverter" filter="true">
            <f:selectItem itemLabel="#{messages.seciniz}" itemValue="#{null}"/>
            <f:selectItems value="#{gnlPersonelController.items}"
                           var="gnlPersonel"
                           itemLabel="#{gnlPersonel.gnlKisi.adSoyad}"
                           itemValue="#{gnlPersonel}"/>
        </p:selectOneMenu>

    </coco:createpage>

</ui:composition>

</html>
