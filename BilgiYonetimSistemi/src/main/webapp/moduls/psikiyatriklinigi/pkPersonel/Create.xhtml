<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces"
      xmlns:coco="jakarta.faces.composite/ui">

<ui:composition>

    <coco:createpage id="PkPersonelCreateForm"
                     renderedListener="#{pkPersonelController.selected != null}"
                     widgetVar="PkPersonelCreateDialog"
                     actionListener="#{pkPersonelController.saveNew}"
                     listForm="PkPersonelListForm">

        <p:outputLabel value="#{messages.uyrukLabel}" for="@next"/>
        <p:selectOneMenu id="uyruk" value="#{pkPersonelController.selected.gnlPersonel.gnlKisi.uyruk}"
                         required="true" converter="omnifaces.SelectItemsConverter">
            <f:selectItem itemLabel="#{messages.seciniz}" itemValue="#{null}"/>
            <f:selectItems value="#{enumUyruk.ALL_VALUES}"
                           var="enumUyruks"
                           itemLabel="#{enumUyruks.displayValue}"
                           itemValue="#{enumUyruks}"/>
        </p:selectOneMenu>

        <p:outputLabel value="#{messages.tcKimlikNoLabel}" for="@next"/>
        <coco:tcKimlikNoDogumTarihi actionListener="#{pkPersonelController.getTcKimlik()}"
                                    update=":growl,@(.tcUpdate)"
                                    value="#{pkPersonelController.selected.gnlPersonel.gnlKisi.tcKimlikNo}"
                                    dateValue="#{pkPersonelController.selected.gnlPersonel.gnlKisi.dogumTarihi}"/>

        <p:outputLabel value="#{messages.adLabel}" for="@next"/>
        <p:inputText id="ad" value="#{pkPersonelController.selected.gnlPersonel.gnlKisi.ad}"
                     title="#{messages.adText}"
                     required="true"
                     readonly="#{facesContext.renderResponse}" styleClass="tcUpdate"/>

        <p:outputLabel value="#{messages.soyadLabel}" for="@next"/>
        <p:inputText id="soyad" value="#{pkPersonelController.selected.gnlPersonel.gnlKisi.soyad}"
                     title="#{messages.soyadText}"
                     required="true" readonly="#{facesContext.renderResponse}"
                     styleClass="tcUpdate"/>

        <p:outputLabel value="#{messages.dogumYeriLabel}" for="@next"/>
        <p:inputText id="dogumYeri" value="#{pkPersonelController.selected.gnlPersonel.gnlKisi.dogumYeri}"
                     required="true"
                     readonly="#{facesContext.renderResponse}" styleClass="tcUpdate"/>

        <p:outputLabel value="#{messages.cinsiyetLabel}" for="@next"/>
        <p:inputText id="cinsiyet" value="#{pkPersonelController.selected.gnlPersonel.gnlKisi.cinsiyet}" required="true"
                     readonly="#{facesContext.renderResponse}" styleClass="tcUpdate"/>

        <p:outputLabel value="#{messages.medeniDurumLabel}" for="@next"/>
        <p:inputText id="medeniDurum" value="#{pkPersonelController.selected.gnlPersonel.gnlKisi.medeniDurum}"
                     title="#{messages.medeniDurumText}" required="true"
                     readonly="#{facesContext.renderResponse}"
                     styleClass="tcUpdate"/>

        <p:outputLabel value="#{messages.egitimDurumuLabel}" for="@next"/>
        <p:selectOneMenu id="egitimDurumu" value="#{pkPersonelController.selected.gnlPersonel.gnlKisi.egitimDurumu}"
                         converter="omnifaces.SelectItemsConverter" styleClass="tcUpdate">
            <f:selectItem itemLabel="#{messages.seciniz}" itemValue="#{null}"/>
            <f:selectItems value="#{enumEgitimDurumu.ALL_VALUES}"
                           var="enumEgitimDurumus"
                           itemLabel="#{enumEgitimDurumus.displayValue}"
                           itemValue="#{enumEgitimDurumus}"/>
        </p:selectOneMenu>

        <p:outputLabel value="#{messages.telefonLabel}" for="@next"/>
        <p:inputMask id="telefon" value="#{pkPersonelController.selected.gnlPersonel.gnlKisi.telefon}"
                     mask="#{messages.telefonFormat}"
                     required="true"
                     title="#{messages.telefonText}" size="14" styleClass="tcUpdate"/>

        <p:outputLabel value="#{messages.telefonLabel}" for="telefon2"/>
        <p:inputMask id="telefon2" value="#{pkPersonelController.selected.gnlPersonel.gnlKisi.telefon2}"
                     mask="#{messages.telefonFormat}" title="#{messages.telefonText}" size="14" styleClass="tcUpdate"/>

        <p:outputLabel value="#{messages.unvanLabel}" for="@next"/>
        <p:selectOneMenu value="#{pkPersonelController.selected.gnlPersonel.gnlUnvan}" filter="true" required="true"
                         converter="omnifaces.SelectItemsConverter" styleClass="tcUpdate">
            <f:selectItem itemValue="#{null}" itemLabel="#{messages.seciniz}"/>
            <f:selectItems value="#{gnlUnvanController.items}"
                           var="unvans"
                           itemLabel="#{unvans.tanim}"
                           itemValue="#{unvans}"/>
        </p:selectOneMenu>

    </coco:createpage>

</ui:composition>

</html>
