<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces"
                xmlns:pt="jakarta.faces.passthrough"
                xmlns:coco="jakarta.faces.composite/ui">

    <h:form id="PkRevirAnemnezListForm" class="form-height">

        <p:contextMenu id="PkRevirAnemnezDataTableContextMenu" for="datalist:datalist">
            <p:menuitem value="#{messages.buttonEkle}" onclick="document.getElementById('PkRevirAnemnezListForm:datalist:datalist:createButton').click();"
                        icon="pi pi-plus" rendered="#{syKullaniciController.hasPermission('pkreviranemnez:ekle')}"/>
            <p:menuitem value="#{messages.buttonGuncelle}" onclick="document.getElementById('PkRevirAnemnezListForm:datalist:datalist:editButton').click();"
                        icon="pi pi-pencil" rendered="#{syKullaniciController.hasPermission('pkreviranemnez:guncelle')}"/>
            <p:menuitem value="#{messages.buttonDetay}" onclick="document.getElementById('PkRevirAnemnezListForm:datalist:datalist:viewButton').click();"
                        icon="pi pi-search"/>
            <p:menuitem value="#{messages.buttonSil}" onclick="document.getElementById('PkRevirAnemnezListForm:datalist:datalist:deleteButton').click();"
                        icon="pi pi-trash" rendered="#{syKullaniciController.hasPermission('pkreviranemnez:sil')}"/>
        </p:contextMenu>

        <coco:datatable id="datalist"
                        value="#{pkRevirAnemnezController.lazyItems}"
                        rowKey="#{item.id}"
                        selection="#{pkRevirAnemnezController.selected}"
                        filtered="#{pkRevirAnemnezController.filtered}"
                        rowselect=":PkRevirAnemnezListForm:datalist:datalist:createButton,:PkRevirAnemnezListForm:datalist:datalist:viewButton,:PkRevirAnemnezListForm:datalist:datalist:editButton,:PkRevirAnemnezListForm:datalist:datalist:deleteButton"
                        rowDblselect="document.getElementById('PkRevirAnemnezListForm:datalist:datalist:editButton').click()"
                        contextMenu=":PkRevirAnemnezListForm:datalist:datalist:createButton :PkRevirAnemnezListForm:datalist:datalist:viewButton :PkRevirAnemnezListForm:datalist:datalist:editButton :PkRevirAnemnezListForm:datalist:datalist:deleteButton"
                        controller="#{pkRevirAnemnezController}"
                        selectListener="#{pkRevirAnemnezController.resetParents()}"
                        header="#{messages.revirAnemnezListesi}">

            <p:ajax event="colResize" listener="#{pkRevirAnemnezController.onResize}"/>

            <f:facet name="paginatorBottomLeft">
                <p:commandButton id="createButton" styleClass="ui-button-primary" icon="pi pi-plus" pt:data-tooltip="#{messages.buttonEkle}"
                                 actionListener="#{pkRevirAnemnezController.prepareCreate}" update=":PkRevirAnemnezCreateForm:PkRevirAnemnezCreateForm"
                                 oncomplete="PF('PkRevirAnemnezCreateDialog').show()" onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('pkreviranemnez:ekle')}"/>
                <p:commandButton id="editButton" styleClass="ui-button-success" icon="pi pi-pencil" pt:data-tooltip="#{messages.buttonGuncelle}"
                                 update=":PkRevirAnemnezEditForm:PkRevirAnemnezEditForm"
                                 oncomplete="PF('PkRevirAnemnezEditDialog').show()" disabled="#{empty pkRevirAnemnezController.selected}" onstart="PF('Loading').show()"
                                 onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('pkreviranemnez:guncelle')}"/>
                <p:commandButton id="viewButton" styleClass="ui-button-info" icon="pi pi-search" pt:data-tooltip="#{messages.buttonDetay}"
                                 update=":PkRevirAnemnezViewForm:PkRevirAnemnezViewForm"
                                 oncomplete="PF('PkRevirAnemnezViewDialog').show()" disabled="#{empty pkRevirAnemnezController.selected}" onstart="PF('Loading').show()"
                                 onsuccess="PF('Loading').hide()"/>
                <p:commandButton id="deleteButton" styleClass="ui-button-danger" pt:data-tooltip="#{messages.buttonSil}" icon="pi pi-trash"
                                 actionListener="#{pkRevirAnemnezController.delete}"
                                 update=":growl,datalist" disabled="#{empty pkRevirAnemnezController.selected}"
                                 rendered="#{syKullaniciController.hasPermission('pkreviranemnez:sil')}">
                    <p:confirm header="#{messages.ConfirmationHeader}" message="#{messages.ConfirmDeleteMessage}" icon="pi pi-warning"/>
                </p:commandButton>
            </f:facet>

        </coco:datatable>

        <ui:include src="/confirmation.xhtml"/>

    </h:form>

</ui:composition>
