<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces"
      xmlns:coco="jakarta.faces.composite/ui">

<ui:composition>

    <p:panelGrid id="anemnezBilgileriPanel" columns="2" styleClass="w-100"
                 rendered="#{pkRevirAnemnezController.selected != null}" layout="tabular">

        <p:outputLabel value="#{messages.tarihLabel}" for="yatisTarihi"/>
        <p:datePicker id="yatisTarihi" locale="tr"
                      pattern="#{messages.tarihSaatKisaFormat}"
                      value="#{pkRevirAnemnezController.selected.yatisTarihi}"
                      title="#{messages.tarihText}" mask="true"
                      showTime="true" timeOnlyWhenEmpty="false"
                      monthNavigator="true" yearNavigator="true" showButtonBar="true"
                      showIcon="true" showOnFocus="false"/>

        <p:outputLabel value="#{messages.revirGorusmeYapanLabel}" for="@next"/>
        <p:selectOneMenu value="#{pkRevirAnemnezController.selected.gorusmeYapanPkPersonel}" converter="omnifaces.SelectItemsConverter"
                         required="true" filter="true">
            <f:selectItem itemLabel="#{messages.seciniz}" itemValue="#{null}"/>
            <f:selectItems value="#{pkPersonelController.items}"
                           var="personels"
                           itemValue="#{personels}"
                           itemLabel="#{personels.gnlPersonel.gnlKisi.adSoyad}"/>
        </p:selectOneMenu>

        <p:outputLabel value="#{messages.hastaLabel}" for="@next"/>
        <coco:inputWithButton id="inputWithButtonPkHasta" inputId="tedaviSekliId"
                              inputValue="#{pkRevirAnemnezController.selected.pkHastaTedaviSekli.pkHasta.gnlKisi.tcKimlikNo}"
                              inputTitle="#{messages.tcKimlikNoText}"
                              actionListener="#{bysController.openCommonDialog('pkHastaTedaviSekliSec')}"
                              ajaxListener="#{pkRevirAnemnezController.secilenTedaviSekli}"
                              buttonTitle="#{messages.tedaviSekliSecmelisiniz}"
                              size="50"
                              dialogId="PkRevirAnemnezCreateDialogId"/>

        <p:outputLabel value="#{messages.hastaAdSoyadLabel}" for="@next"/>
        <p:inputText value="#{pkRevirAnemnezController.selected.pkHastaTedaviSekli.pkHasta.gnlKisi.adSoyad}"
                     title="#{messages.hastaAdSoyadText}"
                     size="50" maxlength="50" readonly="true" styleClass="inputUpdate"/>

        <p:outputLabel value="#{messages.revirProtokolNoLabel}" for="@next"/>
        <p:inputText id="protokolNo" value="#{pkRevirAnemnezController.selected.protokolNo}"
                     title="#{messages.revirProtokolNoText}" size="50" maxlength="50" required="true"/>

        <p:outputLabel value="#{messages.boyLabel}" for="@next"/>
        <p:inputNumber id="boy" value="#{pkRevirAnemnezController.selected.boy}"
                       title="#{messages.revirBoyText}"
                       minValue="0" maxValue="300" decimalPlaces="0" thousandSeparator=","/>

        <p:outputLabel value="#{messages.kiloLabel}" for="@next"/>
        <p:inputNumber id="kilo" value="#{pkRevirAnemnezController.selected.kilo}"
                       title="#{messages.revirKiloText}"
                       minValue="0" maxValue="500" decimalPlaces="0" thousandSeparator=","/>

        <p:outputLabel value="#{messages.revirAileselHastalikLabel}" for="@next"/>
        <h:panelGroup>
            <p:selectOneMenu value="#{pkRevirAnemnezController.selected.aileselHastalik}"
                             converter="omnifaces.SelectItemsConverter">
                <f:selectItem itemValue="#{null}" itemLabel="#{messages.seciniz}"/>
                <f:selectItems value="#{enumVarYok.ALL_VALUES}"
                               var="varyok"
                               itemLabel="#{varyok.displayValue}"
                               itemValue="#{varyok}"/>
                <p:ajax event="change" update="aileselHastalikAciklama"/>
            </p:selectOneMenu>
            <p:inputText id="aileselHastalikAciklama"
                         value="#{pkRevirAnemnezController.selected.aileselHastalikAciklama}"
                         required="#{pkRevirAnemnezController.selected.aileselHastalik eq 'VAR'}"
                         disabled="#{pkRevirAnemnezController.selected.aileselHastalik ne 'VAR'}"/>
        </h:panelGroup>

        <p:outputLabel value="#{messages.revirOnTibbiTaniLabel}" for="@next"/>
        <p:inputTextarea id="onTibbiTani" rows="3" autoResize="true"
                         value="#{pkRevirAnemnezController.selected.onTibbiTani}"
                         title="#{messages.revirOnTibbiTaniText}" styleClass="w-100"/>

        <p:outputLabel value="#{messages.revirTeslimAlinanMalzemeLabel}" for="@next"/>
        <p:inputTextarea id="teslimAlinanTibbiMalzemeler" rows="3" autoResize="true"
                         value="#{pkRevirAnemnezController.selected.teslimAlinanTibbiMalzemeler}"
                         title="#{messages.revirTeslimAlinanMalzemeText}" styleClass="w-100"/>

        <p:outputLabel value="#{messages.revirCalismaVeEglenceLabel}" for="@next"/>
        <p:inputTextarea id="calismaVeEglence" rows="3" autoResize="true"
                         value="#{pkRevirAnemnezController.selected.calismaVeEglence}"
                         title="#{messages.revirCalismaVeEglenceText}" styleClass="w-100"/>

        <p:outputLabel value="#{messages.revirKiloKaybiLabel}" for="@next"/>
        <h:panelGroup>
            <p:selectOneMenu value="#{pkRevirAnemnezController.selected.sonAltiAydaKiloKaybiVarMi}"
                             converter="omnifaces.SelectItemsConverter">
                <f:selectItem itemValue="#{null}" itemLabel="#{messages.seciniz}"/>
                <f:selectItems value="#{enumVarYok.ALL_VALUES}"
                               var="varyok"
                               itemLabel="#{varyok.displayValue}"
                               itemValue="#{varyok}"/>
                <p:ajax event="change" update="sonAltiAydaKiloKaybiVarMiAciklama"/>
            </p:selectOneMenu>
            <p:inputText id="sonAltiAydaKiloKaybiVarMiAciklama"
                         value="#{pkRevirAnemnezController.selected.sonAltiAydaKiloKaybiVarMiAciklama}"
                         required="#{pkRevirAnemnezController.selected.sonAltiAydaKiloKaybiVarMi eq 'VAR'}"
                         disabled="#{pkRevirAnemnezController.selected.sonAltiAydaKiloKaybiVarMi ne 'VAR'}"/>
        </h:panelGroup>


    </p:panelGrid>

</ui:composition>
</html>
