<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:p="primefaces"
      xmlns:f="jakarta.faces.core"
      xmlns:coco="jakarta.faces.composite/ui">

<ui:composition>

    <coco:editpage id="PkAileSosyalIncelemeEditForm"
                   widgetVar="PkAileSosyalIncelemeEditDialog"
                   actionListener="#{pkAileSosyalIncelemeController.save}"
                   listForm="PkAileSosyalIncelemeListForm"
                   model="#{pkAileSosyalIncelemeController.selected}">

        <p:outputLabel value="#{messages.incelemeTarihiLabel}" for="@next"/>
        <p:datePicker locale="tr" pattern="#{messages.tarihFormat}"
                      value="#{pkAileSosyalIncelemeController.selected.tarih}"
                      title="#{messages.incelemeTarihiText}" mask="true"
                      monthNavigator="true" yearNavigator="true" showButtonBar="true"
                      showIcon="true" showOnFocus="false"/>

        <p:outputLabel value="#{messages.tcKimlikNoLabel}" for="@next"/>
        <coco:inputWithButton id="inputWithButtonPkHasta" inputId="pkHastaId"
                              inputValue="#{pkAileSosyalIncelemeController.selected.pkAile.gnlKisi.tcKimlikNo}"
                              inputTitle="#{messages.tcKimlikNoText}"
                              actionListener="#{bysController.openCommonDialog('pkAileSec')}"
                              ajaxListener="#{pkAileSosyalIncelemeController.secilenPkAile}"
                              buttonTitle="#{messages.hastaSecmelisiniz}"
                              size="50"
                              dialogId="PkAileSosyalIncelemeCreateDialogId"/>


        <p:outputLabel value="#{messages.adLabel}" for="@next"/>
        <p:inputText id="ad" value="#{pkAileSosyalIncelemeController.selected.pkAile.gnlKisi.ad}"
                     title="#{messages.adText}"
                     size="50" maxlength="50" readonly="true" styleClass="inputUpdate"/>

        <p:outputLabel value="#{messages.soyadLabel}" for="@next"/>
        <p:inputText id="soyad" value="#{pkAileSosyalIncelemeController.selected.pkAile.gnlKisi.soyad}"
                     title="#{messages.soyadText}" size="50" maxlength="50" readonly="true" styleClass="inputUpdate"/>

        <p:outputLabel value="#{messages.telefonLabel}" for="@next"/>
        <h:panelGroup>
            <p:inputText value="#{pkAileSosyalIncelemeController.selected.pkAile.gnlKisi.telefon}"
                         styleClass="inputUpdate" readonly="true"/>
            <p:inputText value="#{pkAileSosyalIncelemeController.selected.pkAile.gnlKisi.telefon2}"
                         styleClass="inputUpdate" readonly="true"/>
        </h:panelGroup>

        <p:outputLabel value="#{messages.hastaAdSoyadLabel}" for="@next"/>
        <p:selectOneMenu value="#{pkAileSosyalIncelemeController.selected.pkHasta}" filter="true"
                         converter="omnifaces.SelectItemsConverter" styleClass="inputUpdate">
            <f:selectItem itemLabel="#{messages.seciniz}" itemValue="#{null}"/>
            <f:selectItems value="#{pkAileSosyalIncelemeController.selected.pkAile.pkHastaList}"
                           var="hastas"
                           itemValue="#{hastas}"
                           itemLabel="#{hastas.gnlKisi.adSoyad}"/>
        </p:selectOneMenu>

        <p:outputLabel value="#{messages.egitimDurumuLabel}" for="@next"/>
        <p:selectOneMenu id="egitimDurumu"
                         value="#{pkAileSosyalIncelemeController.selected.pkAile.gnlKisi.egitimDurumu}"
                         converter="omnifaces.SelectItemsConverter" styleClass="inputUpdate">
            <f:selectItem itemLabel="#{messages.seciniz}" itemValue="#{null}"/>
            <f:selectItems value="#{enumEgitimDurumu.ALL_VALUES}"
                           var="enumEgitimDurumus"
                           itemLabel="#{enumEgitimDurumus.displayValue}"
                           itemValue="#{enumEgitimDurumus}"/>
        </p:selectOneMenu>

        <p:outputLabel value="#{messages.sosyalGuvenceLabel}" for="@next"/>
        <p:selectOneMenu value="#{pkAileSosyalIncelemeController.selected.pkAile.gnlKisi.sosyalGuvence}"
                         converter="omnifaces.SelectItemsConverter" styleClass="inputUpdate">
            <f:selectItem itemLabel="#{messages.seciniz}" itemValue="#{null}"/>
            <f:selectItems value="#{enumSosyalGuvence.ALL_VALUES}"
                           var="sosyalGuvence"
                           itemLabel="#{sosyalGuvence.displayValue}"
                           itemValue="#{sosyalGuvence}"/>
        </p:selectOneMenu>

        <p:outputLabel value="#{messages.aylikGeliriLabel}" for="@next"/>
        <p:inputNumber id="aylikGeliri" value="#{pkAileSosyalIncelemeController.selected.aylikGeliri}"
                       styleClass="text-end" decimalSeparator="," thousandSeparator="."
                       emptyValue="zero"/>

        <p:outputLabel value="#{messages.genelTanitimLabel}" for="@next"/>
        <p:inputTextarea value="#{pkAileSosyalIncelemeController.selected.genelTanitim}" rows="4"
                         autoResize="false" styleClass="w-100"/>

        <p:outputLabel value="#{messages.kisilikOzellikleriLabel}" for="@next"/>
        <p:inputTextarea value="#{pkAileSosyalIncelemeController.selected.kisilikOzellikleri}" rows="4"
                         autoResize="false" styleClass="w-100"/>

        <p:outputLabel value="#{messages.isDurumuLabel}" for="@next"/>
        <p:inputTextarea value="#{pkAileSosyalIncelemeController.selected.isDurumu}" rows="4"
                         autoResize="false" styleClass="w-100"/>

        <p:outputLabel value="#{messages.ekonomikDurumuLabel}" for="@next"/>
        <p:inputTextarea value="#{pkAileSosyalIncelemeController.selected.ekonomikDurum}" rows="4"
                         autoResize="false" styleClass="w-100"/>

        <p:outputLabel value="#{messages.ogrenimDurumuLabel}" for="@next"/>
        <p:inputTextarea value="#{pkAileSosyalIncelemeController.selected.ogrenimDurumu}" rows="4"
                         autoResize="false" styleClass="w-100"/>

        <p:outputLabel value="#{messages.saglikDurumuLabel}" for="@next"/>
        <p:inputTextarea value="#{pkAileSosyalIncelemeController.selected.saglikDurumu}" rows="4"
                         autoResize="false" styleClass="w-100"/>

        <p:outputLabel value="#{messages.sabikaDurumuLabel}" for="@next"/>
        <p:inputTextarea value="#{pkAileSosyalIncelemeController.selected.sabikaDurumu}" rows="4"
                         autoResize="false" styleClass="w-100"/>

        <p:outputLabel value="#{messages.aileVeSosyalYasamLabel}" for="@next"/>
        <p:inputTextarea value="#{pkAileSosyalIncelemeController.selected.aileVeSosyalYasam}" rows="4"
                         autoResize="false" styleClass="w-100"/>

        <p:outputLabel value="#{messages.konutDurumuLabel}" for="@next"/>
        <p:inputTextarea value="#{pkAileSosyalIncelemeController.selected.konutDurumu}" rows="4"
                         autoResize="false" styleClass="w-100"/>

        <p:outputLabel value="#{messages.degerlendirmeVeSonucLabel}" for="@next"/>
        <p:inputTextarea value="#{pkAileSosyalIncelemeController.selected.degerlendirmeVeSonuc}" rows="4"
                         autoResize="false" styleClass="w-100"/>

        <p:outputLabel value="#{messages.degerlendirmeYapanPersonelLabel}" for="@next"/>
        <p:selectOneMenu value="#{pkAileSosyalIncelemeController.selected.degerlendirmeYapanPkPersonel}"
                         converter="omnifaces.SelectItemsConverter" required="true" filter="true">
            <f:selectItem itemLabel="#{messages.seciniz}" itemValue="#{null}"/>
            <f:selectItems value="#{pkPersonelController.items}"
                           var="personels"
                           itemValue="#{personels}"
                           itemLabel="#{personels.gnlPersonel.gnlKisi.adSoyad}"/>
        </p:selectOneMenu>

    </coco:editpage>

</ui:composition>

</html>
