<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces"
                xmlns:pt="jakarta.faces.passthrough"
                xmlns:coco="jakarta.faces.composite/ui">

    <h:form id="PkTalepListForm" class="form-height">

        <p:contextMenu id="PkTalepDataTableContextMenu" for="datalist:datalist">
            <p:menuitem value="#{messages.buttonEkle}" onclick="document.getElementById('PkTalepListForm:datalist:datalist:createButton').click();"
                        icon="pi pi-plus" rendered="#{syKullaniciController.hasPermission('pktalep:ekle')}"/>
            <p:menuitem value="#{messages.buttonGuncelle}" onclick="document.getElementById('PkTalepListForm:datalist:datalist:editButton').click();"
                        icon="pi pi-pencil" rendered="#{syKullaniciController.hasPermission('pktalep:guncelle')}"/>
            <p:menuitem value="#{messages.buttonDetay}" onclick="document.getElementById('PkTalepListForm:datalist:datalist:viewButton').click();"
                        icon="pi pi-search"/>
            <p:menuitem value="#{messages.buttonSil}" onclick="document.getElementById('PkTalepListForm:datalist:datalist:deleteButton').click();"
                        icon="pi pi-trash" rendered="#{syKullaniciController.hasPermission('pktalep:sil')}"/>
        </p:contextMenu>

        <coco:datatable id="datalist"
                        value="#{pkTalepController.lazyItems}"
                        rowKey="#{item.id}"
                        selection="#{pkTalepController.selected}"
                        filtered="#{pkTalepController.filtered}"
                        rowselect=":PkTalepListForm:datalist:datalist:createButton,:PkTalepListForm:datalist:datalist:viewButton,:PkTalepListForm:datalist:datalist:editButton,:PkTalepListForm:datalist:datalist:deleteButton"
                        rowDblselect="document.getElementById('PkTalepListForm:datalist:datalist:editButton').click()"
                        contextMenu=":PkTalepListForm:datalist:datalist:createButton :PkTalepListForm:datalist:datalist:viewButton :PkTalepListForm:datalist:datalist:editButton :PkTalepListForm:datalist:datalist:deleteButton"
                        selectListener="#{pkTalepController.resetParents}"
                        controller="#{pkTalepController}"
                        header="#{messages.talepListesi}">

            <p:ajax event="colResize" listener="#{pkTalepController.onResize}"/>


            <f:facet name="paginatorBottomLeft">
                <p:commandButton id="createButton" styleClass="ui-button-primary" icon="pi pi-plus" pt:data-tooltip="#{messages.buttonEkle}"
                                 actionListener="#{pkTalepController.prepareCreate}" update=":PkTalepCreateForm:PkTalepCreateForm"
                                 oncomplete="PF('PkTalepCreateDialog').show()" onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('pktalep:ekle')}"/>
                <p:commandButton id="editButton" styleClass="ui-button-success" icon="pi pi-pencil" pt:data-tooltip="#{messages.buttonGuncelle}"
                                 update=":PkTalepEditForm:PkTalepEditForm"
                                 oncomplete="PF('PkTalepEditDialog').show()" disabled="#{empty pkTalepController.selected}" onstart="PF('Loading').show()"
                                 onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('pktalep:guncelle')}"/>
                <p:commandButton id="viewButton" styleClass="ui-button-info" icon="pi pi-search" pt:data-tooltip="#{messages.buttonDetay}"
                                 update=":PkTalepViewForm:PkTalepViewForm"
                                 oncomplete="PF('PkTalepViewDialog').show()" disabled="#{empty pkTalepController.selected}" onstart="PF('Loading').show()"
                                 onsuccess="PF('Loading').hide()"/>
                <p:commandButton id="deleteButton" styleClass="ui-button-danger" pt:data-tooltip="#{messages.buttonSil}" icon="pi pi-trash"
                                 actionListener="#{pkTalepController.delete}"
                                 update=":growl,datalist" disabled="#{empty pkTalepController.selected}"
                                 rendered="#{syKullaniciController.hasPermission('pktalep:sil')}">
                    <p:confirm header="#{messages.ConfirmationHeader}" message="#{messages.ConfirmDeleteMessage}" icon="pi pi-warning"/>
                </p:commandButton>
            </f:facet>

        </coco:datatable>


        <ui:include src="/confirmation.xhtml"/>

    </h:form>

</ui:composition>
