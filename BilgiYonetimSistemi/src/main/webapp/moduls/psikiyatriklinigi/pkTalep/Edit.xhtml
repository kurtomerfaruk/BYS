<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces"
      xmlns:coco="jakarta.faces.composite/ui">

<ui:composition>

    <coco:editpage id="PkTalepEditForm"
                   widgetVar="PkTalepEditDialog"
                   actionListener="#{pkTalepController.save}"
                   listForm="PkTalepListForm"
                   model="#{pkTalepController.selected}">

        <p:outputLabel value="#{messages.tarihLabel}" for="@next"/>
        <p:datePicker locale="tr" pattern="#{messages.tarihFormat}"
                      value="#{pkTalepController.selected.tarih}"
                      title="#{messages.tarihText}" mask="true"
                      monthNavigator="true" yearNavigator="true" showButtonBar="true"
                      showIcon="true" showOnFocus="false"/>

        <p:outputLabel value="#{messages.tcKimlikNoLabel}" for="@next"/>
        <coco:inputWithButton id="inputWithButtonPkAile" inputId="pkAileId"
                              inputValue="#{pkTalepController.selected.pkAile.gnlKisi.tcKimlikNo}"
                              inputTitle="#{messages.tcKimlikNoText}"
                              actionListener="#{bysController.openCommonDialog('pkAileSec')}"
                              ajaxListener="#{pkTalepController.secilenPkAile}"
                              buttonTitle="#{messages.hastaSecmelisiniz}"
                              size="50"
                              dialogId="PkTalepEditDialogId"/>

        <p:outputLabel value="#{messages.adLabel}" for="@next"/>
        <p:inputText id="ad" value="#{pkTalepController.selected.pkAile.gnlKisi.ad}"
                     title="#{messages.adText}"
                     size="50" maxlength="50" readonly="true" styleClass="inputUpdate"/>

        <p:outputLabel value="#{messages.soyadLabel}" for="@next"/>
        <p:inputText id="soyad" value="#{pkTalepController.selected.pkAile.gnlKisi.soyad}"
                     title="#{messages.soyadText}" size="50" maxlength="50" readonly="true" styleClass="inputUpdate"/>

        <p:outputLabel value="#{messages.telefonLabel}" for="@next"/>
        <h:panelGroup>
            <p:inputText value="#{pkTalepController.selected.pkAile.gnlKisi.telefon}"
                         styleClass="inputUpdate" readonly="true"/>
            <p:inputText value="#{pkTalepController.selected.pkAile.gnlKisi.telefon2}"
                         styleClass="inputUpdate" readonly="true"/>
        </h:panelGroup>

        <p:outputLabel value="#{messages.talepTuruLabel}" for="@next"/>
        <p:selectOneMenu value="#{pkTalepController.selected.talepTuru}" converter="omnifaces.SelectItemsConverter"
                         required="true">
            <f:selectItem itemLabel="#{messages.seciniz}" itemValue="#{null}"/>
            <f:selectItems value="#{enumTalepTuru.ALL_VALUES}"
                           var="talepTurus"
                           itemValue="#{talepTurus}"
                           itemLabel="#{talepTurus.displayValue}"/>
        </p:selectOneMenu>

        <p:outputLabel value="#{messages.durumLabel}" for="@next"/>
        <p:selectOneMenu value="#{pkTalepController.selected.durum}" converter="omnifaces.SelectItemsConverter"
                         required="true">
            <f:selectItem itemLabel="#{messages.seciniz}" itemValue="#{null}"/>
            <f:selectItems value="#{enumTalepDurumu.ALL_VALUES}"
                           var="durums"
                           itemValue="#{durums}"
                           itemLabel="#{durums.displayValue}"/>
        </p:selectOneMenu>

        <p:outputLabel value="#{messages.aciklamaLabel}" for="@next"/>
        <p:inputTextarea value="#{pkTalepController.selected.aciklama}" autoResize="false" rows="4" styleClass="w-100" required="true"/>

    </coco:editpage>

</ui:composition>

</html>
