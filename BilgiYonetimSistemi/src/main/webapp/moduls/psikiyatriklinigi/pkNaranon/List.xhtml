<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces"
                xmlns:pt="jakarta.faces.passthrough"
                xmlns:coco="jakarta.faces.composite/ui">

    <h:form id="PkNaranonListForm" class="form-height">

        <p:contextMenu id="PkNaranonDataTableContextMenu" for="datalist:datalist">
            <p:menuitem value="#{messages.buttonEkle}" onclick="document.getElementById('PkNaranonListForm:datalist:datalist:createButton').click();"
                        icon="pi pi-plus" rendered="#{syKullaniciController.hasPermission('pknaranon:ekle')}"/>
            <p:menuitem value="#{messages.buttonGuncelle}" onclick="document.getElementById('PkNaranonListForm:datalist:datalist:editButton').click();"
                        icon="pi pi-pencil" rendered="#{syKullaniciController.hasPermission('pknaranon:guncelle')}"/>
            <p:menuitem value="#{messages.buttonDetay}" onclick="document.getElementById('PkNaranonListForm:datalist:datalist:viewButton').click();"
                        icon="pi pi-search"/>
            <p:menuitem value="#{messages.buttonSil}" onclick="document.getElementById('PkNaranonListForm:datalist:datalist:deleteButton').click();"
                        icon="pi pi-trash" rendered="#{syKullaniciController.hasPermission('pknaranon:sil')}"/>
        </p:contextMenu>

        <coco:datatable id="datalist"
                        value="#{pkNaranonController.lazyItems}"
                        rowKey="#{item.id}"
                        selection="#{pkNaranonController.selected}"
                        filtered="#{pkNaranonController.filtered}"
                        rowselect=":PkNaranonListForm:datalist:datalist:createButton,:PkNaranonListForm:datalist:datalist:viewButton,:PkNaranonListForm:datalist:datalist:editButton,:PkNaranonListForm:datalist:datalist:deleteButton"
                        rowDblselect="document.getElementById('PkNaranonListForm:datalist:datalist:editButton').click()"
                        contextMenu=":PkNaranonListForm:datalist:datalist:createButton :PkNaranonListForm:datalist:datalist:viewButton :PkNaranonListForm:datalist:datalist:editButton :PkNaranonListForm:datalist:datalist:deleteButton"
                        selectListener="#{pkNaranonController.resetParents}"
                        controller="#{pkNaranonController}"
                        header="#{messages.naranonListesi}">

            <p:ajax event="colResize" listener="#{pkNaranonController.onResize}"/>

            <f:facet name="paginatorBottomLeft">
                <p:commandButton id="createButton" styleClass="ui-button-primary" icon="pi pi-plus" pt:data-tooltip="#{messages.buttonEkle}"
                                 actionListener="#{pkNaranonController.prepareCreate}" update=":PkNaranonCreateForm:PkNaranonCreateForm"
                                 oncomplete="PF('PkNaranonCreateDialog').show()" onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('pknaranon:ekle')}"/>
                <p:commandButton id="editButton" styleClass="ui-button-success" icon="pi pi-pencil" pt:data-tooltip="#{messages.buttonGuncelle}"
                                 update=":PkNaranonEditForm:PkNaranonEditForm"
                                 oncomplete="PF('PkNaranonEditDialog').show()" disabled="#{empty pkNaranonController.selected}" onstart="PF('Loading').show()"
                                 onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('pknaranon:guncelle')}"/>
                <p:commandButton id="viewButton" styleClass="ui-button-info" icon="pi pi-search" pt:data-tooltip="#{messages.buttonDetay}"
                                 update=":PkNaranonViewForm:PkNaranonViewForm"
                                 oncomplete="PF('PkNaranonViewDialog').show()" disabled="#{empty pkNaranonController.selected}" onstart="PF('Loading').show()"
                                 onsuccess="PF('Loading').hide()"/>
                <p:commandButton id="deleteButton" styleClass="ui-button-danger" pt:data-tooltip="#{messages.buttonSil}" icon="pi pi-trash"
                                 actionListener="#{pkNaranonController.delete}"
                                 update=":growl,datalist" disabled="#{empty pkNaranonController.selected}"
                                 rendered="#{syKullaniciController.hasPermission('pknaranon:sil')}">
                    <p:confirm header="#{messages.ConfirmationHeader}" message="#{messages.ConfirmDeleteMessage}" icon="pi pi-warning"/>
                </p:commandButton>
            </f:facet>

        </coco:datatable>

        <ui:include src="/confirmation.xhtml"/>

    </h:form>

</ui:composition>
