<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces"
                xmlns:pt="jakarta.faces.passthrough"
                xmlns:coco="jakarta.faces.composite/ui">

    <h:form id="PkBireyselGorusmeListForm" class="form-height">

        <p:contextMenu id="PkBireyselGorusmeDataTableContextMenu" for="datalist:datalist">
            <p:menuitem value="#{messages.buttonEkle}" onclick="document.getElementById('PkBireyselGorusmeListForm:datalist:datalist:createButton').click();"
                        icon="pi pi-plus" rendered="#{syKullaniciController.hasPermission('pkbireyselgorusme:ekle')}"/>
            <p:menuitem value="#{messages.buttonGuncelle}" onclick="document.getElementById('PkBireyselGorusmeListForm:datalist:datalist:editButton').click();"
                        icon="pi pi-pencil" rendered="#{syKullaniciController.hasPermission('pkbireyselgorusme:guncelle')}"/>
            <p:menuitem value="#{messages.buttonDetay}" onclick="document.getElementById('PkBireyselGorusmeListForm:datalist:datalist:viewButton').click();"
                        icon="pi pi-search"/>
            <p:menuitem value="#{messages.buttonSil}" onclick="document.getElementById('PkBireyselGorusmeListForm:datalist:datalist:deleteButton').click();"
                        icon="pi pi-trash" rendered="#{syKullaniciController.hasPermission('pkbireyselgorusme:sil')}"/>
        </p:contextMenu>

        <coco:datatable id="datalist"
                        value="#{pkBireyselGorusmeController.lazyItems}"
                        rowKey="#{item.id}"
                        selection="#{pkBireyselGorusmeController.selected}"
                        filtered="#{pkBireyselGorusmeController.filtered}"
                        rowselect=":PkBireyselGorusmeListForm:datalist:datalist:createButton,:PkBireyselGorusmeListForm:datalist:datalist:viewButton,:PkBireyselGorusmeListForm:datalist:datalist:editButton,:PkBireyselGorusmeListForm:datalist:datalist:deleteButton"
                        rowDblselect="document.getElementById('PkBireyselGorusmeListForm:datalist:datalist:editButton').click()"
                        contextMenu=":PkBireyselGorusmeListForm:datalist:datalist:createButton :PkBireyselGorusmeListForm:datalist:datalist:viewButton :PkBireyselGorusmeListForm:datalist:datalist:editButton :PkBireyselGorusmeListForm:datalist:datalist:deleteButton"
                        selectListener="#{pkBireyselGorusmeController.resetParents}"
                        controller="#{pkBireyselGorusmeController}"
                        header="#{messages.aileEgitimListesi}">

            <p:ajax event="colResize" listener="#{pkBireyselGorusmeController.onResize}"/>


            <f:facet name="paginatorBottomLeft">
                <p:commandButton id="createButton" styleClass="ui-button-primary" icon="pi pi-plus" pt:data-tooltip="#{messages.buttonEkle}"
                                 actionListener="#{pkBireyselGorusmeController.prepareCreate}" update=":PkBireyselGorusmeCreateForm:PkBireyselGorusmeCreateForm"
                                 oncomplete="PF('PkBireyselGorusmeCreateDialog').show()" onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('pkbireyselgorusme:ekle')}"/>
                <p:commandButton id="editButton" styleClass="ui-button-success" icon="pi pi-pencil" pt:data-tooltip="#{messages.buttonGuncelle}"
                                 update=":PkBireyselGorusmeEditForm:PkBireyselGorusmeEditForm"
                                 oncomplete="PF('PkBireyselGorusmeEditDialog').show()" disabled="#{empty pkBireyselGorusmeController.selected}" onstart="PF('Loading').show()"
                                 onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('pkbireyselgorusme:guncelle')}"/>
                <p:commandButton id="viewButton" styleClass="ui-button-info" icon="pi pi-search" pt:data-tooltip="#{messages.buttonDetay}"
                                 update=":PkBireyselGorusmeViewForm:PkBireyselGorusmeViewForm"
                                 oncomplete="PF('PkBireyselGorusmeViewDialog').show()" disabled="#{empty pkBireyselGorusmeController.selected}" onstart="PF('Loading').show()"
                                 onsuccess="PF('Loading').hide()"/>
                <p:commandButton id="deleteButton" styleClass="ui-button-danger" pt:data-tooltip="#{messages.buttonSil}" icon="pi pi-trash"
                                 actionListener="#{pkBireyselGorusmeController.delete}"
                                 update=":growl,datalist" disabled="#{empty pkBireyselGorusmeController.selected}"
                                 rendered="#{syKullaniciController.hasPermission('pkbireyselgorusme:sil')}">
                    <p:confirm header="#{messages.ConfirmationHeader}" message="#{messages.ConfirmDeleteMessage}" icon="pi pi-warning"/>
                </p:commandButton>

            </f:facet>

        </coco:datatable>

        <ui:include src="/confirmation.xhtml"/>

    </h:form>

</ui:composition>
