<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces"
                xmlns:pt="jakarta.faces.passthrough"
                xmlns:coco="jakarta.faces.composite/ui">

    <h:form id="PkBireyselTedaviPlaniListForm" class="form-height">

        <p:contextMenu id="PkBireyselTedaviPlaniDataTableContextMenu" for="datalist:datalist">
            <p:menuitem value="#{messages.buttonEkle}" onclick="document.getElementById('PkBireyselTedaviPlaniListForm:datalist:datalist:createButton').click();"
                        icon="pi pi-plus" rendered="#{syKullaniciController.hasPermission('pkbireyseltedaviplani:ekle')}"/>
            <p:menuitem value="#{messages.buttonGuncelle}" onclick="document.getElementById('PkBireyselTedaviPlaniListForm:datalist:datalist:editButton').click();"
                        icon="pi pi-pencil" rendered="#{syKullaniciController.hasPermission('pkbireyseltedaviplani:guncelle')}"/>
            <p:menuitem value="#{messages.buttonDetay}" onclick="document.getElementById('PkBireyselTedaviPlaniListForm:datalist:datalist:viewButton').click();"
                        icon="pi pi-search"/>
            <p:menuitem value="#{messages.buttonSil}" onclick="document.getElementById('PkBireyselTedaviPlaniListForm:datalist:datalist:deleteButton').click();"
                        icon="pi pi-trash" rendered="#{syKullaniciController.hasPermission('pkbireyseltedaviplani:sil')}"/>
        </p:contextMenu>

        <coco:datatable id="datalist"
                        value="#{pkBireyselTedaviPlaniController.lazyItems}"
                        rowKey="#{item.id}"
                        selection="#{pkBireyselTedaviPlaniController.selected}"
                        filtered="#{pkBireyselTedaviPlaniController.filtered}"
                        rowselect=":PkBireyselTedaviPlaniListForm:datalist:datalist:createButton,:PkBireyselTedaviPlaniListForm:datalist:datalist:viewButton,:PkBireyselTedaviPlaniListForm:datalist:datalist:editButton,:PkBireyselTedaviPlaniListForm:datalist:datalist:deleteButton"
                        rowDblselect="document.getElementById('PkBireyselTedaviPlaniListForm:datalist:datalist:editButton').click()"
                        contextMenu=":PkBireyselTedaviPlaniListForm:datalist:datalist:createButton :PkBireyselTedaviPlaniListForm:datalist:datalist:viewButton :PkBireyselTedaviPlaniListForm:datalist:datalist:editButton :PkBireyselTedaviPlaniListForm:datalist:datalist:deleteButton"
                        selectListener="#{pkBireyselTedaviPlaniController.resetParents}"
                        controller="#{pkBireyselTedaviPlaniController}"
                        header="#{messages.unvanListesi}">

            <p:ajax event="colResize" listener="#{pkBireyselTedaviPlaniController.onResize}"/>


            <f:facet name="paginatorBottomLeft">
                <p:commandButton id="createButton" styleClass="ui-button-primary" icon="pi pi-plus" pt:data-tooltip="#{messages.buttonEkle}"
                                 actionListener="#{pkBireyselTedaviPlaniController.prepareCreate}" update=":PkBireyselTedaviPlaniCreateForm:PkBireyselTedaviPlaniCreateForm"
                                 oncomplete="PF('PkBireyselTedaviPlaniCreateDialog').show()" onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('pkbireyseltedaviplani:ekle')}"/>
                <p:commandButton id="editButton" styleClass="ui-button-success" icon="pi pi-pencil" pt:data-tooltip="#{messages.buttonGuncelle}"
                                 update=":PkBireyselTedaviPlaniEditForm:PkBireyselTedaviPlaniEditForm"
                                 oncomplete="PF('PkBireyselTedaviPlaniEditDialog').show()" disabled="#{empty pkBireyselTedaviPlaniController.selected}" onstart="PF('Loading').show()"
                                 onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('pkbireyseltedaviplani:guncelle')}"/>
                <p:commandButton id="viewButton" styleClass="ui-button-info" icon="pi pi-search" pt:data-tooltip="#{messages.buttonDetay}"
                                 update=":PkBireyselTedaviPlaniViewForm:PkBireyselTedaviPlaniViewForm"
                                 oncomplete="PF('PkBireyselTedaviPlaniViewDialog').show()" disabled="#{empty pkBireyselTedaviPlaniController.selected}" onstart="PF('Loading').show()"
                                 onsuccess="PF('Loading').hide()"/>
                <p:commandButton id="deleteButton" styleClass="ui-button-danger" pt:data-tooltip="#{messages.buttonSil}" icon="pi pi-trash"
                                 actionListener="#{pkBireyselTedaviPlaniController.delete}"
                                 update=":growl,datalist" disabled="#{empty pkBireyselTedaviPlaniController.selected}"
                                 rendered="#{syKullaniciController.hasPermission('pkbireyseltedaviplani:sil')}">
                    <p:confirm header="#{messages.ConfirmationHeader}" message="#{messages.ConfirmDeleteMessage}" icon="pi pi-warning"/>
                </p:commandButton>
            </f:facet>

        </coco:datatable>


        <ui:include src="/confirmation.xhtml"/>

    </h:form>

</ui:composition>
