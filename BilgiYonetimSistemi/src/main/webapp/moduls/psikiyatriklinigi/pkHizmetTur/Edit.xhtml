<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="primefaces"
      xmlns:coco="jakarta.faces.composite/ui">

<ui:composition>

    <coco:editpage id="PkHizmetTurEditForm"
                   widgetVar="PkHizmetTurEditDialog"
                   actionListener="#{pkHizmetTurController.save}"
                   listForm="PkHizmetTurListForm"
                   model="#{pkHizmetTurController.selected}">

        <p:outputLabel value="#{messages.hizmetTurLabel}" for="@next" />
        <p:inputText id="tanim" value="#{pkHizmetTurController.selected.tanim}" title="#{messages.hizmetTurText}" size="50" maxlength="150"
                     required="true"/>

    </coco:editpage>

</ui:composition>

</html>
