<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces"
                xmlns:pt="jakarta.faces.passthrough"
                xmlns:coco="jakarta.faces.composite/ui">

    <h:form id="PkHizmetTurListForm" class="form-height">

        <p:contextMenu id="PkHizmetTurDataTableContextMenu" for="datalist:datalist">
            <p:menuitem value="#{messages.buttonEkle}" onclick="document.getElementById('PkHizmetTurListForm:datalist:datalist:createButton').click();"
                        icon="pi pi-plus" rendered="#{syKullaniciController.hasPermission('pkhizmettur:ekle')}"/>
            <p:menuitem value="#{messages.buttonGuncelle}" onclick="document.getElementById('PkHizmetTurListForm:datalist:datalist:editButton').click();"
                        icon="pi pi-pencil" rendered="#{syKullaniciController.hasPermission('pkhizmettur:guncelle')}"/>
            <p:menuitem value="#{messages.buttonDetay}" onclick="document.getElementById('PkHizmetTurListForm:datalist:datalist:viewButton').click();"
                        icon="pi pi-search"/>
            <p:menuitem value="#{messages.buttonSil}" onclick="document.getElementById('PkHizmetTurListForm:datalist:datalist:deleteButton').click();"
                        icon="pi pi-trash" rendered="#{syKullaniciController.hasPermission('pkhizmettur:sil')}"/>
        </p:contextMenu>

        <coco:datatable id="datalist"
                        value="#{pkHizmetTurController.lazyItems}"
                        rowKey="#{item.id}"
                        selection="#{pkHizmetTurController.selected}"
                        filtered="#{pkHizmetTurController.filtered}"
                        rowselect=":PkHizmetTurListForm:datalist:datalist:createButton,:PkHizmetTurListForm:datalist:datalist:viewButton,:PkHizmetTurListForm:datalist:datalist:editButton,:PkHizmetTurListForm:datalist:datalist:deleteButton"
                        rowDblselect="document.getElementById('PkHizmetTurListForm:datalist:datalist:editButton').click()"
                        contextMenu=":PkHizmetTurListForm:datalist:datalist:createButton :PkHizmetTurListForm:datalist:datalist:viewButton :PkHizmetTurListForm:datalist:datalist:editButton :PkHizmetTurListForm:datalist:datalist:deleteButton"
                        selectListener="#{pkHizmetTurController.resetParents}"
                        controller="#{pkHizmetTurController}"
                        header="#{messages.maddeListesi}">

            <p:ajax event="colResize" listener="#{pkHizmetTurController.onResize}"/>


            <f:facet name="paginatorBottomLeft">
                <p:commandButton id="createButton" styleClass="ui-button-primary" icon="pi pi-plus" pt:data-tooltip="#{messages.buttonEkle}"
                                 actionListener="#{pkHizmetTurController.prepareCreate}" update=":PkHizmetTurCreateForm:PkHizmetTurCreateForm"
                                 oncomplete="PF('PkHizmetTurCreateDialog').show()" onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('pkhizmettur:ekle')}"/>
                <p:commandButton id="editButton" styleClass="ui-button-success" icon="pi pi-pencil" pt:data-tooltip="#{messages.buttonGuncelle}"
                                 update=":PkHizmetTurEditForm:PkHizmetTurEditForm"
                                 oncomplete="PF('PkHizmetTurEditDialog').show()" disabled="#{empty pkHizmetTurController.selected}" onstart="PF('Loading').show()"
                                 onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('pkhizmettur:guncelle')}"/>
                <p:commandButton id="viewButton" styleClass="ui-button-info" icon="pi pi-search" pt:data-tooltip="#{messages.buttonDetay}"
                                 update=":PkHizmetTurViewForm:PkHizmetTurViewForm"
                                 oncomplete="PF('PkHizmetTurViewDialog').show()" disabled="#{empty pkHizmetTurController.selected}" onstart="PF('Loading').show()"
                                 onsuccess="PF('Loading').hide()"/>
                <p:commandButton id="deleteButton" styleClass="ui-button-danger" pt:data-tooltip="#{messages.buttonSil}" icon="pi pi-trash"
                                 actionListener="#{pkHizmetTurController.delete}"
                                 update=":growl,datalist" disabled="#{empty pkHizmetTurController.selected}"
                                 rendered="#{syKullaniciController.hasPermission('pkhizmettur:sil')}">
                    <p:confirm header="#{messages.ConfirmationHeader}" message="#{messages.ConfirmDeleteMessage}" icon="pi pi-warning"/>
                </p:commandButton>
            </f:facet>

        </coco:datatable>


        <ui:include src="/confirmation.xhtml"/>

    </h:form>

</ui:composition>
