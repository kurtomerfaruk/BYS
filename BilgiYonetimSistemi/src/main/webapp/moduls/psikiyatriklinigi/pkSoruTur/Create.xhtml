<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="primefaces"
      xmlns:coco="jakarta.faces.composite/ui">

<ui:composition>

    <coco:createpage id="PkSoruTurCreateForm"
                     renderedListener="#{pkSoruTurController.selected != null}"
                     widgetVar="PkSoruTurCreateDialog"
                     actionListener="#{pkSoruTurController.saveNew}"
                     listForm="PkSoruTurListForm">


        <p:outputLabel value="#{messages.soruTurLabel}" for="@next"/>
        <p:inputText id="tanim" value="#{pkSoruTurController.selected.tanim}" title="#{messages.soruTurText}" size="50" maxlength="150"
                     required="true"/>

        <p:outputLabel value="#{messages.siraLabel}" for="@next"/>
        <p:spinner value="#{pkSoruTurController.selected.siraNo}" title="#{messages.siraText}" stepFactor="1" min="0" size="50"
                   required="true"/>

        <p:outputLabel value="#{messages.cokluSecimLabel}" for="@next"/>
        <p:selectBooleanCheckbox value="#{pkSoruTurController.selected.cokluSecim}"/>

    </coco:createpage>

</ui:composition>

</html>
