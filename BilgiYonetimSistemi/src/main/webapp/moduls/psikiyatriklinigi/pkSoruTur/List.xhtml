<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces"
                xmlns:pt="jakarta.faces.passthrough"
                xmlns:coco="jakarta.faces.composite/ui">

    <h:form id="PkSoruTurListForm" class="form-height">

        <p:contextMenu id="PkSoruTurDataTableContextMenu" for="datalist:datalist">
            <p:menuitem value="#{messages.buttonEkle}" onclick="document.getElementById('PkSoruTurListForm:datalist:datalist:createButton').click();"
                        icon="pi pi-plus" rendered="#{syKullaniciController.hasPermission('pksorutur:ekle')}"/>
            <p:menuitem value="#{messages.buttonGuncelle}" onclick="document.getElementById('PkSoruTurListForm:datalist:datalist:editButton').click();"
                        icon="pi pi-pencil" rendered="#{syKullaniciController.hasPermission('pksorutur:guncelle')}"/>
            <p:menuitem value="#{messages.buttonDetay}" onclick="document.getElementById('PkSoruTurListForm:datalist:datalist:viewButton').click();"
                        icon="pi pi-search"/>
            <p:menuitem value="#{messages.buttonSil}" onclick="document.getElementById('PkSoruTurListForm:datalist:datalist:deleteButton').click();"
                        icon="pi pi-trash" rendered="#{syKullaniciController.hasPermission('pksorutur:sil')}"/>
        </p:contextMenu>

        <coco:datatable id="datalist"
                        value="#{pkSoruTurController.lazyItems}"
                        rowKey="#{item.id}"
                        selection="#{pkSoruTurController.selected}"
                        filtered="#{pkSoruTurController.filtered}"
                        rowselect=":PkSoruTurListForm:datalist:datalist:createButton,:PkSoruTurListForm:datalist:datalist:viewButton,:PkSoruTurListForm:datalist:datalist:editButton,:PkSoruTurListForm:datalist:datalist:deleteButton"
                        rowDblselect="document.getElementById('PkSoruTurListForm:datalist:datalist:editButton').click()"
                        contextMenu=":PkSoruTurListForm:datalist:datalist:createButton :PkSoruTurListForm:datalist:datalist:viewButton :PkSoruTurListForm:datalist:datalist:editButton :PkSoruTurListForm:datalist:datalist:deleteButton"
                        selectListener="#{pkSoruTurController.resetParents}"
                        controller="#{pkSoruTurController}"
                        header="#{messages.soruTurListesi}">

            <p:ajax event="colResize" listener="#{pkSoruTurController.onResize}"/>


            <f:facet name="paginatorBottomLeft">
                <p:commandButton id="createButton" styleClass="ui-button-primary" icon="pi pi-plus" pt:data-tooltip="#{messages.buttonEkle}"
                                 actionListener="#{pkSoruTurController.prepareCreate}" update=":PkSoruTurCreateForm:PkSoruTurCreateForm"
                                 oncomplete="PF('PkSoruTurCreateDialog').show()" onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('pksorutur:ekle')}"/>
                <p:commandButton id="editButton" styleClass="ui-button-success" icon="pi pi-pencil" pt:data-tooltip="#{messages.buttonGuncelle}"
                                 update=":PkSoruTurEditForm:PkSoruTurEditForm"
                                 oncomplete="PF('PkSoruTurEditDialog').show()" disabled="#{empty pkSoruTurController.selected}" onstart="PF('Loading').show()"
                                 onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('pksorutur:guncelle')}"/>
                <p:commandButton id="viewButton" styleClass="ui-button-info" icon="pi pi-search" pt:data-tooltip="#{messages.buttonDetay}"
                                 update=":PkSoruTurViewForm:PkSoruTurViewForm"
                                 oncomplete="PF('PkSoruTurViewDialog').show()" disabled="#{empty pkSoruTurController.selected}" onstart="PF('Loading').show()"
                                 onsuccess="PF('Loading').hide()"/>
                <p:commandButton id="deleteButton" styleClass="ui-button-danger" pt:data-tooltip="#{messages.buttonSil}" icon="pi pi-trash"
                                 actionListener="#{pkSoruTurController.delete}"
                                 update=":growl,datalist" disabled="#{empty pkSoruTurController.selected}"
                                 rendered="#{syKullaniciController.hasPermission('pksorutur:sil')}">
                    <p:confirm header="#{messages.ConfirmationHeader}" message="#{messages.ConfirmDeleteMessage}" icon="pi pi-warning"/>
                </p:commandButton>
            </f:facet>

        </coco:datatable>


        <ui:include src="/confirmation.xhtml"/>

    </h:form>

</ui:composition>
