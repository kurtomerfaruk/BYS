<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces"
                xmlns:pt="jakarta.faces.passthrough"
                xmlns:coco="jakarta.faces.composite/ui">

    <h:form id="PkTaburcuNedeniListForm" class="form-height">

        <p:contextMenu id="PkTaburcuNedeniDataTableContextMenu" for="datalist:datalist">
            <p:menuitem value="#{messages.buttonEkle}" onclick="document.getElementById('PkTaburcuNedeniListForm:datalist:datalist:createButton').click();"
                        icon="pi pi-plus" rendered="#{syKullaniciController.hasPermission('pktaburcunedeni:ekle')}"/>
            <p:menuitem value="#{messages.buttonGuncelle}" onclick="document.getElementById('PkTaburcuNedeniListForm:datalist:datalist:editButton').click();"
                        icon="pi pi-pencil" rendered="#{syKullaniciController.hasPermission('pktaburcunedeni:guncelle')}"/>
            <p:menuitem value="#{messages.buttonDetay}" onclick="document.getElementById('PkTaburcuNedeniListForm:datalist:datalist:viewButton').click();"
                        icon="pi pi-search"/>
            <p:menuitem value="#{messages.buttonSil}" onclick="document.getElementById('PkTaburcuNedeniListForm:datalist:datalist:deleteButton').click();"
                        icon="pi pi-trash" rendered="#{syKullaniciController.hasPermission('pktaburcunedeni:sil')}"/>
        </p:contextMenu>

        <coco:datatable id="datalist"
                        value="#{pkTaburcuNedeniController.lazyItems}"
                        rowKey="#{item.id}"
                        selection="#{pkTaburcuNedeniController.selected}"
                        filtered="#{pkTaburcuNedeniController.filtered}"
                        rowselect=":PkTaburcuNedeniListForm:datalist:datalist:createButton,:PkTaburcuNedeniListForm:datalist:datalist:viewButton,:PkTaburcuNedeniListForm:datalist:datalist:editButton,:PkTaburcuNedeniListForm:datalist:datalist:deleteButton"
                        rowDblselect="document.getElementById('PkTaburcuNedeniListForm:datalist:datalist:editButton').click()"
                        contextMenu=":PkTaburcuNedeniListForm:datalist:datalist:createButton :PkTaburcuNedeniListForm:datalist:datalist:viewButton :PkTaburcuNedeniListForm:datalist:datalist:editButton :PkTaburcuNedeniListForm:datalist:datalist:deleteButton"
                        selectListener="#{pkTaburcuNedeniController.resetParents}"
                        controller="#{pkTaburcuNedeniController}"
                        header="#{messages.unvanListesi}">

            <p:ajax event="colResize" listener="#{pkTaburcuNedeniController.onResize}"/>


            <f:facet name="paginatorBottomLeft">
                <p:commandButton id="createButton" styleClass="ui-button-primary" icon="pi pi-plus" pt:data-tooltip="#{messages.buttonEkle}"
                                 actionListener="#{pkTaburcuNedeniController.prepareCreate}" update=":PkTaburcuNedeniCreateForm:PkTaburcuNedeniCreateForm"
                                 oncomplete="PF('PkTaburcuNedeniCreateDialog').show()" onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('pktaburcunedeni:ekle')}"/>
                <p:commandButton id="editButton" styleClass="ui-button-success" icon="pi pi-pencil" pt:data-tooltip="#{messages.buttonGuncelle}"
                                 update=":PkTaburcuNedeniEditForm:PkTaburcuNedeniEditForm"
                                 oncomplete="PF('PkTaburcuNedeniEditDialog').show()" disabled="#{empty pkTaburcuNedeniController.selected}" onstart="PF('Loading').show()"
                                 onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('pktaburcunedeni:guncelle')}"/>
                <p:commandButton id="viewButton" styleClass="ui-button-info" icon="pi pi-search" pt:data-tooltip="#{messages.buttonDetay}"
                                 update=":PkTaburcuNedeniViewForm:PkTaburcuNedeniViewForm"
                                 oncomplete="PF('PkTaburcuNedeniViewDialog').show()" disabled="#{empty pkTaburcuNedeniController.selected}" onstart="PF('Loading').show()"
                                 onsuccess="PF('Loading').hide()"/>
                <p:commandButton id="deleteButton" styleClass="ui-button-danger" pt:data-tooltip="#{messages.buttonSil}" icon="pi pi-trash"
                                 actionListener="#{pkTaburcuNedeniController.delete}"
                                 update=":growl,datalist" disabled="#{empty pkTaburcuNedeniController.selected}"
                                 rendered="#{syKullaniciController.hasPermission('pktaburcunedeni:sil')}">
                    <p:confirm header="#{messages.ConfirmationHeader}" message="#{messages.ConfirmDeleteMessage}" icon="pi pi-warning"/>
                </p:commandButton>
            </f:facet>

        </coco:datatable>


        <ui:include src="/confirmation.xhtml"/>

    </h:form>

</ui:composition>
