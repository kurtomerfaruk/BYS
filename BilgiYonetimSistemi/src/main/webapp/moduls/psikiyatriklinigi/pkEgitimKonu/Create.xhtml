<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces"
      xmlns:coco="jakarta.faces.composite/ui">

    <ui:composition>

        <coco:createpage id="PkEgitimKonuCreateForm"
                         renderedListener="#{pkEgitimKonuController.selected != null}"
                         widgetVar="PkEgitimKonuCreateDialog"
                         actionListener="#{pkEgitimKonuController.saveNew}"
                         listForm="PkEgitimKonuListForm">

            <p:outputLabel value="#{messages.egitimLabel}" for="@next" />
            <p:inputText id="tanim" value="#{pkEgitimKonuController.selected.tanim}" title="#{messages.maddeText}" size="50" maxlength="150" required="true"/>

            <p:outputLabel value="#{messages.turLabel}" for="@next"/>
            <p:selectOneMenu value="#{pkEgitimKonuController.selected.tur}"
                             converter="omnifaces.SelectItemsConverter" required="true">
                <f:selectItem itemValue="#{null}" itemLabel="#{messages.seciniz}"/>
                <f:selectItems value="#{enumEgitimTur.ALL_VALUES}"
                               var="egitimTur"
                               itemLabel="#{egitimTur.displayValue}"
                               itemValue="#{egitimTur}"/>
            </p:selectOneMenu>

        </coco:createpage>

    </ui:composition>

</html>
