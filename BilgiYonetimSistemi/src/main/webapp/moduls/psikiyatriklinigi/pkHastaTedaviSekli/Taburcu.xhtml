<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces"
      xmlns:coco="jakarta.faces.composite/ui">

    <ui:composition>

        <coco:editpage id="PkHastaTedaviSekliTaburcuForm"
                       widgetVar="PkHastaTedaviSekliTaburcuDialog"
                       actionListener="#{pkHastaTedaviSekliController.save}"
                       listForm="PkHastaTedaviSekliListForm"
                       model="#{pkHastaTedaviSekliController.selected}">

            <h:outputText value="#{messages.kayitNoLabel}"/>
            <h:outputText value="#{pkHastaTedaviSekliController.selected.id}">
                <f:convertNumber pattern="#{messages.sayiFormat}"/>
            </h:outputText>

            <h:outputText value="#{messages.tarihLabel}"/>
            <h:outputText value="#{pkHastaTedaviSekliController.selected.tarih}">
                <f:convertDateTime pattern="#{messages.tarihSaatKisaFormat}" type="localDateTime"/>
            </h:outputText>

            <h:outputText value="#{messages.tcKimlikNoLabel}"/>
            <h:outputText value="#{pkHastaTedaviSekliController.selected.pkHasta.gnlKisi.tcKimlikNo}"/>

            <h:outputText value="#{messages.adSoyadLabel}"/>
            <h:outputText value="#{pkHastaTedaviSekliController.selected.pkHasta.gnlKisi.adSoyad}"/>

            <h:outputText value="#{messages.telefonLabel}"/>
            <h:outputText value="#{pkHastaTedaviSekliController.selected.pkHasta.gnlKisi.telefon}"/>

            <h:outputText value="#{messages.telefonLabel}2"/>
            <h:outputText value="#{pkHastaTedaviSekliController.selected.pkHasta.gnlKisi.telefon2}"/>

            <h:outputText value="#{messages.tedaviSekliLabel}"/>
            <h:outputText value="#{pkHastaTedaviSekliController.selected.tedaviSekli.displayValue}"/>

            <p:outputLabel value="#{messages.taburcuNedeniLabel}" for="@next"/>
            <p:selectOneMenu value="#{pkHastaTedaviSekliController.selected.pkTaburcuNedeni}"
                             required="true" converter="omnifaces.SelectItemsConverter" filter="true">
                <f:selectItem itemLabel="#{messages.seciniz}" itemValue="#{null}"/>
                <f:selectItems value="#{pkTaburcuNedeniController.items}"
                               var="taburcuNedens"
                               itemLabel="#{taburcuNedens.tanim}"
                               itemValue="#{taburcuNedens}"/>
            </p:selectOneMenu>

            <p:outputLabel value="#{messages.taburcuTarihiLabel}" for="@next"/>
            <p:datePicker locale="tr" pattern="#{messages.tarihSaatFormat}"
                          value="#{pkHastaTedaviSekliController.selected.taburcuTarihi}"
                          title="#{messages.taburcuTarihiText}" mask="true"
                          monthNavigator="true" yearNavigator="true" showButtonBar="true"
                          showIcon="true" showOnFocus="false" required="true"/>

            <p:outputLabel value="#{messages.taburcuAciklamaLabel}" for="@next"/>
            <p:inputTextarea id="taburcuAciklama" value="#{pkHastaTedaviSekliController.selected.taburcuAciklama}"
                             title="#{messages.taburcuAciklamaText}" styleClass="w-100" rows="4" autoResize="false" required="true"/>

            <p:outputLabel value="#{messages.hizmetSuresiLabel}" for="@next"/>
            <p:inputText id="hizmetSuresi" value="#{pkHastaTedaviSekliController.selected.hizmetSuresi}" required="true"
                         title="#{messages.hizmetSuresiText}" size="50">
                <p:keyFilter regEx="/[0-9_]/i"/>
            </p:inputText>

        </coco:editpage>

    </ui:composition>

</html>
