<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces"
      xmlns:coco="jakarta.faces.composite/ui">

<ui:composition>

    <coco:editpage id="PkHastaTedaviSekliEditForm"
                   widgetVar="PkHastaTedaviSekliEditDialog"
                   actionListener="#{pkHastaTedaviSekliController.save}"
                   listForm="PkHastaTedaviSekliListForm"
                   model="#{pkHastaTedaviSekliController.selected}">

        <p:outputLabel value="#{messages.tarihLabel}" for="@next"/>
        <p:datePicker locale="tr" pattern="#{messages.tarihFormat}"
                      value="#{pkHastaTedaviSekliController.selected.tarih}"
                      title="#{messages.tarihText}" mask="true"
                      monthNavigator="true" yearNavigator="true" showButtonBar="true"
                      showIcon="true" showOnFocus="false"/>

        <p:outputLabel value="#{messages.tcKimlikNoLabel}" for="@next"/>
        <coco:inputWithButton id="inputWithButtonPkHasta" inputId="pkHastaId"
                              inputValue="#{pkHastaTedaviSekliController.selected.pkHasta.gnlKisi.tcKimlikNo}"
                              inputTitle="#{messages.tcKimlikNoText}"
                              actionListener="#{bysController.openCommonDialog('pkHastaSec')}"
                              ajaxListener="#{pkHastaTedaviSekliController.secilenPkHasta}"
                              buttonTitle="#{messages.hastaSecmelisiniz}"
                              size="50"
                              dialogId="PkHastaTedaviSekliCreateDialogId"/>


        <p:outputLabel value="#{messages.adLabel}" for="@next"/>
        <p:inputText id="ad" value="#{pkHastaTedaviSekliController.selected.pkHasta.gnlKisi.ad}"
                     title="#{messages.adText}"
                     size="50" maxlength="50" readonly="true" styleClass="inputUpdate"/>

        <p:outputLabel value="#{messages.soyadLabel}" for="@next"/>
        <p:inputText id="soyad" value="#{pkHastaTedaviSekliController.selected.pkHasta.gnlKisi.soyad}"
                     title="#{messages.soyadText}" size="50" maxlength="50" readonly="true" styleClass="inputUpdate"/>

        <p:outputLabel value="#{messages.telefonLabel}" for="@next"/>
        <h:panelGroup>
            <p:inputText value="#{pkHastaTedaviSekliController.selected.pkHasta.gnlKisi.telefon}"
                         styleClass="inputUpdate" readonly="true"/>
            <p:inputText value="#{pkHastaTedaviSekliController.selected.pkHasta.gnlKisi.telefon2}"
                         styleClass="inputUpdate" readonly="true"/>
        </h:panelGroup>

        <p:outputLabel value="#{messages.tedaviSekliLabel}" for="@next"/>
        <p:selectOneMenu value="#{pkHastaTedaviSekliController.selected.tedaviSekli}"
                         required="true" converter="omnifaces.SelectItemsConverter">
            <f:selectItem itemLabel="#{messages.seciniz}" itemValue="#{null}"/>
            <f:selectItems value="#{enumTedaviSekli.ALL_VALUES}"
                           var="tedaviSeklis"
                           itemLabel="#{tedaviSeklis.displayValue}"
                           itemValue="#{tedaviSeklis}"/>
        </p:selectOneMenu>

    </coco:editpage>

</ui:composition>

</html>
