<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces"
                xmlns:pt="jakarta.faces.passthrough"
                xmlns:coco="jakarta.faces.composite/ui">

    <h:form id="PkMaddeListForm" class="form-height">

        <p:contextMenu id="PkMaddeDataTableContextMenu" for="datalist:datalist">
            <p:menuitem value="#{messages.buttonEkle}" onclick="document.getElementById('PkMaddeListForm:datalist:datalist:createButton').click();"
                        icon="pi pi-plus" rendered="#{syKullaniciController.hasPermission('pkmadde:ekle')}"/>
            <p:menuitem value="#{messages.buttonGuncelle}" onclick="document.getElementById('PkMaddeListForm:datalist:datalist:editButton').click();"
                        icon="pi pi-pencil" rendered="#{syKullaniciController.hasPermission('pkmadde:guncelle')}"/>
            <p:menuitem value="#{messages.buttonDetay}" onclick="document.getElementById('PkMaddeListForm:datalist:datalist:viewButton').click();"
                        icon="pi pi-search"/>
            <p:menuitem value="#{messages.buttonSil}" onclick="document.getElementById('PkMaddeListForm:datalist:datalist:deleteButton').click();"
                        icon="pi pi-trash" rendered="#{syKullaniciController.hasPermission('pkmadde:sil')}"/>
        </p:contextMenu>

        <coco:datatable id="datalist"
                        value="#{pkMaddeController.lazyItems}"
                        rowKey="#{item.id}"
                        selection="#{pkMaddeController.selected}"
                        filtered="#{pkMaddeController.filtered}"
                        rowselect=":PkMaddeListForm:datalist:datalist:createButton,:PkMaddeListForm:datalist:datalist:viewButton,:PkMaddeListForm:datalist:datalist:editButton,:PkMaddeListForm:datalist:datalist:deleteButton"
                        rowDblselect="document.getElementById('PkMaddeListForm:datalist:datalist:editButton').click()"
                        contextMenu=":PkMaddeListForm:datalist:datalist:createButton :PkMaddeListForm:datalist:datalist:viewButton :PkMaddeListForm:datalist:datalist:editButton :PkMaddeListForm:datalist:datalist:deleteButton"
                        selectListener="#{pkMaddeController.resetParents}"
                        controller="#{pkMaddeController}"
                        header="#{messages.unvanListesi}">

            <p:ajax event="colResize" listener="#{pkMaddeController.onResize}"/>


            <f:facet name="paginatorBottomLeft">
                <p:commandButton id="createButton" styleClass="ui-button-primary" icon="pi pi-plus" pt:data-tooltip="#{messages.buttonEkle}"
                                 actionListener="#{pkMaddeController.prepareCreate}" update=":PkMaddeCreateForm:PkMaddeCreateForm"
                                 oncomplete="PF('PkMaddeCreateDialog').show()" onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('pkmadde:ekle')}"/>
                <p:commandButton id="editButton" styleClass="ui-button-success" icon="pi pi-pencil" pt:data-tooltip="#{messages.buttonGuncelle}"
                                 update=":PkMaddeEditForm:PkMaddeEditForm"
                                 oncomplete="PF('PkMaddeEditDialog').show()" disabled="#{empty pkMaddeController.selected}" onstart="PF('Loading').show()"
                                 onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('pkmadde:guncelle')}"/>
                <p:commandButton id="viewButton" styleClass="ui-button-info" icon="pi pi-search" pt:data-tooltip="#{messages.buttonDetay}"
                                 update=":PkMaddeViewForm:PkMaddeViewForm"
                                 oncomplete="PF('PkMaddeViewDialog').show()" disabled="#{empty pkMaddeController.selected}" onstart="PF('Loading').show()"
                                 onsuccess="PF('Loading').hide()"/>
                <p:commandButton id="deleteButton" styleClass="ui-button-danger" pt:data-tooltip="#{messages.buttonSil}" icon="pi pi-trash"
                                 actionListener="#{pkMaddeController.delete}"
                                 update=":growl,datalist" disabled="#{empty pkMaddeController.selected}"
                                 rendered="#{syKullaniciController.hasPermission('pkmadde:sil')}">
                    <p:confirm header="#{messages.ConfirmationHeader}" message="#{messages.ConfirmDeleteMessage}" icon="pi pi-warning"/>
                </p:commandButton>
            </f:facet>

        </coco:datatable>


        <ui:include src="/confirmation.xhtml"/>

    </h:form>

</ui:composition>
