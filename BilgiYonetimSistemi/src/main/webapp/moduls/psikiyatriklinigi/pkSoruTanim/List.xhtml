<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces"
                xmlns:pt="jakarta.faces.passthrough"
                xmlns:coco="jakarta.faces.composite/ui">

    <h:form id="PkSoruTanimListForm" class="form-height">

        <p:contextMenu id="PkSoruTanimDataTableContextMenu" for="datalist:datalist">
            <p:menuitem value="#{messages.buttonEkle}" onclick="document.getElementById('PkSoruTanimListForm:datalist:datalist:createButton').click();"
                        icon="pi pi-plus" rendered="#{syKullaniciController.hasPermission('pksorutanim:ekle')}"/>
            <p:menuitem value="#{messages.buttonGuncelle}" onclick="document.getElementById('PkSoruTanimListForm:datalist:datalist:editButton').click();"
                        icon="pi pi-pencil" rendered="#{syKullaniciController.hasPermission('pksorutanim:guncelle')}"/>
            <p:menuitem value="#{messages.buttonDetay}" onclick="document.getElementById('PkSoruTanimListForm:datalist:datalist:viewButton').click();"
                        icon="pi pi-search"/>
            <p:menuitem value="#{messages.buttonSil}" onclick="document.getElementById('PkSoruTanimListForm:datalist:datalist:deleteButton').click();"
                        icon="pi pi-trash" rendered="#{syKullaniciController.hasPermission('pksorutanim:sil')}"/>
        </p:contextMenu>

        <coco:datatable id="datalist"
                        value="#{pkSoruTanimController.lazyItems}"
                        rowKey="#{item.id}"
                        selection="#{pkSoruTanimController.selected}"
                        filtered="#{pkSoruTanimController.filtered}"
                        rowselect=":PkSoruTanimListForm:datalist:datalist:createButton,:PkSoruTanimListForm:datalist:datalist:viewButton,:PkSoruTanimListForm:datalist:datalist:editButton,:PkSoruTanimListForm:datalist:datalist:deleteButton"
                        rowDblselect="document.getElementById('PkSoruTanimListForm:datalist:datalist:editButton').click()"
                        contextMenu=":PkSoruTanimListForm:datalist:datalist:createButton :PkSoruTanimListForm:datalist:datalist:viewButton :PkSoruTanimListForm:datalist:datalist:editButton :PkSoruTanimListForm:datalist:datalist:deleteButton"
                        selectListener="#{pkSoruTanimController.resetParents}"
                        controller="#{pkSoruTanimController}"
                        header="#{messages.soruTanimListesi}">

            <p:ajax event="colResize" listener="#{pkSoruTanimController.onResize}"/>


            <f:facet name="paginatorBottomLeft">
                <p:commandButton id="createButton" styleClass="ui-button-primary" icon="pi pi-plus" pt:data-tooltip="#{messages.buttonEkle}"
                                 actionListener="#{pkSoruTanimController.prepareCreate}" update=":PkSoruTanimCreateForm:PkSoruTanimCreateForm"
                                 oncomplete="PF('PkSoruTanimCreateDialog').show()" onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('pksorutanim:ekle')}"/>
                <p:commandButton id="editButton" styleClass="ui-button-success" icon="pi pi-pencil" pt:data-tooltip="#{messages.buttonGuncelle}"
                                 update=":PkSoruTanimEditForm:PkSoruTanimEditForm"
                                 oncomplete="PF('PkSoruTanimEditDialog').show()" disabled="#{empty pkSoruTanimController.selected}" onstart="PF('Loading').show()"
                                 onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('pksorutanim:guncelle')}"/>
                <p:commandButton id="viewButton" styleClass="ui-button-info" icon="pi pi-search" pt:data-tooltip="#{messages.buttonDetay}"
                                 update=":PkSoruTanimViewForm:PkSoruTanimViewForm"
                                 oncomplete="PF('PkSoruTanimViewDialog').show()" disabled="#{empty pkSoruTanimController.selected}" onstart="PF('Loading').show()"
                                 onsuccess="PF('Loading').hide()"/>
                <p:commandButton id="deleteButton" styleClass="ui-button-danger" pt:data-tooltip="#{messages.buttonSil}" icon="pi pi-trash"
                                 actionListener="#{pkSoruTanimController.delete}"
                                 update=":growl,datalist" disabled="#{empty pkSoruTanimController.selected}"
                                 rendered="#{syKullaniciController.hasPermission('pksorutanim:sil')}">
                    <p:confirm header="#{messages.ConfirmationHeader}" message="#{messages.ConfirmDeleteMessage}" icon="pi pi-warning"/>
                </p:commandButton>
            </f:facet>

        </coco:datatable>


        <ui:include src="/confirmation.xhtml"/>

    </h:form>

</ui:composition>
