<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces"
      xmlns:coco="jakarta.faces.composite/ui">

<ui:composition>

    <coco:editpage id="PkVerilenHizmetEditForm"
                   widgetVar="PkVerilenHizmetEditDialog"
                   actionListener="#{pkVerilenHizmetController.save}"
                   listForm="PkVerilenHizmetListForm"
                   model="#{pkVerilenHizmetController.selected}">

        <p:outputLabel value="#{messages.tarihLabel}" for="@next"/>
        <p:datePicker locale="tr" pattern="#{messages.tarihFormat}"
                      value="#{pkVerilenHizmetController.selected.tarih}"
                      title="#{messages.tarihText}" mask="true"
                      monthNavigator="true" yearNavigator="true" showButtonBar="true"
                      showIcon="true" showOnFocus="false" required="true"/>

        <p:outputLabel value="#{messages.hizmetTurLabel}" for="@next"/>
        <p:selectOneMenu value="#{pkVerilenHizmetController.selected.pkHizmetTur}" title="#{messages.hizmetTurText}" required="true"
                         converter="omnifaces.SelectItemsConverter" filter="true">
            <f:selectItem itemLabel="#{messages.seciniz}" itemValue="#{null}"/>
            <f:selectItems value="#{pkHizmetTurController.items}"
                           var="hizmets"
                           itemValue="#{hizmets}"
                           itemLabel="#{hizmets.tanim}"/>
        </p:selectOneMenu>

        <p:outputLabel value="#{messages.tcKimlikNoLabel}" for="@next"/>
        <coco:inputWithButton id="inputWithButtonPkHasta" inputId="pkHastaId"
                              inputValue="#{pkVerilenHizmetController.selected.pkHasta.gnlKisi.tcKimlikNo}"
                              inputTitle="#{messages.tcKimlikNoText}"
                              actionListener="#{bysController.openCommonDialog('pkHastaSec')}"
                              ajaxListener="#{pkVerilenHizmetController.secilenPkHasta}"
                              buttonTitle="#{messages.hastaSecmelisiniz}"
                              size="50"
                              dialogId="PkVerilenHizmetCreateDialogId"/>

        <p:outputLabel value="#{messages.adLabel}" for="@next"/>
        <p:inputText id="ad" value="#{pkVerilenHizmetController.selected.pkHasta.gnlKisi.ad}"
                     title="#{messages.adText}"
                     size="50" maxlength="50" readonly="true" styleClass="inputUpdate"/>

        <p:outputLabel value="#{messages.soyadLabel}" for="@next"/>
        <p:inputText id="soyad" value="#{pkVerilenHizmetController.selected.pkHasta.gnlKisi.soyad}"
                     title="#{messages.soyadText}" size="50" maxlength="50" readonly="true" styleClass="inputUpdate"/>

        <p:outputLabel value="#{messages.telefonLabel}" for="@next"/>
        <h:panelGroup>
            <p:inputText value="#{pkVerilenHizmetController.selected.pkHasta.gnlKisi.telefon}"
                         styleClass="inputUpdate" readonly="true"/>
            <p:inputText value="#{pkVerilenHizmetController.selected.pkHasta.gnlKisi.telefon2}"
                         styleClass="inputUpdate" readonly="true"/>
        </h:panelGroup>

        <p:outputLabel value="#{messages.aciklamaLabel}" for="@next"/>
        <p:inputTextarea value="#{pkVerilenHizmetController.selected.aciklama}" autoResize="false" rows="4" styleClass="w-100" required="true"/>

    </coco:editpage>

</ui:composition>

</html>
