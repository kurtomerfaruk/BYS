<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces"
                xmlns:pt="jakarta.faces.passthrough"
                xmlns:coco="jakarta.faces.composite/ui">

    <h:form id="PkVerilenHizmetListForm" class="form-height">

        <p:contextMenu id="PkVerilenHizmetDataTableContextMenu" for="datalist:datalist">
            <p:menuitem value="#{messages.buttonEkle}" onclick="document.getElementById('PkVerilenHizmetListForm:datalist:datalist:createButton').click();"
                        icon="pi pi-plus" rendered="#{syKullaniciController.hasPermission('pkverilenhizmet:ekle')}"/>
            <p:menuitem value="#{messages.buttonGuncelle}" onclick="document.getElementById('PkVerilenHizmetListForm:datalist:datalist:editButton').click();"
                        icon="pi pi-pencil" rendered="#{syKullaniciController.hasPermission('pkverilenhizmet:guncelle')}"/>
            <p:menuitem value="#{messages.buttonDetay}" onclick="document.getElementById('PkVerilenHizmetListForm:datalist:datalist:viewButton').click();"
                        icon="pi pi-search"/>
            <p:menuitem value="#{messages.buttonSil}" onclick="document.getElementById('PkVerilenHizmetListForm:datalist:datalist:deleteButton').click();"
                        icon="pi pi-trash" rendered="#{syKullaniciController.hasPermission('pkverilenhizmet:sil')}"/>
        </p:contextMenu>

        <coco:datatable id="datalist"
                        value="#{pkVerilenHizmetController.lazyItems}"
                        rowKey="#{item.id}"
                        selection="#{pkVerilenHizmetController.selected}"
                        filtered="#{pkVerilenHizmetController.filtered}"
                        rowselect=":PkVerilenHizmetListForm:datalist:datalist:createButton,:PkVerilenHizmetListForm:datalist:datalist:viewButton,:PkVerilenHizmetListForm:datalist:datalist:editButton,:PkVerilenHizmetListForm:datalist:datalist:deleteButton"
                        rowDblselect="document.getElementById('PkVerilenHizmetListForm:datalist:datalist:editButton').click()"
                        contextMenu=":PkVerilenHizmetListForm:datalist:datalist:createButton :PkVerilenHizmetListForm:datalist:datalist:viewButton :PkVerilenHizmetListForm:datalist:datalist:editButton :PkVerilenHizmetListForm:datalist:datalist:deleteButton"
                        selectListener="#{pkVerilenHizmetController.resetParents}"
                        controller="#{pkVerilenHizmetController}"
                        header="#{messages.talepListesi}">

            <p:ajax event="colResize" listener="#{pkVerilenHizmetController.onResize}"/>


            <f:facet name="paginatorBottomLeft">
                <p:commandButton id="createButton" styleClass="ui-button-primary" icon="pi pi-plus" pt:data-tooltip="#{messages.buttonEkle}"
                                 actionListener="#{pkVerilenHizmetController.prepareCreate}" update=":PkVerilenHizmetCreateForm:PkVerilenHizmetCreateForm"
                                 oncomplete="PF('PkVerilenHizmetCreateDialog').show()" onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('pkverilenhizmet:ekle')}"/>
                <p:commandButton id="editButton" styleClass="ui-button-success" icon="pi pi-pencil" pt:data-tooltip="#{messages.buttonGuncelle}"
                                 update=":PkVerilenHizmetEditForm:PkVerilenHizmetEditForm"
                                 oncomplete="PF('PkVerilenHizmetEditDialog').show()" disabled="#{empty pkVerilenHizmetController.selected}" onstart="PF('Loading').show()"
                                 onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('pkverilenhizmet:guncelle')}"/>
                <p:commandButton id="viewButton" styleClass="ui-button-info" icon="pi pi-search" pt:data-tooltip="#{messages.buttonDetay}"
                                 update=":PkVerilenHizmetViewForm:PkVerilenHizmetViewForm"
                                 oncomplete="PF('PkVerilenHizmetViewDialog').show()" disabled="#{empty pkVerilenHizmetController.selected}" onstart="PF('Loading').show()"
                                 onsuccess="PF('Loading').hide()"/>
                <p:commandButton id="deleteButton" styleClass="ui-button-danger" pt:data-tooltip="#{messages.buttonSil}" icon="pi pi-trash"
                                 actionListener="#{pkVerilenHizmetController.delete}"
                                 update=":growl,datalist" disabled="#{empty pkVerilenHizmetController.selected}"
                                 rendered="#{syKullaniciController.hasPermission('pkverilenhizmet:sil')}">
                    <p:confirm header="#{messages.ConfirmationHeader}" message="#{messages.ConfirmDeleteMessage}" icon="pi pi-warning"/>
                </p:commandButton>
            </f:facet>

        </coco:datatable>


        <ui:include src="/confirmation.xhtml"/>

    </h:form>

</ui:composition>
