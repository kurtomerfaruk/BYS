<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces"
                xmlns:pt="jakarta.faces.passthrough"
                xmlns:coco="jakarta.faces.composite/ui">

    <h:form id="PkAileDurumListForm" class="form-height">

        <p:contextMenu id="PkAileDurumDataTableContextMenu" for="datalist:datalist">
            <p:menuitem value="#{messages.buttonEkle}"
                        onclick="document.getElementById('PkAileDurumListForm:datalist:datalist:createButton').click();"
                        icon="pi pi-plus" rendered="#{syKullaniciController.hasPermission('pkailedurum:ekle')}"/>
            <p:menuitem value="#{messages.buttonGuncelle}"
                        onclick="document.getElementById('PkAileDurumListForm:datalist:datalist:editButton').click();"
                        icon="pi pi-pencil" rendered="#{syKullaniciController.hasPermission('pkailedurum:guncelle')}"/>
            <p:menuitem value="#{messages.buttonDetay}" onclick="document.getElementById('PkAileDurumListForm:datalist:datalist:viewButton').click();"
                        icon="pi pi-search"/>
            <p:menuitem value="#{messages.buttonSil}" onclick="document.getElementById('PkAileDurumListForm:datalist:datalist:deleteButton').click();"
                        icon="pi pi-trash" rendered="#{syKullaniciController.hasPermission('pkailedurum:sil')}"/>
        </p:contextMenu>

        <coco:datatable id="datalist"
                        value="#{pkAileDurumController.lazyItems}"
                        rowKey="#{item.id}"
                        selection="#{pkAileDurumController.selected}"
                        filtered="#{pkAileDurumController.filtered}"
                        rowselect=":PkAileDurumListForm:datalist:datalist:createButton,:PkAileDurumListForm:datalist:datalist:viewButton,:PkAileDurumListForm:datalist:datalist:editButton,:PkAileDurumListForm:datalist:datalist:deleteButton"
                        rowDblselect="document.getElementById('PkAileDurumListForm:datalist:datalist:editButton').click()"
                        contextMenu=":PkAileDurumListForm:datalist:datalist:createButton :PkAileDurumListForm:datalist:datalist:viewButton :PkAileDurumListForm:datalist:datalist:editButton :PkAileDurumListForm:datalist:datalist:deleteButton"
                        selectListener="#{pkAileDurumController.resetParents}"
                        controller="#{pkAileDurumController}"
                        header="#{messages.aileDurumListesi}">

            <p:ajax event="colResize" listener="#{pkAileDurumController.onResize}"/>


            <f:facet name="paginatorBottomLeft">
                <p:commandButton id="createButton" styleClass="ui-button-primary" icon="pi pi-plus" pt:data-tooltip="#{messages.buttonEkle}"
                                 actionListener="#{pkAileDurumController.prepareCreate}" update=":PkAileDurumCreateForm:PkAileDurumCreateForm"
                                 oncomplete="PF('PkAileDurumCreateDialog').show()" onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('pkailedurum:ekle')}"/>
                <p:commandButton id="editButton" styleClass="ui-button-success" icon="pi pi-pencil" pt:data-tooltip="#{messages.buttonGuncelle}"
                                 update=":PkAileDurumEditForm:PkAileDurumEditForm"
                                 oncomplete="PF('PkAileDurumEditDialog').show()" disabled="#{empty pkAileDurumController.selected}"
                                 onstart="PF('Loading').show()"
                                 onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('pkailedurum:guncelle')}"/>
                <p:commandButton id="viewButton" styleClass="ui-button-info" icon="pi pi-search" pt:data-tooltip="#{messages.buttonDetay}"
                                 update=":PkAileDurumViewForm:PkAileDurumViewForm"
                                 oncomplete="PF('PkAileDurumViewDialog').show()" disabled="#{empty pkAileDurumController.selected}"
                                 onstart="PF('Loading').show()"
                                 onsuccess="PF('Loading').hide()"/>
                <p:commandButton id="deleteButton" styleClass="ui-button-danger" pt:data-tooltip="#{messages.buttonSil}" icon="pi pi-trash"
                                 actionListener="#{pkAileDurumController.delete}"
                                 update=":growl,datalist" disabled="#{empty pkAileDurumController.selected}"
                                 rendered="#{syKullaniciController.hasPermission('pkailedurum:sil')}">
                    <p:confirm header="#{messages.ConfirmationHeader}" message="#{messages.ConfirmDeleteMessage}" icon="pi pi-warning"/>
                </p:commandButton>
            </f:facet>

        </coco:datatable>


        <ui:include src="/confirmation.xhtml"/>

    </h:form>

</ui:composition>
