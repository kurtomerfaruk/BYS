<?xml version="1.0" encoding="UTF-8"?>

      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"

      xmlns:p="primefaces"

<ui:composition>

    <p:outputLabel value="#{messages.sabikaKaydiLabel}" for="@next"/>
    <h:panelGroup>
        <p:selectOneMenu value="#{pkAileController.selected.pkHastaAdliSicil.sabikaKaydi}"
                         converter="omnifaces.SelectItemsConverter">
            <f:selectItem itemValue="#{null}" itemLabel="#{messages.seciniz}"/>
            <f:selectItems value="#{enumVarYok.ALL_VALUES}"
                           var="varyok"
                           itemLabel="#{varyok.displayValue}"
                           itemValue="#{varyok}"/>
            <p:ajax event="change" update="sabikaKaydiAciklama"/>
        </p:selectOneMenu>
        <p:inputText id="sabikaKaydiAciklama"
                     value="#{pkAileController.selected.pkHastaAdliSicil.sabikaKaydiAciklama}"
