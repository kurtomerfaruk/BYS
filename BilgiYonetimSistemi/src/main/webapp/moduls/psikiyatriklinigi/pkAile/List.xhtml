<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces"
                xmlns:pt="jakarta.faces.passthrough"
                xmlns:coco="jakarta.faces.composite/ui">

    <h:form id="PkAileListForm" class="form-height">

        <p:contextMenu id="PkAileDataTableContextMenu" for="datalist:datalist">
            <p:menuitem value="#{messages.buttonEkle}"
                        onclick="document.getElementById('PkAileListForm:datalist:datalist:createButton').click();"
                        icon="pi pi-plus" rendered="#{syKullaniciController.hasPermission('pkaile:ekle')}"/>
            <p:menuitem value="#{messages.buttonGuncelle}"
                        onclick="document.getElementById('PkAileListForm:datalist:datalist:editButton').click();"
                        icon="pi pi-pencil" rendered="#{syKullaniciController.hasPermission('pkaile:guncelle')}"/>
            <p:menuitem value="#{messages.buttonDetay}"
                        onclick="document.getElementById('PkAileListForm:datalist:datalist:viewButton').click();"
                        icon="pi pi-search"/>
            <p:menuitem value="#{messages.buttonSil}"
                        onclick="document.getElementById('PkAileListForm:datalist:datalist:deleteButton').click();"
                        icon="pi pi-trash" rendered="#{syKullaniciController.hasPermission('pkaile:sil')}"/>
        </p:contextMenu>

        <coco:datatable id="datalist"
                        value="#{pkAileController.lazyItems}"
                        rowKey="#{item.id}"
                        selection="#{pkAileController.selected}"
                        filtered="#{pkAileController.filtered}"
                        rowselect=":PkAileListForm:datalist:datalist:createButton,:PkAileListForm:datalist:datalist:viewButton,:PkAileListForm:datalist:datalist:editButton,:PkAileListForm:datalist:datalist:deleteButton"
                        rowDblselect="document.getElementById('PkAileListForm:datalist:datalist:editButton').click()"
                        contextMenu=":PkAileListForm:datalist:datalist:createButton :PkAileListForm:datalist:datalist:viewButton :PkAileListForm:datalist:datalist:editButton :PkAileListForm:datalist:datalist:deleteButton"
                        selectListener="#{pkAileController.resetParents}"
                        controller="#{pkAileController}"
                        header="#{messages.aileListesi}">

            <p:ajax event="colResize" listener="#{pkAileController.onResize}"/>


            <f:facet name="paginatorBottomLeft">
                <p:commandButton id="createButton" styleClass="ui-button-primary" icon="pi pi-plus"
                                 pt:data-tooltip="#{messages.buttonEkle}"
                                 actionListener="#{pkAileController.prepareCreate}" update=":PkAileCreateForm"
                                 oncomplete="PF('PkAileCreateDialog').show()" onstart="PF('Loading').show()"
                                 onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('pkaile:ekle')}"/>
                <p:commandButton id="editButton" styleClass="ui-button-success" icon="pi pi-pencil"
                                 pt:data-tooltip="#{messages.buttonGuncelle}"
                                 update=":PkAileEditForm" oncomplete="PF('PkAileEditDialog').show()"
                                 disabled="#{empty pkAileController.selected}" onstart="PF('Loading').show()"
                                 onsuccess="PF('Loading').hide()"
                                 rendered="#{syKullaniciController.hasPermission('pkaile:guncelle')}"/>
                <p:commandButton id="viewButton" styleClass="ui-button-info" icon="pi pi-search"
                                 pt:data-tooltip="#{messages.buttonDetay}"
                                 update=":PkAileViewForm:PkAileViewForm"
                                 oncomplete="PF('PkAileViewDialog').show()"
                                 disabled="#{empty pkAileController.selected}" onstart="PF('Loading').show()"
                                 onsuccess="PF('Loading').hide()"/>
                <p:commandButton id="deleteButton" styleClass="ui-button-danger" pt:data-tooltip="#{messages.buttonSil}"
                                 icon="pi pi-trash"
                                 actionListener="#{pkAileController.delete}"
                                 update=":growl,datalist" disabled="#{empty pkAileController.selected}"
                                 rendered="#{syKullaniciController.hasPermission('pkaile:sil')}">
                    <p:confirm header="#{messages.ConfirmationHeader}" message="#{messages.ConfirmDeleteMessage}"
                               icon="pi pi-warning"/>
                </p:commandButton>
            </f:facet>

        </coco:datatable>

        <ui:include src="/confirmation.xhtml"/>

    </h:form>

</ui:composition>
