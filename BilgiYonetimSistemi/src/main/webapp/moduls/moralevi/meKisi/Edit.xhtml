<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="primefaces"
      xmlns:h="jakarta.faces.html">

<ui:composition>

    <p:dialog widgetVar="MeKisiEditDialog"
              id="MeKisiEditDialogId"
              modal="true"
              resizable="false"
              closeOnEscape="true"
              header="#{messages.dialogKayitGuncelle}"
              appendTo="@(body)"
              responsive="true"
              onShow="PF('MeKisiEditDialog').initPosition();adjustMenuWidth('MeKisiEditForm');"
              fitViewport="true"
              position="top">

        <h:form id="MeKisiEditForm" enctype="multipart/form-data">
            <h:panelGroup id="display">
                <p:focus context="display"/>
                <div class="card custom-card">

                    <div class="card-body">

                        <ul class="nav nav-tabs mb-3 tab-style-8 scaleX" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="meKisiBilgileriEditTab" data-bs-toggle="tab"
                                        data-bs-target="#meKisiBilgileriEditTabPane" type="button" role="tab"
                                        aria-controls="meKisiBilgileriEditTabPane" aria-selected="true">Kişi Bilgileri
                                </button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="meAileDurumuEditTab" data-bs-toggle="tab"
                                        data-bs-target="#meAileDurumuEditTabPane" type="button" role="tab"
                                        aria-controls="meAileDurumuEditTabPane" aria-selected="false">Aile Durumu
                                </button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="meEkonomikDurumuEditTab" data-bs-toggle="tab"
                                        data-bs-target="#meEkonomikDurumuEditTabPane" type="button" role="tab"
                                        aria-controls="meEkonomikDurumuEditTabPane" aria-selected="false">Ekonomik Durum
                                </button>
                            </li>
<!--                            <li class="nav-item" role="presentation">-->
<!--                                <button class="nav-link" id="meSosyalYardimEditTab" data-bs-toggle="tab"-->
<!--                                        data-bs-target="#meSosyalYardimEditTabPane" type="button" role="tab"-->
<!--                                        aria-controls="meSosyalYardimEditTabPane" aria-selected="false">Sosyal Yardım Durumu-->
<!--                                </button>-->
<!--                            </li>-->
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="meSaglikBilgileriEditTab" data-bs-toggle="tab"
                                        data-bs-target="#meSaglikBilgileriEditTabPane" type="button" role="tab"
                                        aria-controls="meSaglikBilgileriEditTabPane" aria-selected="false">Sağlık Bilgileri
                                </button>
                            </li>
                        </ul>

                        <div class="tab-content text-muted">
                            <div class="tab-pane show active" id="meKisiBilgileriEditTabPane">
                                <p:panelGrid id="kisiPanel" columns="2" styleClass="w-100"
                                             rendered="#{meKisiController.selected!=null}" layout="tabular">

                                    <ui:include src="/moduls/moralevi/meKisi/KisiBilgileriTab.xhtml"/>
                                </p:panelGrid>
                            </div>
                            <div class="tab-pane" id="meAileDurumuEditTabPane">

                                <p:panelGrid id="meAileDurumuPanel" columns="2" styleClass="w-100"
                                             rendered="#{meKisiController.selected!=null}" layout="tabular">

                                    <ui:include src="/moduls/moralevi/meKisi/AileDurumuTab.xhtml"/>

                                </p:panelGrid>
                            </div>
                            <div class="tab-pane" id="meEkonomikDurumuEditTabPane">
                                <p:panelGrid id="ekonomikDurumPanel" columns="2" styleClass="w-100"
                                             rendered="#{meKisiController.selected!=null}" layout="tabular">

                                    <ui:include src="/moduls/moralevi/meKisi/EkonomikDurumTab.xhtml"/>

                                </p:panelGrid>
                            </div>
<!--                            <div class="tab-pane" id="meSosyalYardimEditTabPane">-->
<!--                                <p:panelGrid id="meSosyalYardimPanel" columns="2" styleClass="w-100" rendered="#{meKisiController.selected!=null}"-->
<!--                                             layout="tabular">-->
<!--                                    <ui:include src="/moduls/moralevi/meKisi/SosyalYardimTab.xhtml"/>-->

<!--                                </p:panelGrid>-->
<!--                            </div>-->
                            <div class="tab-pane" id="meSaglikBilgileriEditTabPane">
                                <p:panelGrid id="meSaglikBilgileriEditPanel" columns="2" styleClass="w-100" rendered="#{meKisiController.selected!=null}"
                                             layout="tabular">
                                    <ui:include src="/moduls/moralevi/meKisi/SaglikBilgileriTab.xhtml"/>
                                </p:panelGrid>
                            </div>
                        </div>
                    </div><!-- end card-body -->
                    <div class="card-footer">
                        <div class="float-end">
                            <p:commandButton icon="pi pi-check" styleClass="ui-button-success"
                                             actionListener="#{meKisiController.update}"
                                             value="#{messages.buttonKaydet}"
                                             update="display,:EyKisiListForm:datalist:datalist,:growl"
                                             oncomplete="handleSubmit(xhr,status,args,PF('MeKisiEditDialog'));"
                                             onstart="PF('Loading').show()" onsuccess="PF('Loading').hide()"/>
                            <p:commandButton icon="pi pi-times" styleClass="ui-button-danger"
                                             value="#{messages.buttonIptal}" onclick="PF('MeKisiEditDialog').hide()"
                                             immediate="true" onstart="PF('Loading').show()"
                                             onsuccess="PF('Loading').hide()"/>
                        </div>
                    </div>
                </div>
            </h:panelGroup>
        </h:form>

    </p:dialog>

<!--            }-->

</ui:composition>

</html>
