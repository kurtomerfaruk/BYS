<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="primefaces"
      xmlns:f="jakarta.faces.core">

<h:head>
    <h:outputScript library="primefaces" name="jquery/jquery.js"/>
    <h:outputScript library="primefaces" name="jquery/jquery-plugins.js"/>
    <h:outputStylesheet library="css" name="pfcrud.css"/>
</h:head>
<h:body>

    <h:form id="TabTalepSec">
        <p:dataTable id="datalist"
                     value="#{tabTalepController.lazyItems}"
                     var="item"
                     rowKey="#{item.id}"
                     paginator="true"
                     rows="10"
                     selection="#{tabTalepController.selected}"
                     paginatorPosition="bottom"
                     lazy="true"
                     pageLinks="5"
                     filteredValue="#{tabTalepController.filtered}"
                     paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                     currentPageReportTemplate="#{messages.currentPageTemplate}"
                     emptyMessage="#{messages.kayitBulunamadi}"
                     size="small"
                     styleClass="w-100">

            <f:facet name="header">
                #{messages.talepListesi}
            </f:facet>

            <p:ajax event="rowDblselect" listener="#{tabTalepController.onRowDoubleSelect}"/>

            <p:column sortBy="#{item.talepNo}" filterBy="#{item.talepNo}">
                <f:facet name="header"><h:outputText value="#{messages.talepNoText}"/></f:facet>
                <h:outputText value="#{item.talepNo}"/>
            </p:column>

            <p:column sortBy="#{item.tabKisi.gnlKisi.ad}" filterBy="#{item.tabKisi.gnlKisi.ad}">
                <f:facet name="header"><h:outputText value="#{messages.adText}"/></f:facet>
                <h:outputText value="#{item.tabKisi.gnlKisi.ad}"/>
            </p:column>

            <p:column sortBy="#{item.tabKisi.gnlKisi.soyad}" filterBy="#{item.tabKisi.gnlKisi.soyad}">
                <f:facet name="header"><h:outputText value="#{messages.soyadText}"/></f:facet>
                <h:outputText value="#{item.tabKisi.gnlKisi.soyad}"/>
            </p:column>

            <p:column sortBy="#{item.durum}" filterBy="#{item.durum}">
                <f:facet name="header"><h:outputText value="#{messages.durumLabel}"/></f:facet>
                <h:outputText value="#{item.durum.displayValue}"/>
            </p:column>

            <p:column headerText="#{messages.buttonSec}" style="width: 70px;text-align: center">
                <p:commandButton icon="pi pi-check" actionListener="#{tabTalepController.closeSelection(item)}"
                                 style="width: 20px !important; height: 20px !important;"/>
            </p:column>

        </p:dataTable>
    </h:form>

</h:body>
</html>
