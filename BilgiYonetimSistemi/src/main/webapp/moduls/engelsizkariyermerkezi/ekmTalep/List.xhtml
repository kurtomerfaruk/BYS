<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces"
                xmlns:pt="jakarta.faces.passthrough"
                xmlns:coco="jakarta.faces.composite/ui">

    <h:form id="EkmTalepListForm" styleClass="form-height">

        <p:contextMenu id="EkmTalepDataTableContextMenu" for="datalist:datalist">
            <p:menuitem value="#{messages.buttonEkle}"
                        onclick="document.getElementById('EkmTalepListForm:datalist:datalist:createButton').click();"
                        icon="pi pi-plus" rendered="#{syKullaniciController.hasPermission('ekmtalep:ekle')}"/>
            <p:menuitem value="#{messages.buttonGuncelle}"
                        onclick="document.getElementById('EkmTalepListForm:datalist:datalist:editButton').click();"
                        icon="pi pi-pencil" rendered="#{syKullaniciController.hasPermission('ekmtalep:guncelle')}"/>
            <p:menuitem value="#{messages.buttonDetay}"
                        onclick="document.getElementById('EkmTalepListForm:datalist:datalist:viewButton').click();"
                        icon="pi pi-search"/>
            <p:menuitem value="#{messages.buttonSil}"
                        onclick="document.getElementById('EkmTalepListForm:datalist:datalist:deleteButton').click();"
                        icon="pi pi-trash" rendered="#{syKullaniciController.hasPermission('ekmtalep:sil')}"/>
        </p:contextMenu>
        <coco:datatable id="datalist"
                        value="#{ekmTalepController.lazyItems}"
                        rowKey="#{item.id}"
                        selection="#{ekmTalepController.selected}"
                        filtered="#{ekmTalepController.filtered}"
                        rowselect=":EkmTalepListForm:datalist:datalist:createButton,:EkmTalepListForm:datalist:datalist:viewButton,:EkmTalepListForm:datalist:datalist:editButton,:EkmTalepListForm:datalist:datalist:deleteButton"
                        rowDblselect="document.getElementById('EkmTalepListForm:datalist:datalist:editButton').click()"
                        contextMenu=":EkmTalepListForm:datalist:datalist:createButton :EkmTalepListForm:datalist:datalist:viewButton :EkmTalepListForm:datalist:datalist:editButton :EkmTalepListForm:datalist:datalist:deleteButton"
                        selectListener="#{ekmTalepController.resetParents}"
                        controller="#{ekmTalepController}"
                        header="#{messages.talepListesi}">

            <p:ajax event="colResize" listener="#{ekmTalepController.onResize}"/>

            <f:facet name="paginatorBottomLeft">
                    <p:commandButton id="createButton" styleClass="ui-button-primary" icon="pi pi-plus"
                                     pt:data-tooltip="#{messages.buttonEkle}"
                                     actionListener="#{ekmTalepController.prepareCreate}"
                                     update=":EkmTalepCreateForm:EkmTalepCreateForm"
                                     oncomplete="PF('EkmTalepCreateDialog').show()" onstart="PF('Loading').show()"
                                     onsuccess="PF('Loading').hide()"
                                     rendered="#{syKullaniciController.hasPermission('ekmtalep:ekle')}"/>
                    <p:commandButton id="editButton" styleClass="ui-button-success" icon="pi pi-pencil"
                                     pt:data-tooltip="#{messages.buttonGuncelle}"
                                     update=":EkmTalepEditForm:EkmTalepEditForm"
                                     oncomplete="PF('EkmTalepEditDialog').show()"
                                     disabled="#{empty ekmTalepController.selected}" onstart="PF('Loading').show()"
                                     onsuccess="PF('Loading').hide()"
                                     rendered="#{syKullaniciController.hasPermission('ekmtalep:guncelle')}"/>
                    <p:commandButton id="viewButton" styleClass="ui-button-info" icon="pi pi-search"
                                     pt:data-tooltip="#{messages.buttonDetay}" update=":EkmTalepViewForm:EkmTalepViewForm"
                                     oncomplete="PF('EkmTalepViewDialog').show()"
                                     disabled="#{empty ekmTalepController.selected}" onstart="PF('Loading').show()"
                                     onsuccess="PF('Loading').hide()"/>
                    <p:commandButton id="deleteButton" styleClass="ui-button-danger" icon="pi pi-trash"
                                     pt:data-tooltip="#{messages.buttonSil}"
                                     actionListener="#{ekmTalepController.delete}" update=":growl,datalist"
                                     disabled="#{empty ekmTalepController.selected}"
                                     rendered="#{syKullaniciController.hasPermission('ekmtalep:sil')}">
                        <p:confirm header="#{messages.ConfirmationHeader}" message="#{messages.ConfirmDeleteMessage}"
                                   icon="pi pi-warning"/>
                    </p:commandButton>
            </f:facet>

        </coco:datatable>


        <ui:include src="/confirmation.xhtml"/>

    </h:form>

</ui:composition>
