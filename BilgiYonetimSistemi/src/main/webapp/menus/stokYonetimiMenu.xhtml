<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"

<html xmlns="http://www.w3.org/1999/xhtml"

<ui:composition>

    <ui:fragment rendered="#{syKullaniciController.hasPermission('stok_yonetimi:goster')}">

                <span class="side-menu__label">Stok Yönetimi</span>
                <i class="ri-arrow-right-s-line side-menu__angle"></i>
            </a>
            <ul class="slide-menu child1">
                <li class="slide side-menu__label1">
                    <a href="javascript:void(0)">Stok Yönetimi</a>
                </li>

                <!--    Islemler    -->
                <ui:fragment rendered="#{syKullaniciController.hasPermission('stok_yonetimi_islemler:goster')}">
                    <li class="slide has-sub">

                        <ul class="slide-menu child2">

                            <ui:fragment rendered="#{syKullaniciController.hasPermission('meanket:goster')}">
                                <li class="slide">
                                    <p:commandLink styleClass="side-menu__item sublevel2"

                                                   onstart="PF('Loading').show()"
                                                   onsuccess="PF('Loading').hide()"

                            </ui:fragment>


                        </ul>
                    </li>
                </ui:fragment>

                        <ul class="slide-menu child2">

                            <ui:fragment rendered="#{syKullaniciController.hasPermission('stbirim:goster')}">
                                <li class="slide">
                                    <p:commandLink styleClass="side-menu__item sublevel2"

                                                   onsuccess="PF('Loading').hide()"

                            </ui:fragment>

                            <ui:fragment rendered="#{syKullaniciController.hasPermission('stdepo:goster')}">
                                <li class="slide">
                                    <p:commandLink styleClass="side-menu__item sublevel2"
                                                   actionListener="#{menuController.setPageLink('/moduls/stokyonetimi/stDepo/index')}"
                                                   update="myPanel,:growl"
                                                   onstart="PF('Loading').show()"
                                                   onsuccess="PF('Loading').hide()"

                                </li>
                            </ui:fragment>

                        </ul>
