<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"

<ui:composition>

            </a>
            <ul class="slide-menu child1">
                <li class="slide side-menu__label1">
                    <a href="javascript:void(0)">Tabanlık Yönetimi</a>

                <!--    Islemler    -->
                <ui:fragment rendered="#{syKullaniciController.hasPermission('tabanlik_islemler:goster')}">

                        <ul class="slide-menu child2">

                            <ui:fragment rendered="#{syKullaniciController.hasPermission('tabkisi:goster')}">

                                                   onsuccess="PF('Loading').hide()"

                            </ui:fragment>

                            <ui:fragment rendered="#{syKullaniciController.hasPermission('tabrandevu:goster')}">
                                <li class="slide">
                                    <p:commandLink styleClass="side-menu__item sublevel2"
                                                   actionListener="#{menuController.setPageLink('/moduls/tabanlik/tabRandevu/index')}"

                                                   onstart="PF('Loading').show()"
                                                   onsuccess="PF('Loading').hide()"
                                                   value="Randevular"/>
                                </li>
                            </ui:fragment>

                            <ui:fragment rendered="#{syKullaniciController.hasPermission('tabtalep:goster')}">
                                <li class="slide">

                <ui:fragment rendered="#{syKullaniciController.hasPermission('tabanlik_tanimlamalar:goster')}">
