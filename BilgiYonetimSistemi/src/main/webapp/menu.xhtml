<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
>

<ui:composition>
    <aside class="app-sidebar sticky" id="sidebar">

        <!-- Start::main-sidebar-header -->
        <div class="main-sidebar-header">
            <a href="#{request.contextPath}/index.xhtml" class="header-logo">
                <h:graphicImage id="graphic12" library="images" name="gbb_logo_new.png" alt="logo" styleClass="desktop-logo"/>
                <h:graphicImage id="graphic13" library="images" name="gbb_logo_new.png" alt="logo" styleClass="toggle-logo"/>
                <h:graphicImage id="graphic14" library="images" name="gbb_logo_new.png" alt="logo" styleClass="desktop-dark"/>
                <h:graphicImage id="graphic15" library="images" name="gbb_logo_new.png" alt="logo" styleClass="toggle-dark"/>
            </a>
        </div>
        <!-- End::main-sidebar-header -->

        <div class="main-sidebar" id="sidebar-scroll">

            <!-- Menu Search -->
            <div class="px-3 py-2" id="menu-search-container">
                <div class="input-group input-group-sm">
                    <span class="input-group-text"><i class="ri-search-line"></i></span>
                    <input type="text" id="menuSearchInput" class="form-control" placeholder="Menü ara..." autocomplete="off"/>
                </div>
            </div>

            <nav class="main-menu-container nav nav-pills flex-column sub-open">
                <div class="slide-left" id="slide-left">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="#7b8191" width="24" height="24" viewBox="0 0 24 24"> <path d="M13.293 6.293 7.586 12l5.707 5.707 1.414-1.414L10.414 12l4.293-4.293z"></path> </svg>
                </div>
                <ul class="main-menu">

                    <!-- Aktif Yasam -->
                    <ui:include src="menus/aktifYasamMenu.xhtml"/>
                    <!-- Aktif Yasam -->

                    <!-- Engelli Kariyer Merkezi -->
                    <ui:include src="menus/engelsizKariyerMerkeziMenu.xhtml"/>
                    <!-- Engelli Kariyer Merkezi -->

                    <!-- Engelsizler -->
                    <ui:include src="menus/engelsizlerMenu.xhtml"/>
                    <!-- Engelsizler -->

                    <!-- Evde Yasama Destek -->
                    <ui:include src="menus/evimDunyalaraBedelMenu.xhtml"/>
                    <!-- Evde Yasama Destek -->

                    <!-- Genel -->
                    <ui:include src="menus/genelMenu.xhtml"/>
                    <!-- Genel -->

                    <!-- Hafriyat -->
                    <ui:include src="menus/hafriyatMenu.xhtml"/>
                    <!-- Hafriyat -->

                    <!-- Ileri Yas -->
                    <ui:include src="menus/ileriYasMenu.xhtml"/>
                    <!-- Ileri Yas -->

                    <!-- Moral Evi -->
                    <ui:include src="menus/moralEviMenu.xhtml"/>
                    <!-- Moral Evi -->

                    <!-- Ortez Protez -->
                    <ui:include src="menus/ortezProtezMenu.xhtml"/>
                    <!-- Ortez Protez -->

                    <!-- Psikiyatri Klinigi -->
                    <ui:include src="menus/psikiyatriKlinigiMenu.xhtml"/>
                    <!-- Psikiyatri Klinigi -->

                    <!-- Saglik Hizmetleri -->
                    <ui:include src="menus/saglikHizmetleriMenu.xhtml"/>
                    <!-- Saglik Hizmetleri -->

                    <!-- Sistem Yonetimi -->
                    <ui:include src="menus/sistemYonetimiMenu.xhtml"/>
                    <!-- Sistem Yonetimi -->

                </ul>
                <div class="slide-right" id="slide-right"><svg xmlns="http://www.w3.org/2000/svg" fill="#7b8191" width="24" height="24" viewBox="0 0 24 24"> <path d="M10.707 17.707 16.414 12l-5.707-5.707-1.414 1.414L13.586 12l-4.293 4.293z"></path> </svg></div>
            </nav>

            <!-- Version label (fixed at bottom of sidebar) -->
            <div id="menu-version-label" class="text-center small text-muted"
                 style="bottom:0; left:0; right:0; background:var(--menu-bg); border-top:1px solid rgba(0,0,0,.1); z-index:2;">
                <span class="badge bg-success">Ver#{initApp.version}</span><br/><span class="badge bg-outline-info">#{initApp.buildTime}</span>
            </div>

        </div>
    </aside>

</ui:composition>

</html>
