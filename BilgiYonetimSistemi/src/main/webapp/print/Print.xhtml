<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="primefaces"
      xmlns:pe="primefaces.extensions">
<h:body>
    <p:dialog id="PrintDlg"
              widgetVar="PrintDialog"
              closeOnEscape="true"
              appendTo="@(body)"
              header="Yazdır"
              modal="true"
              resizable="false"
              draggable="false"
              responsive="true"
              fitViewport="true"
              width="98vw"
              height="95vh"
              onShow="updateViewer();">

        <h:form id="PrintForm" style="height: calc(95vh - 80px);">

            <p:remoteCommand name="updateViewer" update="viewer"/>

            <pe:documentViewer id="viewer"
                               url="/ReportServlet?ts=#{now.time}"
                               download="Rapor.pdf"
                               zoom="auto"
                               transient="true"
                               locale="tr"
                               height="100%"
                               width="100%"
                               cache="false"/>

        </h:form>

    </p:dialog>
</h:body>
</html>
